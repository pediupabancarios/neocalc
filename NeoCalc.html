            </div>
            <div style={{fontSize:10,color:"#7DD3FC",marginTop:6}}>⚠️ Decisões baseadas no contexto clínico + evolução temporal. OI persistentemente elevado &gt;4-6h reforça indicação de escalonamento.</div>
          </div>
        </div>
      ))}
    </Modal>
  );
}

// ── GASOMETRIA CALCULATOR ─────────────────────────────────────────────────────
function GasometriaCalc({onClose}){
  const [tipo,setTipo]=useState("arterial");
  const [vals,setVals]=useState({ph:"",pco2:"",po2:"",hco3:"",be:"",spo2:"",na:"",cl:""});
  const [peso,setPeso]=useState("");
  const [vm,setVm]=useState(false); // em ventilação mecânica?
  const [params,setParams]=useState({fr:"",vt:"",peep:"",fio2:"",pip:""});
  const [res,setRes]=useState(null);
  const sv=(k,v)=>setVals(x=>({...x,[k]:v}));
  const sp=(k,v)=>setParams(x=>({...x,[k]:v}));

  const calcular=()=>{
    const ph=parseFloat(vals.ph),pco2=parseFloat(vals.pco2),hco3=parseFloat(vals.hco3);
    const po2=parseFloat(vals.po2)||null, be=parseFloat(vals.be)||null;
    if(isNaN(ph)||isNaN(pco2)||isNaN(hco3)){setRes({erro:"pH, PCO₂ e HCO₃⁻ são obrigatórios."});return;}
    if(ph<6.5||ph>7.8){setRes({erro:"pH fora da faixa esperada (6,5–7,8)."});return;}
    if(pco2<5||pco2>150){setRes({erro:"PCO₂ fora da faixa (5–150 mmHg)."});return;}

    // ── 1. DISTÚRBIO PRIMÁRIO ─────────────────────────────────────────────────
    const acidemia=ph<7.35, alcalemia=ph>7.45;
    const resp_acid=pco2>45, resp_alc=pco2<35;
    const meta_acid=hco3<22, meta_alc=hco3>26;

    let disturbio="", distCorList=[], misto=false;
    let corVM=[], corTrat=[];

    // Classifica distúrbio primário
    if(acidemia&&resp_acid&&!meta_acid) disturbio="Acidose Respiratória Pura";
    else if(acidemia&&resp_acid&&meta_acid){disturbio="Acidose Mista (Resp. + Metabólica)";misto=true;}
    else if(acidemia&&meta_acid&&!resp_acid) disturbio="Acidose Metabólica Pura";
    else if(acidemia&&meta_acid&&resp_alc){disturbio="Acidose Metabólica com compensação resp.";misto=false;}
    else if(alcalemia&&resp_alc&&!meta_alc) disturbio="Alcalose Respiratória Pura";
    else if(alcalemia&&resp_alc&&meta_alc){disturbio="Alcalose Mista (Resp. + Metabólica)";misto=true;}
    else if(alcalemia&&meta_alc&&!resp_alc) disturbio="Alcalose Metabólica Pura";
    else if(alcalemia&&meta_alc&&resp_alc){disturbio="Alcalose Metabólica com compensação resp.";}
    else if(!acidemia&&!alcalemia&&resp_acid&&meta_alc){disturbio="Distúrbio Misto compensado (Ac.Resp + Alc.Meta)";misto=true;}
    else if(!acidemia&&!alcalemia&&resp_alc&&meta_acid){disturbio="Distúrbio Misto compensado (Alc.Resp + Ac.Meta)";misto=true;}
    else disturbio="Gasometria Normal / Compensada";

    // Gravidade pelo pH
    let gravPh,corPh,bgPh,emojiPh;
    if(ph>=7.35&&ph<=7.45){gravPh="Normal";corPh="#16A34A";bgPh="#DCFCE7";emojiPh="✅";}
    else if(ph>=7.25&&ph<7.35){gravPh="Acidemia Leve";corPh="#D97706";bgPh="#FEF9C3";emojiPh="⚠️";}
    else if(ph>=7.10&&ph<7.25){gravPh="Acidemia Moderada";corPh="#EA580C";bgPh="#FFF7ED";emojiPh="🔴";}
    else if(ph<7.10){gravPh="Acidemia Grave";corPh="#DC2626";bgPh="#FEE2E2";emojiPh="🚨";}
    else if(ph>7.45&&ph<=7.55){gravPh="Alcalemia Leve";corPh="#0369A1";bgPh="#F0F9FF";emojiPh="⚠️";}
    else if(ph>7.55&&ph<=7.65){gravPh="Alcalemia Moderada";corPh="#7C3AED";bgPh="#F5F3FF";emojiPh="🔴";}
    else{gravPh="Alcalemia Grave";corPh="#6D28D9";bgPh="#EDE9FE";emojiPh="🚨";}

    // ── 2. COMPENSAÇÃO ESPERADA ───────────────────────────────────────────────
    let compens="",compOK=false;
    if(disturbio.includes("Acidose Metabólica")){
      const pco2Esp=1.5*hco3+8; const margem=2;
      compOK=Math.abs(pco2-pco2Esp)<=margem;
      compens=`PCO₂ esperado (Winters): ${(pco2Esp-margem).toFixed(1)}–${(pco2Esp+margem).toFixed(1)} mmHg → atual: ${pco2} mmHg → ${compOK?"Compensação adequada":"Distúrbio adicional / compensação inadequada"}`;
    } else if(disturbio.includes("Alcalose Metabólica")){
      const pco2Esp=0.7*(hco3-24)+40; const margem=2;
      compOK=Math.abs(pco2-pco2Esp)<=margem;
      compens=`PCO₂ esperado: ${(pco2Esp-margem).toFixed(1)}–${(pco2Esp+margem).toFixed(1)} mmHg → atual: ${pco2} mmHg → ${compOK?"Compensação adequada":"Compensação inadequada"}`;
    } else if(disturbio.includes("Acidose Respiratória")){
      const hco3Esp=24+0.1*(pco2-40); const margem=2;
      compOK=Math.abs(hco3-hco3Esp)<=margem;
      compens=`HCO₃⁻ esperado (agudo): ${(hco3Esp-margem).toFixed(1)}–${(hco3Esp+margem).toFixed(1)} mEq/L → atual: ${hco3} mEq/L → ${compOK?"Compatível c/ agudo":"Possível componente crônico ou distúrbio adicional"}`;
    } else if(disturbio.includes("Alcalose Respiratória")){
      const hco3Esp=24-0.2*(40-pco2); const margem=2;
      compOK=Math.abs(hco3-hco3Esp)<=margem;
      compens=`HCO₃⁻ esperado (agudo): ${(hco3Esp-margem).toFixed(1)}–${(hco3Esp+margem).toFixed(1)} mEq/L → atual: ${hco3} mEq/L → ${compOK?"Compensação adequada":"Possível componente crônico"}`;
    } else compens="Gasometria dentro dos limites normais. Nenhuma compensação necessária.";

    // ── 3. ANION GAP ──────────────────────────────────────────────────────────
    let agStr="", agAlto=false, deltaDelta="";
    const naV=parseFloat(vals.na), clV=parseFloat(vals.cl);
    if(!isNaN(naV)&&!isNaN(clV)){
      const ag=naV-clV-hco3;
      agAlto=ag>12;
      agStr=`Ânion Gap = ${naV} − ${clV} − ${hco3} = ${ag.toFixed(1)} mEq/L → ${ag>16?"ELEVADO (>16)":ag>12?"Limítrofe (12–16)":"Normal (≤12)"}`;
      if(agAlto&&disturbio.includes("Acidose Metabólica")){
        const delta=(ag-12)/(24-hco3);
        deltaDelta=`Δ/Δ = ${delta.toFixed(2)} → ${delta<0.4?"Acidose metabólica hiperclorêmica pura":delta<=1?"Acidose metabólica AG elevado puro":delta<=2?"Distúrbio misto (AG + hiperclorêmica)":"Alcalose metabólica associada"}`;
      }
    }

    // ── 4. BICARBONATO DE SÓDIO (correção metabólica) ─────────────────────────
    let bicarb="";
    const pesoN=parseFloat(peso);
    if(meta_acid&&ph<7.20&&!isNaN(pesoN)&&pesoN>0){
      const defBase=be?Math.abs(be):Math.abs(hco3-24);
      const doseTotal=(defBase*pesoN*0.3).toFixed(1);
      const dose13=(parseFloat(doseTotal)/3).toFixed(1);
      bicarb=`NaHCO₃ 8,4% (1mEq/ml): Dose = BE × peso × 0,3 = ${defBase.toFixed(1)} × ${pesoN} × 0,3 = ${doseTotal} mEq\n→ Dar 1/3 (${dose13} mEq) lentamente EV em 30–60min, diluído em AD 1:1\n→ Reavaliar gasometria 30–60min após`;
    } else if(meta_acid&&ph<7.20){
      bicarb="Informe o peso para calcular a dose de bicarbonato.";
    }

    // ── 5. OXIGENAÇÃO ─────────────────────────────────────────────────────────
    let oxStr="",oxCor="#16A34A",oxEmoji="✅";
    if(po2!==null&&tipo==="arterial"){
      if(po2>=80&&po2<=100){oxStr="PaO₂ normal (80–100 mmHg)";oxCor="#16A34A";oxEmoji="✅";}
      else if(po2>=60&&po2<80){oxStr="Hipoxemia leve (60–79 mmHg)";oxCor="#D97706";oxEmoji="⚠️";}
      else if(po2>=40&&po2<60){oxStr="Hipoxemia moderada (40–59 mmHg)";oxCor="#EA580C";oxEmoji="🔴";}
      else if(po2<40){oxStr="Hipoxemia grave (<40 mmHg)";oxCor="#DC2626";oxEmoji="🚨";}
      else if(po2>100){oxStr="Hiperoxia (>100 mmHg) — Reduzir FiO₂";oxCor="#7C3AED";oxEmoji="⚠️";}
    }

    // ── 6. CORREÇÕES NO VM ────────────────────────────────────────────────────
    if(vm){
      const frN=parseFloat(params.fr),vtN=parseFloat(params.vt),peepN=parseFloat(params.peep),fio2N=parseFloat(params.fio2),pipN=parseFloat(params.pip);
      if(pco2>55){
        corVM.push({tipo:"PCO₂ ELEVADO",cor:"#DC2626",bg:"#FEE2E2",acoes:[
          `↑ Frequência respiratória em +5–10 irpm (atual: ${isNaN(frN)?"—":frN} → ${isNaN(frN)?"—":frN+8} irpm)`,
          `↑ Volume corrente em +0,5–1 ml/kg (atual: ${isNaN(vtN)?"—":vtN} ml/kg → ${isNaN(vtN)?"—":(vtN+0.5).toFixed(1)} ml/kg; máx 6ml/kg)`,
          "↑ Tempo inspiratório se Ti muito curto",
          "Verificar vazamento de cuff/tubo",
        ]});
      } else if(pco2<30){
        corVM.push({tipo:"PCO₂ BAIXO — Hiperventilação",cor:"#7C3AED",bg:"#EDE9FE",acoes:[
          `↓ Frequência respiratória em −4–6 irpm (atual: ${isNaN(frN)?"—":frN} → ${isNaN(frN)?"—":Math.max(20,frN-5)} irpm)`,
          `↓ Volume corrente em −0,5 ml/kg (atual: ${isNaN(vtN)?"—":vtN} ml/kg → ${isNaN(vtN)?"—":(vtN-0.5).toFixed(1)} ml/kg)`,
          "Atenção: hiperventilação → vasoconstrição cerebral em neonatos",
        ]});
      }
      if(po2!==null&&tipo==="arterial"){
        if(po2<60){
          corVM.push({tipo:"HIPOXEMIA — Ajustar VM",cor:"#EA580C",bg:"#FFF7ED",acoes:[
            `↑ FiO₂ em +10% (atual: ${isNaN(fio2N)?"—":fio2N}% → ${isNaN(fio2N)?"—":Math.min(100,fio2N+10)}%)`,
            `↑ PEEP em +1–2 cmH₂O (atual: ${isNaN(peepN)?"—":peepN} → ${isNaN(peepN)?"—":peepN+2} cmH₂O; máx 8 cmH₂O em neonatos)`,
            `↑ PIP se necessário (atual: ${isNaN(pipN)?"—":pipN} cmH₂O; delta P=PIP-PEEP deve ser ≥10)`,
            "Verificar obstrução/dobradura do tubo, posição",
          ]});
        } else if(po2>100){
          corVM.push({tipo:"HIPEROXIA — Reduzir FiO₂",cor:"#0369A1",bg:"#F0F9FF",acoes:[
            `↓ FiO₂ em −5–10% (atual: ${isNaN(fio2N)?"—":fio2N}% → ${isNaN(fio2N)?"—":Math.max(21,fio2N-10)}%)`,
            "Alvo SpO₂: 91–95% em RNPT; 95–98% em RN a termo",
            "Hiperoxia → retinopatia, displasia broncopulmonar em RNPT",
          ]});
        }
      }
      if(ph<7.25&&!meta_acid){
        corVM.push({tipo:"ACIDOSE RESP. GRAVE — VM",cor:"#DC2626",bg:"#FEE2E2",acoes:[
          `↑ FR + VT para aumentar ventilação minuto`,
          `↑ PIP em +2 cmH₂O se volumes baixos`,
          "Considerar VAFO se OI elevado",
          "Descartar pneumotórax, obstrução, atelectasia",
        ]});
      }
      if(ph>7.55){
        corVM.push({tipo:"ALCALOSE — VM",cor:"#7C3AED",bg:"#EDE9FE",acoes:[
          `↓ FR em −5–10 irpm`,
          `↓ VT em −0,5 ml/kg`,
          "Se alcalose metabólica: tratar causa base (hipocalemia, hipovolemia)",
        ]});
      }
    }

    // ── 7. TRATAMENTOS ────────────────────────────────────────────────────────
    if(disturbio.includes("Acidose Metabólica")){
      if(agAlto){
        corTrat.push("🔍 Investigar causa AG elevado: sepse, hipóxia, cetoacidose, hipoglicemia, erros inatos do metabolismo, salicilatos");
        corTrat.push("💉 Se sepse: hemocultura + antibioticoterapia empírica");
        corTrat.push("🍼 Otimizar perfusão: volume, inotrópicos se necessário");
        corTrat.push("🩺 Glicemia urgente — corrigir hipoglicemia se presente");
      } else {
        corTrat.push("🔍 Investigar acidose hiperclorêmica: reposição excessiva de NaCl, ATR, diarreia");
        corTrat.push("💧 Reduzir oferta de cloreto se iatrogênica");
      }
      if(bicarb) corTrat.push("⚗️ Bicarbonato: "+bicarb);
      if(ph<7.20) corTrat.push("🚨 pH <7,20 → Tratar causa + considerar correção com NaHCO₃");
    }
    if(disturbio.includes("Alcalose Metabólica")){
      corTrat.push("🔍 Investigar: vômitos, aspiração gástrica, hipocalemia, excesso de bicarbonato, furosemida");
      corTrat.push("💊 Corrigir hipocalemia se presente (KCl EV)");
      corTrat.push("💧 Repor volume se depleção");
    }
    if(disturbio.includes("Acidose Respiratória")&&!vm){
      corTrat.push("🫁 Suporte ventilatório: CPAP, VNI ou IOT + VM conforme gravidade");
      corTrat.push("💊 Surfactante se SDR em RNPT");
      corTrat.push("🏥 Avaliar necessidade de intubação urgente");
    }
    if(disturbio.includes("Alcalose Respiratória")&&!vm){
      corTrat.push("🔍 Causas: febre, dor, sepse precoce, hiperestimulação, anxiedade");
      corTrat.push("💊 Tratar a causa base");
    }
    if(disturbio.includes("Normal")){
      corTrat.push("✅ Gasometria dentro dos limites normais para neonatos/pediatria");
      corTrat.push("📋 Manter monitoramento conforme estado clínico");
    }

    setRes({disturbio,gravPh,corPh,bgPh,emojiPh,compens,agStr,agAlto,deltaDelta,oxStr,oxCor,oxEmoji,bicarb,corVM,corTrat,misto,ph,pco2,hco3,po2,be,tipo});
  };

  const limpar=()=>{setVals({ph:"",pco2:"",po2:"",hco3:"",be:"",spo2:"",na:"",cl:""});setPeso("");setVm(false);setParams({fr:"",vt:"",peep:"",fio2:"",pip:""});setRes(null);};

  const inpS={width:"100%",padding:"9px 10px",borderRadius:9,border:"1.5px solid #E5E7EB",fontSize:14,color:"#111827",outline:"none",background:"#FAFAFA",fontFamily:"inherit",boxSizing:"border-box",textAlign:"center",fontWeight:700};
  const lbS={fontSize:10,fontWeight:700,color:"#374151",display:"block",marginBottom:3,textAlign:"center"};

  // Normal ranges for neonates
  const normals={arterial:{ph:"7,35–7,45",pco2:"35–45",po2:"60–90",hco3:"22–26",be:"-2 a +2"},venoso:{ph:"7,31–7,41",pco2:"41–51",po2:"25–40",hco3:"22–26",be:"-2 a +2"},capilar:{ph:"7,33–7,43",pco2:"36–46",po2:"45–60",hco3:"22–26",be:"-2 a +2"}};
  const norm=normals[tipo];

  return (
    <Modal title="🩺 Gasometria — Interpretação Neonatal/Pediátrica" onClose={onClose}>
      {/* Header */}
      <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:14,padding:"9px 13px",background:"linear-gradient(135deg,#ECFEFF,#CFFAFE)",borderRadius:11,border:"1px solid #06B6D420"}}>
        <div style={{width:42,height:42,borderRadius:11,background:"linear-gradient(135deg,#22D3EE,#06B6D4)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0,boxShadow:"0 3px 10px rgba(6,182,212,0.3)"}}>🩺</div>
        <div><div style={{fontSize:13,fontWeight:800,color:"#155E75"}}>Interpretação Sistemática — 6 passos</div><div style={{fontSize:10,color:"#0E7490",marginTop:1}}>Neonatal · Pediátrico · Com correção de VM</div></div>
      </div>

      {/* Tipo */}
      <div style={{marginBottom:12}}>
        <label style={{fontSize:11,fontWeight:700,color:"#374151",display:"block",marginBottom:5}}>Tipo de Amostra</label>
        <div style={{display:"flex",gap:6}}>
          {[["arterial","🩸 Arterial"],["venoso","💙 Venoso"],["capilar","💧 Capilar"]].map(([v,l])=>(
            <button key={v} onClick={()=>setTipo(v)} style={{flex:1,padding:"8px 6px",borderRadius:9,border:`1.5px solid ${tipo===v?"#06B6D4":"#E5E7EB"}`,background:tipo===v?"#ECFEFF":"white",color:tipo===v?"#0369A1":"#6B7280",fontWeight:tipo===v?700:500,fontSize:11,transition:"all 0.15s"}}>{l}</button>
          ))}
        </div>
      </div>

      {/* Valores normais ref */}
      <div style={{background:"#F0FDFA",borderRadius:9,padding:"7px 11px",marginBottom:12,border:"1px solid #99F6E4",display:"flex",gap:12,flexWrap:"wrap"}}>
        <span style={{fontSize:9.5,color:"#0F766E",fontWeight:700}}>Referência {tipo}:</span>
        {[["pH",norm.ph],["PCO₂",norm.pco2+" mmHg"],["PO₂",norm.po2+" mmHg"],["HCO₃⁻",norm.hco3+" mEq/L"],["BE",norm.be]].map(([k,v])=>(
          <span key={k} style={{fontSize:9.5,color:"#0F766E"}}><b>{k}:</b> {v}</span>
        ))}
      </div>

      {/* Main inputs grid */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:10}}>
        {[
          {k:"ph",l:"pH",p:"Ex: 7.28",cor:"#DC2626"},
          {k:"pco2",l:"PCO₂ (mmHg)",p:"Ex: 58",cor:"#D97706"},
          {k:"po2",l:"PO₂ (mmHg)",p:"Ex: 65",cor:"#7C3AED"},
          {k:"hco3",l:"HCO₃⁻ (mEq/L)",p:"Ex: 18",cor:"#0369A1"},
          {k:"be",l:"Base Excess",p:"Ex: -8",cor:"#DC2626"},
          {k:"spo2",l:"SpO₂ (%)",p:"Ex: 88",cor:"#16A34A"},
        ].map(f=>(
          <div key={f.k}>
            <label style={lbS}>{f.l}</label>
            <input style={{...inpS,borderColor:vals[f.k]?f.cor+"60":"#E5E7EB",color:vals[f.k]?f.cor:"#374151"}} type="number" step="0.01" value={vals[f.k]} onChange={e=>sv(f.k,e.target.value)} placeholder={f.p}/>
          </div>
        ))}
      </div>

      {/* Ânion Gap inputs */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>
        <div>
          <label style={lbS}>Sódio Na⁺ <span style={{color:"#9CA3AF",fontWeight:400}}>(mEq/L)</span></label>
          <input style={inpS} type="number" value={vals.na} onChange={e=>sv("na",e.target.value)} placeholder="Ex: 138"/>
        </div>
        <div>
          <label style={lbS}>Cloreto Cl⁻ <span style={{color:"#9CA3AF",fontWeight:400}}>(mEq/L)</span></label>
          <input style={inpS} type="number" value={vals.cl} onChange={e=>sv("cl",e.target.value)} placeholder="Ex: 105"/>
        </div>
        <div>
          <label style={lbS}>Peso <span style={{color:"#9CA3AF",fontWeight:400}}>(kg)</span></label>
          <input style={inpS} type="number" step="0.1" value={peso} onChange={e=>setPeso(e.target.value)} placeholder="Ex: 1.8"/>
        </div>
      </div>

      {/* VM toggle */}
      <div style={{marginBottom:12}}>
        <div style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",marginBottom:vm?10:0}} onClick={()=>setVm(v=>!v)}>
          <div style={{width:36,height:20,borderRadius:10,background:vm?"#06B6D4":"#D1D5DB",position:"relative",transition:"background 0.2s",flexShrink:0}}>
            <div style={{position:"absolute",top:2,left:vm?18:2,width:16,height:16,borderRadius:"50%",background:"white",transition:"left 0.2s",boxShadow:"0 1px 4px rgba(0,0,0,0.2)"}}/>
          </div>
          <span style={{fontSize:12,fontWeight:700,color:vm?"#0369A1":"#6B7280"}}>🫁 Em Ventilação Mecânica</span>
        </div>
        {vm&&(
          <div style={{background:"#F0F9FF",borderRadius:10,padding:"10px 12px",border:"1px solid #BAE6FD"}}>
            <div style={{fontSize:10,fontWeight:700,color:"#0369A1",marginBottom:8}}>PARÂMETROS ATUAIS DO VM</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {[
                {k:"fr",l:"FR (irpm)",p:"Ex: 50"},
                {k:"vt",l:"VT (ml/kg)",p:"Ex: 5"},
                {k:"peep",l:"PEEP (cmH₂O)",p:"Ex: 5"},
                {k:"fio2",l:"FiO₂ (%)",p:"Ex: 60"},
                {k:"pip",l:"PIP (cmH₂O)",p:"Ex: 20"},
              ].map(f=>(
                <div key={f.k}>
                  <label style={lbS}>{f.l}</label>
                  <input style={{...inpS,fontSize:12}} type="number" step="0.5" value={params[f.k]} onChange={e=>sp(f.k,e.target.value)} placeholder={f.p}/>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>

      <div style={{display:"flex",gap:8,marginBottom:16}}>
        <button onClick={limpar} style={{flex:1,padding:"10px",borderRadius:10,border:"1.5px solid #E5E7EB",background:"white",color:"#374151",fontWeight:700,fontSize:13}}>🔄 Limpar</button>
        <button onClick={calcular} style={{flex:2,padding:"11px",borderRadius:10,border:"none",background:"linear-gradient(90deg,#06B6D4,#22D3EE)",color:"white",fontWeight:800,fontSize:14,boxShadow:"0 4px 14px rgba(6,182,212,0.4)"}}>⚡ Interpretar</button>
      </div>

      {res&&(res.erro?(
        <div style={{background:"#FEE2E2",borderRadius:12,padding:14,color:"#DC2626",fontWeight:600,fontSize:13}}>⚠️ {res.erro}</div>
      ):(
        <div style={{animation:"fadeIn 0.3s ease"}}>

          {/* pH badge */}
          <div style={{background:res.bgPh,borderRadius:15,padding:"13px 14px",marginBottom:12,border:`2px solid ${res.corPh}30`,textAlign:"center"}}>
            <div style={{fontSize:28,marginBottom:3}}>{res.emojiPh}</div>
            <div style={{fontSize:38,fontWeight:900,color:res.corPh,lineHeight:1}}>pH {res.ph}</div>
            <div style={{fontSize:12,fontWeight:700,color:res.corPh,marginTop:4}}>{res.gravPh}</div>
          </div>

          {/* Valores box */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:7,marginBottom:12}}>
            {[
              {l:"PCO₂",v:`${res.pco2} mmHg`,status:res.pco2>45?"↑":res.pco2<35?"↓":"✓",cor:res.pco2>45?"#DC2626":res.pco2<35?"#7C3AED":"#16A34A",bg:res.pco2>45?"#FEE2E2":res.pco2<35?"#EDE9FE":"#DCFCE7"},
              {l:"HCO₃⁻",v:`${res.hco3} mEq/L`,status:res.hco3<22?"↓":res.hco3>26?"↑":"✓",cor:res.hco3<22?"#DC2626":res.hco3>26?"#7C3AED":"#16A34A",bg:res.hco3<22?"#FEE2E2":res.hco3>26?"#EDE9FE":"#DCFCE7"},
              res.po2?{l:"PO₂",v:`${res.po2} mmHg`,status:res.po2<60?"↓":res.po2>100?"↑":"✓",cor:res.po2<60?"#DC2626":res.po2>100?"#7C3AED":"#16A34A",bg:res.po2<60?"#FEE2E2":res.po2>100?"#EDE9FE":"#DCFCE7"}:null,
            ].filter(Boolean).map(p=>(
              <div key={p.l} style={{background:p.bg,borderRadius:9,padding:"8px",textAlign:"center",border:`1px solid ${p.cor}20`}}>
                <div style={{fontSize:9,color:p.cor,fontWeight:700,marginBottom:1}}>{p.l}</div>
                <div style={{fontSize:13,fontWeight:900,color:p.cor}}>{p.status} {p.v}</div>
              </div>
            ))}
          </div>

          {/* Distúrbio */}
          <div style={{background:"linear-gradient(135deg,#155E75,#0E7490)",borderRadius:13,padding:"12px 14px",marginBottom:12,color:"white"}}>
            <div style={{fontSize:10,color:"rgba(255,255,255,0.6)",fontWeight:700,marginBottom:4}}>🔬 DISTÚRBIO PRIMÁRIO</div>
            <div style={{fontSize:14,fontWeight:800,lineHeight:1.3}}>{res.disturbio}</div>
            {res.misto&&<div style={{marginTop:6,padding:"4px 10px",borderRadius:7,background:"rgba(255,255,255,0.15)",fontSize:11,fontWeight:700}}>⚠️ Distúrbio misto — avaliar cada componente</div>}
          </div>

          {/* Compensação */}
          <div style={{background:"#F9FAFB",borderRadius:11,padding:"10px 12px",marginBottom:12,border:"1px solid #E5E7EB"}}>
            <div style={{fontSize:10,fontWeight:700,color:"#9CA3AF",marginBottom:4}}>📐 COMPENSAÇÃO ESPERADA</div>
            <div style={{fontSize:12,color:"#374151",lineHeight:1.6}}>{res.compens}</div>
          </div>

          {/* Oxigenação */}
          {res.oxStr&&<div style={{background:res.oxCor==="#16A34A"?"#DCFCE7":"#FFF7ED",borderRadius:11,padding:"9px 12px",marginBottom:12,border:`1px solid ${res.oxCor}30`,display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:18}}>{res.oxEmoji}</span>
            <div><div style={{fontSize:11,fontWeight:700,color:"#374151"}}>Oxigenação (PaO₂)</div><div style={{fontSize:12,color:res.oxCor,fontWeight:600}}>{res.oxStr}</div></div>
          </div>}

          {/* Ânion gap */}
          {res.agStr&&<div style={{background:res.agAlto?"#FEF9C3":"#F9FAFB",borderRadius:11,padding:"9px 12px",marginBottom:12,border:`1px solid ${res.agAlto?"#F59E0B":"#E5E7EB"}30`}}>
            <div style={{fontSize:10,fontWeight:700,color:"#9CA3AF",marginBottom:3}}>🔢 ÂNION GAP</div>
            <div style={{fontSize:12,color:"#374151",lineHeight:1.6}}>{res.agStr}</div>
            {res.deltaDelta&&<div style={{marginTop:4,fontSize:12,color:"#D97706",fontWeight:600}}>Δ/Δ: {res.deltaDelta}</div>}
          </div>}

          {/* Tratamentos */}
          {res.corTrat.length>0&&<div style={{background:"linear-gradient(135deg,#064E3B,#065F46)",borderRadius:13,padding:"12px 14px",marginBottom:12,color:"white"}}>
            <div style={{fontSize:10,color:"rgba(255,255,255,0.6)",fontWeight:700,marginBottom:8}}>💊 TRATAMENTO E CONDUTA</div>
            {res.corTrat.map((t,i)=><div key={i} style={{fontSize:12,lineHeight:1.7,color:"rgba(255,255,255,0.9)",paddingLeft:8,borderLeft:"2px solid rgba(255,255,255,0.2)",marginBottom:4}}>{t}</div>)}
          </div>}

          {/* VM corrections */}
          {res.corVM.length>0&&res.corVM.map((bloco,i)=>(
            <div key={i} style={{background:bloco.bg,borderRadius:13,padding:"12px 14px",marginBottom:10,border:`2px solid ${bloco.cor}30`}}>
              <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:8}}>
                <span style={{fontSize:16}}>🫁</span>
                <div style={{fontSize:12,fontWeight:800,color:bloco.cor}}>{bloco.tipo}</div>
              </div>
              {bloco.acoes.map((a,j)=>(
                <div key={j} style={{fontSize:12,color:"#374151",padding:"5px 8px",borderRadius:7,background:"rgba(255,255,255,0.6)",marginBottom:4,lineHeight:1.5,display:"flex",gap:6,alignItems:"flex-start"}}>
                  <span style={{flexShrink:0,color:bloco.cor}}>→</span><span>{a}</span>
                </div>
              ))}
            </div>
          ))}

          {/* Footer disclaimer */}
          <div style={{background:"#F9FAFB",borderRadius:10,padding:"9px 12px",border:"1px solid #E5E7EB"}}>
            <div style={{fontSize:10,color:"#9CA3AF",lineHeight:1.6}}>⚕️ Interpretação automática para uso de apoio clínico. Sempre correlacionar com quadro clínico, exames complementares e evolução do paciente. Seguir protocolos institucionais.</div>
          </div>
        </div>
      ))}
    </Modal>
  );
}

// ── TFG CALCULATOR ────────────────────────────────────────────────────────────
function TFGCalc({onClose}){
  const [metodo,setMetodo]=useState("schwartz"); // schwartz | schwartz_bedside | diurese
  const [vals,setVals]=useState({comprimento:"",creatinina:"",diurese:"",peso:"",ig:"",idadeVida:"",ureia:"",sodioU:"",creatU:"",volumeU:""});
  const [res,setRes]=useState(null);
  const sv=(k,v)=>setVals(x=>({...x,[k]:v}));

  // Constante k de Schwartz por perfil
  const getK=(ig,idadeVidaDias)=>{
    const idVSem=idadeVidaDias/7;
    const igCor=parseFloat(ig)+idVSem;
    if(igCor<34) return {k:0.33,desc:"RNPT <34 sem IG corrigida"};
    if(igCor<37) return {k:0.33,desc:"RNPT 34–36 sem IG corrigida"};
    if(idadeVidaDias<=28) return {k:0.45,desc:"RN a termo / Neonato"};
    if(idadeVidaDias<=365) return {k:0.45,desc:"Lactente <1 ano"};
    return {k:0.55,desc:"Criança >1 ano"};
  };

  const calcular=()=>{
    const comprN=parseFloat(vals.comprimento);
    const creatN=parseFloat(vals.creatinina);
    const igN=parseFloat(vals.ig)||40;
    const idadeVN=parseFloat(vals.idadeVida)||1;
    const pesoN=parseFloat(vals.peso);

    if(metodo==="schwartz"||metodo==="schwartz_bedside"){
      if(isNaN(comprN)||isNaN(creatN)){setRes({erro:"Comprimento e Creatinina são obrigatórios."});return;}
      if(comprN<20||comprN>200){setRes({erro:"Comprimento deve ser entre 20 e 200 cm."});return;}
      if(creatN<0.1||creatN>20){setRes({erro:"Creatinina deve ser entre 0,1 e 20 mg/dL."});return;}
    }

    let tfg, formula, kInfo;

    if(metodo==="schwartz"){
      kInfo=getK(igN,idadeVN);
      tfg=parseFloat(((kInfo.k*comprN)/creatN).toFixed(1));
      formula=`TFG = k × Comprimento / Creatinina = ${kInfo.k} × ${comprN} / ${creatN} = ${tfg} mL/min/1,73m²`;
    } else if(metodo==="schwartz_bedside"){
      // Schwartz bedside (pediátrico >2 anos): k=0.413
      tfg=parseFloat(((0.413*comprN)/creatN).toFixed(1));
      formula=`TFG Bedside = 0,413 × Comprimento / Creatinina = 0,413 × ${comprN} / ${creatN} = ${tfg} mL/min/1,73m²`;
      kInfo={k:0.413,desc:"Schwartz Bedside (>2 anos)"};
    } else {
      // Diurese / clearance endógeno
      const diureseN=parseFloat(vals.diurese);
      const creatUn=parseFloat(vals.creatU);
      const volUn=parseFloat(vals.volumeU);
      if(isNaN(diureseN)||isNaN(creatN)||isNaN(pesoN)){setRes({erro:"Diurese (ml/kg/h), Creatinina sérica e Peso são obrigatórios para este método."});return;}
      // Clearance simplificado
      const diurMlMin=diureseN*pesoN/60;
      if(!isNaN(creatUn)&&!isNaN(volUn)){
        tfg=parseFloat(((creatUn*volUn)/(creatN*1440)).toFixed(1));
        formula=`Clearance = [Creat.Urinária × Volume24h] / [Creat.Sérica × 1440] = [${creatUn} × ${volUn}] / [${creatN} × 1440] = ${tfg} mL/min`;
      } else {
        tfg=parseFloat(((diureseN*pesoN)/60*100/creatN).toFixed(1));
        formula=`Clearance estimado pela diurese = ${tfg} mL/min/1,73m²`;
      }
      kInfo={k:null,desc:"Clearance de Creatinina (urinário)"};
    }

    // ── REFERÊNCIA NEONATAL/PEDIÁTRICA ──────────────────────────────────────
    // ml/min/1,73m²
    let normalMin,normalMax,idadePerfil;
    const igCor=igN+(idadeVN/7);
    if(igCor<30){normalMin=5;normalMax=15;idadePerfil="RNPT <30 sem IG corrigida";}
    else if(igCor<34){normalMin=8;normalMax=20;idadePerfil="RNPT 30–33 sem IG corrigida";}
    else if(igCor<37){normalMin=10;normalMax=25;idadePerfil="RNPT 34–36 sem IG corrigida";}
    else if(idadeVN<=7){normalMin=15;normalMax=40;idadePerfil="RN a termo 1ª semana";}
    else if(idadeVN<=28){normalMin=25;normalMax=55;idadePerfil="Neonato 1–4 sem";}
    else if(idadeVN<=180){normalMin=35;normalMax=80;idadePerfil="Lactente 1–6 meses";}
    else if(idadeVN<=365){normalMin=55;normalMax=100;idadePerfil="Lactente 6–12 meses";}
    else{normalMin=80;normalMax=120;idadePerfil="Criança >1 ano";}

    // ── CLASSIFICAÇÃO KDIGO ADAPTADA NEONATAL ──────────────────────────────
    let estadio,cor,bgCor,emoji,descEstadio;
    const pct=tfg/normalMax;
    if(tfg>=normalMin){
      estadio="Normal para a idade";cor="#16A34A";bgCor="#DCFCE7";emoji="✅";
      descEstadio=`TFG dentro do esperado para ${idadePerfil}`;
    } else if(tfg>=normalMin*0.7){
      estadio="Levemente reduzida (KDIGO G2)";cor="#D97706";bgCor="#FEF9C3";emoji="⚠️";
      descEstadio="Redução leve — monitorar hidratação, medicamentos nefrotóxicos e perfusão renal";
    } else if(tfg>=normalMin*0.5){
      estadio="Redução Moderada (KDIGO G3a–G3b)";cor="#EA580C";bgCor="#FFF7ED";emoji="🔴";
      descEstadio="Redução moderada — risco de acúmulo de toxinas e desequilíbrio eletrolítico";
    } else if(tfg>=normalMin*0.25){
      estadio="Redução Grave (KDIGO G4)";cor="#DC2626";bgCor="#FEE2E2";emoji="🚨";
      descEstadio="Redução grave — risco elevado de IRA / IRC — avaliar diálise peritoneal";
    } else {
      estadio="Insuficiência Renal / Falência (KDIGO G5)";cor="#7F1D1D";bgCor="#FEE2E2";emoji="🆘";
      descEstadio="Falência renal — avaliar indicação de diálise peritoneal ou terapia de substituição renal";
    }

    // ── DIURESE AVALIAÇÃO ──────────────────────────────────────────────────
    const diureseN2=parseFloat(vals.diurese);
    let diureseStatus="",diurCor="#16A34A",diurEmoji="✅";
    if(!isNaN(diureseN2)){
      if(diureseN2>=1&&diureseN2<=3){diureseStatus="Diurese normal (1–3 ml/kg/h)";diurCor="#16A34A";diurEmoji="✅";}
      else if(diureseN2>=0.5&&diureseN2<1){diureseStatus="Oligúria leve (0,5–1 ml/kg/h)";diurCor="#D97706";diurEmoji="⚠️";}
      else if(diureseN2>0&&diureseN2<0.5){diureseStatus="Oligúria grave (<0,5 ml/kg/h) — Critério de IRA";diurCor="#DC2626";diurEmoji="🚨";}
      else if(diureseN2===0){diureseStatus="Anúria — Emergência nefrológica";diurCor="#7F1D1D";diurEmoji="🆘";}
      else if(diureseN2>3&&diureseN2<=5){diureseStatus="Poliúria leve (3–5 ml/kg/h)";diurCor="#D97706";diurEmoji="⚠️";}
      else if(diureseN2>5){diureseStatus="Poliúria grave (>5 ml/kg/h) — avaliar diabetes insipidus, fase de recuperação de IRA";diurCor="#DC2626";diurEmoji="🔴";}
    }

    // ── UREIA ──────────────────────────────────────────────────────────────
    const ureiaV=parseFloat(vals.ureia);
    let ureiaStatus="",ureiaCor="#16A34A";
    if(!isNaN(ureiaV)){
      if(ureiaV<=20){ureiaStatus=`Ureia normal (≤20 mg/dL) — ${ureiaV} mg/dL ✅`;}
      else if(ureiaV<=40){ureiaStatus=`Ureia levemente elevada (${ureiaV} mg/dL) — monitorar ⚠️`;ureiaCor="#D97706";}
      else if(ureiaV<=100){ureiaStatus=`Ureia elevada (${ureiaV} mg/dL) — avaliar IRA 🔴`;ureiaCor="#EA580C";}
      else{ureiaStatus=`Ureia muito elevada (${ureiaV} mg/dL) — síndrome urêmica 🚨`;ureiaCor="#DC2626";}
    }

    // ── ORIENTAÇÕES ───────────────────────────────────────────────────────
    const orientacoes=[];
    if(estadio.includes("Normal")){
      orientacoes.push({emoji:"✅",titulo:"Função Renal Normal",desc:"Manter monitoramento rotineiro. Assegurar hidratação adequada (150ml/kg/dia em RNPT, 120ml/kg/dia em RN a termo).",cor:"#16A34A",bg:"#DCFCE7"});
      orientacoes.push({emoji:"📋",titulo:"Monitoramento",desc:"Controle de creatinina e ureia conforme evolução clínica. Ajuste de drogas nefrotóxicas pelo peso e IG.",cor:"#0369A1",bg:"#F0F9FF"});
    }
    if(estadio.includes("Leve")||estadio.includes("Normal")){
      orientacoes.push({emoji:"💊",titulo:"Drogas Nefrotóxicas",desc:"Evitar ou ajustar: Aminoglicosídeos (monitorar nível sérico), AINEs, Indometacina, Vancomicina, contraste iodado. Ajustar dose/intervalo conforme TFG.",cor:"#D97706",bg:"#FFFBEB"});
    }
    if(estadio.includes("Moderada")||estadio.includes("Grave")||estadio.includes("Falência")){
      orientacoes.push({emoji:"🔴",titulo:"Restrição Hídrica e Eletrolítica",desc:"Restringir volume se oligúria: 400ml/m²/dia + reposição das perdas. Monitorar K⁺, Na⁺, Ca²⁺, P, pH a cada 6–12h. Evitar hipercalemia (K⁺ >6 mEq/L — risco de arritmia).",cor:"#DC2626",bg:"#FEE2E2"});
      orientacoes.push({emoji:"💉",titulo:"Manejo da Hipercalemia",desc:"K⁺ >6,5 mEq/L: Gluconato de cálcio 10% (0,5-1ml/kg EV lento) + Bicarbonato + Insulina/Glicose + Poliestirenossulfonato (Kayexalate). ECG urgente.",cor:"#DC2626",bg:"#FEE2E2"});
      orientacoes.push({emoji:"📡",titulo:"Avaliar Diálise Peritoneal",desc:"Indicações: anúria, hipercalemia refratária, acidose grave, sobrecarga hídrica, ureia >100mg/dL com sintomas. Diálise peritoneal é o método de escolha em neonatos.",cor:"#7F1D1D",bg:"#FEE2E2"});
    }
    if(estadio.includes("Moderada")){
      orientacoes.push({emoji:"🔬",titulo:"Investigação Etiológica",desc:"IRA pré-renal: hipovolemia, hipoperfusão → volume. IRA intrínseca: NTA, nefrite — EQU, proteinúria, USG renal. IRA pós-renal: obstrução — USG vesical/renal urgente.",cor:"#EA580C",bg:"#FFF7ED"});
    }
    if(diureseN2>0&&diureseN2<0.5){
      orientacoes.push({emoji:"🚿",titulo:"Prova de Volume",desc:"Oligúria grave → expansão com SF 0,9% 10-20ml/kg em 30min (se sem sobrecarga). Se sem resposta → furosemida 1mg/kg EV. Sem resposta → avaliar IRA intrínseca.",cor:"#EA580C",bg:"#FFF7ED"});
    }
    if(!isNaN(creatN)&&creatN>1.5){
      orientacoes.push({emoji:"🩻",titulo:"Imagem Urgente",desc:"Creatinina elevada → USG renal + vias urinárias urgente para descartar uropatia obstrutiva, trombose vascular renal. Doppler renal se disponível.",cor:"#7C3AED",bg:"#F5F3FF"});
    }
    orientacoes.push({emoji:"📊",titulo:"Monitoramento Laboratorial",desc:`Frequência recomendada:\n• TFG normal: creatinina semanal\n• TFG reduzida: creatinina + ureia + eletrólitos 12/12h–24/24h\n• IRA grave: 6/6h até estabilização\nAlvo creatinina neonatal: ≤0,4 mg/dL após 2ª semana de vida`,cor:"#0369A1",bg:"#F0F9FF"});

    // ── EQUAÇÃO DO CLEARANCE SÓDIO (FENa) ────────────────────────────────
    let fenaStr="";
    const sodioUN=parseFloat(vals.sodioU), creatUN2=parseFloat(vals.creatU), naN=parseFloat(vals.na)||140;
    if(!isNaN(sodioUN)&&!isNaN(creatUN2)&&!isNaN(creatN)){
      const fena=parseFloat(((sodioUN*creatN)/(naN*creatUN2)*100).toFixed(1));
      fenaStr=`FENa = (Na⁺ urinário × Cr sérica) / (Na⁺ sérico × Cr urinária) × 100 = ${fena}%\n→ ${fena<1?"FENa <1%: IRA PRÉ-RENAL (reabsorção sódio preservada) → expansão volêmica":fena<3?"FENa 1–3%: Zona cinzenta — avaliar contexto":fena>=3?"FENa ≥3%: IRA INTRÍNSECA / NTA (lesão tubular)":"—"}`;
    }

    setRes({tfg,formula,estadio,cor,bgCor,emoji,descEstadio,normalMin,normalMax,idadePerfil,kInfo,diureseStatus,diurCor,diurEmoji,ureiaStatus,ureiaCor,orientacoes,fenaStr,pct:Math.min(100,(tfg/normalMax)*100)});
  };

  const limpar=()=>{setVals({comprimento:"",creatinina:"",diurese:"",peso:"",ig:"",idadeVida:"",ureia:"",sodioU:"",creatU:"",volumeU:""});setRes(null);};
  const inpS={width:"100%",padding:"9px 10px",borderRadius:9,border:"1.5px solid #E5E7EB",fontSize:13,color:"#111827",outline:"none",background:"#FAFAFA",fontFamily:"inherit",boxSizing:"border-box",textAlign:"center",fontWeight:700};
  const lbS={fontSize:10,fontWeight:700,color:"#374151",display:"block",marginBottom:3,textAlign:"center"};

  return (
    <Modal title="🫘 TFG — Taxa de Filtração Glomerular" onClose={onClose}>
      {/* Header */}
      <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:14,padding:"9px 13px",background:"linear-gradient(135deg,#FFF7ED,#FFEDD5)",borderRadius:11,border:"1px solid #F9731620"}}>
        <div style={{width:42,height:42,borderRadius:11,background:"linear-gradient(135deg,#FB923C,#F97316)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0,boxShadow:"0 3px 10px rgba(249,115,22,0.3)"}}>🫘</div>
        <div>
          <div style={{fontSize:13,fontWeight:800,color:"#7C2D12"}}>Função Renal Neonatal e Pediátrica</div>
          <div style={{fontSize:10,color:"#9A3412",marginTop:1}}>Schwartz · Schwartz Bedside · Clearance Urinário</div>
        </div>
      </div>

      {/* Método */}
      <div style={{marginBottom:12}}>
        <label style={{fontSize:11,fontWeight:700,color:"#374151",display:"block",marginBottom:5}}>Método de Cálculo</label>
        <div style={{display:"flex",gap:6,flexDirection:"column"}}>
          {[
            ["schwartz","📐 Schwartz (Neonatal)","k × Comprimento / Creatinina — para RN e lactentes"],
            ["schwartz_bedside","📐 Schwartz Bedside (>2 anos)","k=0,413 — validado para crianças >2 anos"],
            ["diurese","🔬 Clearance de Creatinina","Creatinina urinária e sérica — mais preciso"],
          ].map(([v,l,sub])=>(
            <button key={v} onClick={()=>setMetodo(v)} style={{padding:"8px 12px",borderRadius:10,border:`1.5px solid ${metodo===v?"#F97316":"#E5E7EB"}`,background:metodo===v?"#FFF7ED":"white",cursor:"pointer",textAlign:"left",display:"flex",gap:10,alignItems:"center",transition:"all 0.15s"}}>
              <div style={{width:16,height:16,borderRadius:"50%",border:`2px solid ${metodo===v?"#F97316":"#D1D5DB"}`,background:metodo===v?"#F97316":"white",flexShrink:0}}/>
              <div><div style={{fontSize:12,fontWeight:700,color:metodo===v?"#C2410C":"#374151"}}>{l}</div><div style={{fontSize:10,color:"#9CA3AF"}}>{sub}</div></div>
            </button>
          ))}
        </div>
      </div>

      {/* Inputs comuns */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
        <div>
          <label style={lbS}>IG ao Nascer <span style={{color:"#9CA3AF",fontWeight:400}}>(sem)</span></label>
          <input style={inpS} type="number" step="1" min="23" max="42" value={vals.ig} onChange={e=>sv("ig",e.target.value)} placeholder="Ex: 32"/>
        </div>
        <div>
          <label style={lbS}>Idade de Vida <span style={{color:"#9CA3AF",fontWeight:400}}>(dias)</span></label>
          <input style={inpS} type="number" step="1" value={vals.idadeVida} onChange={e=>sv("idadeVida",e.target.value)} placeholder="Ex: 14"/>
        </div>
      </div>

      {(metodo==="schwartz"||metodo==="schwartz_bedside")&&(
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
          <div>
            <label style={lbS}>Comprimento <span style={{color:"#9CA3AF",fontWeight:400}}>(cm)</span></label>
            <input style={{...inpS,color:"#F97316"}} type="number" step="0.5" value={vals.comprimento} onChange={e=>sv("comprimento",e.target.value)} placeholder="Ex: 48"/>
          </div>
          <div>
            <label style={lbS}>Creatinina sérica <span style={{color:"#9CA3AF",fontWeight:400}}>(mg/dL)</span></label>
            <input style={{...inpS,color:"#DC2626"}} type="number" step="0.01" value={vals.creatinina} onChange={e=>sv("creatinina",e.target.value)} placeholder="Ex: 0.6"/>
          </div>
        </div>
      )}

      {metodo==="diurese"&&(
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
          <div>
            <label style={lbS}>Creatinina sérica <span style={{color:"#9CA3AF",fontWeight:400}}>(mg/dL)</span></label>
            <input style={{...inpS,color:"#DC2626"}} type="number" step="0.01" value={vals.creatinina} onChange={e=>sv("creatinina",e.target.value)} placeholder="Ex: 0.8"/>
          </div>
          <div>
            <label style={lbS}>Creatinina urinária <span style={{color:"#9CA3AF",fontWeight:400}}>(mg/dL)</span></label>
            <input style={inpS} type="number" step="0.1" value={vals.creatU} onChange={e=>sv("creatU",e.target.value)} placeholder="Ex: 40"/>
          </div>
          <div>
            <label style={lbS}>Volume urinário 24h <span style={{color:"#9CA3AF",fontWeight:400}}>(mL)</span></label>
            <input style={inpS} type="number" step="1" value={vals.volumeU} onChange={e=>sv("volumeU",e.target.value)} placeholder="Ex: 200"/>
          </div>
          <div>
            <label style={lbS}>Peso <span style={{color:"#9CA3AF",fontWeight:400}}>(kg)</span></label>
            <input style={inpS} type="number" step="0.1" value={vals.peso} onChange={e=>sv("peso",e.target.value)} placeholder="Ex: 1.5"/>
          </div>
        </div>
      )}

      {/* Campos opcionais */}
      <div style={{background:"#F9FAFB",borderRadius:10,padding:"10px 12px",marginBottom:12,border:"1px solid #E5E7EB"}}>
        <div style={{fontSize:10,fontWeight:700,color:"#9CA3AF",marginBottom:8}}>DADOS ADICIONAIS (opcionais — para orientações extras)</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
          <div>
            <label style={lbS}>Peso <span style={{color:"#9CA3AF",fontWeight:400}}>(kg)</span></label>
            <input style={inpS} type="number" step="0.1" value={vals.peso} onChange={e=>sv("peso",e.target.value)} placeholder="Ex: 1.5"/>
          </div>
          <div>
            <label style={lbS}>Diurese <span style={{color:"#9CA3AF",fontWeight:400}}>(ml/kg/h)</span></label>
            <input style={inpS} type="number" step="0.1" value={vals.diurese} onChange={e=>sv("diurese",e.target.value)} placeholder="Ex: 1.2"/>
          </div>
          <div>
            <label style={lbS}>Ureia <span style={{color:"#9CA3AF",fontWeight:400}}>(mg/dL)</span></label>

      {res&&(res.erro?(
        <div style={{background:"#FEE2E2",borderRadius:12,padding:14,color:"#DC2626",fontWeight:600,fontSize:13}}>⚠️ {res.erro}</div>

        <div style={{animation:"fadeIn 0.3s ease"}}>

          {/* TFG Result badge */}
          <div style={{background:res.bgCor,borderRadius:16,padding:"14px 16px",marginBottom:12,border:`2px solid ${res.cor}40`,textAlign:"center"}}>
            <div style={{fontSize:30,marginBottom:4}}>{res.emoji}</div>

              {res.tfg}
            </div>
            <div style={{fontSize:11,color:res.cor+"99",fontWeight:600,marginBottom:4}}>mL/min/1,73m²</div>
            <div style={{display:"inline-block",padding:"4px 16px",borderRadius:20,background:res.cor,color:"white",fontWeight:900,fontSize:11,marginBottom:6}}>{res.estadio}</div>

          {/* Formula */}
          <div style={{background:"#F9FAFB",borderRadius:11,padding:"9px 13px",marginBottom:12,border:"1px solid #E5E7EB"}}>

            <div style={{position:"relative",height:26,borderRadius:8,overflow:"hidden",marginBottom:6,background:"#F3F4F6"}}>
              <div style={{position:"absolute",top:0,left:0,width:`${(res.normalMin/res.normalMax)*100}%`,height:"100%",background:"#FEE2E2"}}/>
              <div style={{position:"absolute",top:0,left:`${(res.normalMin/res.normalMax)*100}%`,width:`${100-(res.normalMin/res.normalMax)*100}%`,height:"100%",background:"#DCFCE7"}}/>
              <div style={{position:"absolute",top:0,left:`${Math.min(97,res.pct)}%`,width:3,height:"100%",background:res.cor,transform:"translateX(-50%)"}}/>
              <div style={{position:"absolute",top:"50%",left:`${Math.min(94,res.pct)}%`,transform:"translate(-50%,-50%)",background:res.cor,color:"white",borderRadius:5,padding:"1px 6px",fontSize:10,fontWeight:900,whiteSpace:"nowrap"}}>{res.tfg}</div>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#9CA3AF"}}>
              <span>0</span><span style={{color:"#DC2626"}}>↑{res.normalMin} (mín)</span><span style={{color:"#16A34A"}}>↑{res.normalMax} (máx)</span>
            </div>
            <div style={{marginTop:6,fontSize:11,color:"#374151",fontWeight:600}}>Normal para {res.idadePerfil}: <span style={{color:"#16A34A",fontWeight:800}}>{res.normalMin}–{res.normalMax} mL/min/1,73m²</span></div>
          </div>

          {/* Diurese + Ureia */}
          <div style={{display:"grid",gridTemplateColumns:res.diureseStatus&&res.ureiaStatus?"1fr 1fr":"1fr",gap:8,marginBottom:12}}>
            {res.diureseStatus&&<div style={{background:res.diurCor==="#16A34A"?"#DCFCE7":res.diurCor==="#D97706"?"#FEF9C3":"#FEE2E2",borderRadius:10,padding:"8px 10px",border:`1px solid ${res.diurCor}30`,display:"flex",gap:7,alignItems:"flex-start"}}>
              <span style={{fontSize:18,flexShrink:0}}>{res.diurEmoji}</span>
              <div><div style={{fontSize:10,fontWeight:700,color:res.diurCor}}>Diurese</div><div style={{fontSize:11,color:res.diurCor,fontWeight:600,lineHeight:1.4}}>{res.diureseStatus}</div></div>
            </div>}
            {res.ureiaStatus&&<div style={{background:"#F9FAFB",borderRadius:10,padding:"8px 10px",border:`1px solid ${res.ureiaCor}30`}}>
              <div style={{fontSize:10,fontWeight:700,color:"#9CA3AF",marginBottom:2}}>Ureia</div>
              <div style={{fontSize:11,color:res.ureiaCor,fontWeight:600,lineHeight:1.4}}>{res.ureiaStatus}</div>
            </div>}
          </div>

          {/* FENa */}
          {res.fenaStr&&<div style={{background:"#F5F3FF",borderRadius:11,padding:"10px 13px",marginBottom:12,border:"1px solid #DDD6FE"}}>
            <div style={{fontSize:10,fontWeight:700,color:"#7C3AED",marginBottom:4}}>🔬 FRAÇÃO DE EXCREÇÃO DE SÓDIO (FENa)</div>
            <div style={{fontSize:12,color:"#374151",lineHeight:1.7,whiteSpace:"pre-wrap"}}>{res.fenaStr}</div>
          </div>}

          {/* Orientações */}
          <div style={{marginBottom:8}}>
            <div style={{fontSize:11,fontWeight:700,color:"#9CA3AF",marginBottom:8}}>💊 ORIENTAÇÕES E CONDUTA</div>
            {res.orientacoes.map((o,i)=>(
              <div key={i} style={{background:o.bg,borderRadius:12,padding:"10px 13px",marginBottom:8,border:`1.5px solid ${o.cor}25`}}>
                <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:4}}>
                  <span style={{fontSize:18}}>{o.emoji}</span>
                  <div style={{fontSize:12,fontWeight:800,color:o.cor}}>{o.titulo}</div>
                </div>
                <div style={{fontSize:12,color:"#374151",lineHeight:1.65,whiteSpace:"pre-wrap",paddingLeft:25}}>{o.desc}</div>
              </div>
            ))}
          </div>

          {/* KDIGO reference */}
          <div style={{background:"#F9FAFB",borderRadius:11,padding:"10px 13px",border:"1px solid #E5E7EB"}}>
            <div style={{fontSize:10,fontWeight:700,color:"#9CA3AF",marginBottom:7}}>📋 REFERÊNCIA — TFG NORMAL POR IDADE (Neonatal/Pediátrica)</div>
            {[
              ["RNPT <30 sem IG cor.","5–15","mL/min/1,73m²"],
              ["RNPT 30–33 sem","8–20","mL/min/1,73m²"],
              ["RNPT 34–36 sem","10–25","mL/min/1,73m²"],
              ["RN a termo 1ª semana","15–40","mL/min/1,73m²"],
              ["Neonato 1–4 semanas","25–55","mL/min/1,73m²"],
              ["Lactente 1–6 meses","35–80","mL/min/1,73m²"],
              ["Lactente 6–12 meses","55–100","mL/min/1,73m²"],
              ["Criança >1 ano","80–120","mL/min/1,73m²"],
            ].map(([idade,val,un])=>(
              <div key={idade} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 7px",borderRadius:7,marginBottom:3,background:"white",border:"1px solid #F3F4F6"}}>
                <span style={{flex:1.5,fontSize:11,color:"#374151",fontWeight:600}}>{idade}</span>
                <span style={{fontSize:12,fontWeight:800,color:"#F97316"}}>{val}</span>
                <span style={{fontSize:9.5,color:"#9CA3AF"}}>{un}</span>
              </div>
            ))}
            <div style={{fontSize:10,color:"#9CA3AF",marginTop:6,lineHeight:1.5}}>⚠️ A TFG matura progressivamente. RNPT tem função renal fisiologicamente reduzida. Creatinina reflete a creatinina materna nas primeiras 48–72h de vida.</div>
          </div>
        </div>
      ))}
    </Modal>
  );
}

// ── VENÓCLISE / HIDRATAÇÃO VENOSA CALCULATOR ─────────────────────────────────
function VenocliseCalc({onClose}){
  const [peso,setPeso]=useState("");
  const [tipo,setTipo]=useState("rnpt"); // rnpt | rnt
  const [dia,setDia]=useState("1");
  const [foto,setFoto]=useState(false);
  const [vmi,setVmi]=useState(false);
  const [vig,setVig]=useState("4.5");
  // eletrólitos - concentração escolhida
  const [nacl,setNacl]=useState("20");    // 10 ou 20%
  const [kcl,setKcl]=useState("10");      // 10 ou 19.1%
  const [mgso4,setMgso4]=useState("50");  // 10 ou 50%
  // doses custom (mEq/kg) - podem ser alteradas
  const [naclDose,setNaclDose]=useState("");
  const [kclDose,setKclDose]=useState("");
  const [mgso4Dose,setMgso4Dose]=useState("");
  const [glucCaDose,setGlucCaDose]=useState(""); // mg/kg/dia — opcional
  const [k2po4,setK2po4]=useState(false);
  const [bic,setBic]=useState(""); // mEq/kg se quiser adicionar bic
  const [res,setRes]=useState(null);

  // Tabela QH por dia e tipo (ml/kg/dia) - usa valor médio
  const getQH=()=>{
    const pesoN=parseFloat(peso);
    if(isNaN(pesoN)||pesoN<=0) return null;
    // Tabela da imagem por peso e dia
    const tabelaDia={
      "<0.75":    {1:[85,85],  2:[110,110], 3:[135,135]}, // mid
      "0.75-1":   {1:[90,90],  2:[120,120], 3:[135,135]},
      "1-1.5":    {1:[90,90],  2:[110,110], 3:[135,135]},
      "1.5-2.5":  {1:[70,70],  2:[100,100], 3:[125,125]},
      ">2.5":     {1:[70,70],  2:[90,90],   3:[110,110]},
    };
    // Simples: usa tabela RNPT padrão por dia (col1=min, col2=max)
    const d=parseInt(dia);
    let qhMin,qhMax;
    if(tipo==="rnpt"){
      if(d===1){qhMin=70;qhMax=d===1&&pesoN<0.75?100:d===1&&pesoN<1?100:d===1&&pesoN<1.5?100:d===1&&pesoN<2.5?80:80;}
      // Usa tabela por peso:
      let col;
      if(pesoN<0.75) col="<0.75";
      else if(pesoN<1) col="0.75-1";
      else if(pesoN<1.5) col="1-1.5";
      else if(pesoN<2.5) col="1.5-2.5";
      else col=">2.5";
      const dKey=Math.min(d,3).toString();
      const [mn,mx]=[tabelaDia[col][dKey][0]-10,tabelaDia[col][dKey][0]+10];
      qhMin=tabelaDia[col][dKey][0]-8; qhMax=tabelaDia[col][dKey][0]+8;
    } else {
      // RNT simples
      const rntTab={1:[80,80],2:[90,90],3:[100,100],4:[110,110]};
      const dKey=Math.min(d,4).toString();
      qhMin=rntTab[dKey][0]-5; qhMax=rntTab[dKey][0]+5;
    }
    // Após 72h (3 dias): usar máximo
    if(d>=4&&tipo==="rnpt"){qhMin=120;qhMax=130;}
    if(d>=4&&tipo==="rnt"){qhMin=120;qhMax=150;}
    // Ajuste foto/vmi
    let qhBase=(qhMin+qhMax)/2;
    if(foto) qhBase=qhBase*1.20;
    if(vmi)  qhBase=qhBase*0.80;
    return {qhBase:Math.round(qhBase), qhMin, qhMax, qhAjust:Math.round(qhBase)};
  };

  const calcular=()=>{
    const pesoN=parseFloat(peso);
    if(isNaN(pesoN)||pesoN<=0){setRes({erro:"Informe o peso do RN."});return;}
    const vigN=parseFloat(vig)||4.5;
    if(vigN<2||vigN>12){setRes({erro:"VIG deve estar entre 2 e 12 mg/kg/min."});return;}

    const qhInfo=getQH();
    const QH=qhInfo.qhAjust; // ml/kg/dia total
    const QHtotal=QH*pesoN;  // ml/dia

    // ── 1. gG (g/kg/dia de glicose) ─────────────────────────────────────────
    const gG=parseFloat((vigN*pesoN*1.44).toFixed(1));

    // ── 2. Eletrólitos — calcular volumes (subtrair do QH antes da glic) ────
    // NaCl — opcional (em branco = não usar)
    const naclConc=parseFloat(nacl); // 10% = 1,7 mEq/ml | 20% = 3,4 mEq/ml
    const naclMeqMl=naclConc===10?1.7:3.4;
    const naclDoseN=naclDose.trim()!==""?parseFloat(naclDose):0; // 0 se em branco
    const naclVol=naclDoseN>0?parseFloat(((naclDoseN*pesoN)/naclMeqMl).toFixed(1)):0;

    // KCl — opcional (em branco = não usar)
    const kclConc=parseFloat(kcl); // 10% = 1,3 mEq/ml | 19.1% = 2,5 mEq/ml
    const kclMeqMl=kclConc===10?1.3:2.5;
    const kclDoseN=kclDose.trim()!==""?parseFloat(kclDose):0; // 0 se em branco
    const kclVol=kclDoseN>0?parseFloat(((kclDoseN*pesoN)/kclMeqMl).toFixed(1)):0;

    // MgSO4 — opcional (em branco = não usar)
    const mgConc=parseFloat(mgso4); // 10% = 0,8 mEq/ml | 50% = 4 mEq/ml
    const mgMeqMl=mgConc===10?0.8:mgConc===25?2:4;
    const mgDoseN=mgso4Dose.trim()!==""?parseFloat(mgso4Dose):0; // 0 se em branco
    const mgVol=mgDoseN>0?parseFloat(((mgDoseN*pesoN)/mgMeqMl).toFixed(1)):0;

    // Gluconato de Cálcio 10% (100mg/ml) — opcional (em branco = não usar)
    const glucCaDoseN=glucCaDose.trim()!==""?parseFloat(glucCaDose):0; // 0 se em branco
    const glucCaVol=glucCaDoseN>0?parseFloat(((glucCaDoseN*pesoN)/100).toFixed(1)):0;

    // K2PO4 10% (2 mEq/ml) - se ativado, substitui KCl
    const k2po4Vol=k2po4?parseFloat(((kclDoseN*pesoN)/2).toFixed(1)):0;
    const kVolFinal=k2po4?k2po4Vol:kclVol;

    // Bicarbonato (se informado)
    const bicN=parseFloat(bic)||0; // mEq/kg
    const bicVol=parseFloat((bicN*pesoN*8.33).toFixed(1)); // NaHCO3 8.4%: 1mEq=1ml; aqui convertendo

    // ── 3. Volume de eletrólitos total ───────────────────────────────────────
    const volEletTotal=naclVol+kVolFinal+mgVol+glucCaVol+(bicN>0?bicVol:0);

    // ── 4. QH ajustado (subtrair eletrólitos) ────────────────────────────────
    const QHajustado=parseFloat((QHtotal-volEletTotal).toFixed(1));

    // ── 5. Glicose 50% ───────────────────────────────────────────────────────
    const glic50=parseFloat(((gG*20-QHajustado)/9).toFixed(1));
    // corrigir se negativo
    const glic50Final=Math.max(0,glic50);

    // ── 6. SG 5% ─────────────────────────────────────────────────────────────
    const sg5=parseFloat((QHajustado-glic50Final).toFixed(1));
    const sg5Final=Math.max(0,sg5);

    // ── 7. Volume Total ───────────────────────────────────────────────────────
    const VT=parseFloat((sg5Final+glic50Final+naclVol+kVolFinal+mgVol+glucCaVol+(bicN>0?bicVol:0)).toFixed(1));

    // ── 8. Concentração de glicose final ─────────────────────────────────────
    const concGlic=VT>0?parseFloat(((glic50Final*50)/VT).toFixed(1)):0;
    const viaOk50=concGlic<=12.5, viaOk22=concGlic<=22;

    // ── 9. Velocidade de infusão (ml/h) ──────────────────────────────────────
    const velH=parseFloat((VT/24).toFixed(1));
    // BIC separado ml/h (se usado)
    const bicMlH=bicN>0&&bicVol>0?parseFloat((bicVol/24).toFixed(2)):null;

    // ── VIG verificação ───────────────────────────────────────────────────────
    const vigVerif=parseFloat(((gG*1000)/(pesoN*1440)).toFixed(2));

    setRes({
      QH,QHtotal:QHtotal.toFixed(1),QHajustado:QHajustado.toFixed(1),
      gG,vigN,vigVerif,
      // componentes
      sg5:sg5Final.toFixed(1),
      glic50:glic50Final.toFixed(1),
      glucCaVol:glucCaVol.toFixed(1),glucCaDoseN,
      naclVol:naclVol.toFixed(1),naclDoseN,naclConc,naclMeqMl,
      kVol:kVolFinal.toFixed(1),kclDoseN,k2po4,kclConc:k2po4?"K₂PO₄ 10%":`KCl ${kcl}%`,kMeqMl:k2po4?2:kclMeqMl,
      mgVol:mgVol.toFixed(1),mgDoseN,mgConc,mgMeqMl,
      bicVol:bicN>0?bicVol.toFixed(1):null,bicN,
      VT:VT.toFixed(1),velH,bicMlH,
      concGlic,viaOk50,viaOk22,
      foto,vmi,pesoN,tipo,dia,
      volEletTotal:volEletTotal.toFixed(1)
    });
  };

  const limpar=()=>{setPeso("");setVig("4.5");setNaclDose("");setKclDose("");setMgso4Dose("");setGlucCaDose("");setBic("");setK2po4(false);setRes(null);};

  const inpS={width:"100%",padding:"9px 10px",borderRadius:9,border:"1.5px solid #E5E7EB",fontSize:13,color:"#111827",outline:"none",background:"#FAFAFA",fontFamily:"inherit",boxSizing:"border-box",textAlign:"center",fontWeight:700};
  const lbS={fontSize:10,fontWeight:700,color:"#374151",display:"block",marginBottom:3,textAlign:"center"};
  const tagS=(cor,bg,txt)=><span style={{padding:"2px 7px",borderRadius:5,background:bg,color:cor,fontSize:10,fontWeight:700,flexShrink:0}}>{txt}</span>;

  return (
    <Modal title="💧 Venóclise — Hidratação Venosa Neonatal" onClose={onClose}>
      {/* Header */}
      <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:14,padding:"9px 13px",background:"linear-gradient(135deg,#EFF6FF,#DBEAFE)",borderRadius:11,border:"1px solid #3B82F620"}}>
        <div style={{width:42,height:42,borderRadius:11,background:"linear-gradient(135deg,#60A5FA,#3B82F6)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0,boxShadow:"0 3px 10px rgba(59,130,246,0.3)"}}>💧</div>
        <div>
          <div style={{fontSize:13,fontWeight:800,color:"#1E40AF"}}>Cálculo Completo de Venóclise</div>
          <div style={{fontSize:10,color:"#1D4ED8",marginTop:1}}>QH · VIG · Glicose · Eletrólitos · Volume Total</div>
        </div>
      </div>

      {/* Tipo + Dia */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
        <div>
          <label style={{fontSize:11,fontWeight:700,color:"#374151",display:"block",marginBottom:5}}>Tipo de RN</label>
          <div style={{display:"flex",gap:5}}>
            {[["rnpt","🍼 RNPT"],["rnt","👶 RNT"]].map(([v,l])=>(
              <button key={v} onClick={()=>setTipo(v)} style={{flex:1,padding:"8px 6px",borderRadius:9,border:`1.5px solid ${tipo===v?"#3B82F6":"#E5E7EB"}`,background:tipo===v?"#EFF6FF":"white",color:tipo===v?"#1D4ED8":"#6B7280",fontWeight:tipo===v?700:500,fontSize:11}}>{l}</button>
            ))}
          </div>
        </div>
        <div>
          <label style={{fontSize:11,fontWeight:700,color:"#374151",display:"block",marginBottom:5}}>Dia de vida</label>
          <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
            {["1","2","3","4+"].map(d=>(
              <button key={d} onClick={()=>setDia(d==="4+"?"4":d)} style={{flex:1,padding:"8px 4px",borderRadius:9,border:`1.5px solid ${dia===(d==="4+"?"4":d)?"#3B82F6":"#E5E7EB"}`,background:dia===(d==="4+"?"4":d)?"#EFF6FF":"white",color:dia===(d==="4+"?"4":d)?"#1D4ED8":"#6B7280",fontWeight:dia===(d==="4+"?"4":d)?700:500,fontSize:11}}>{d}</button>
            ))}
          </div>
        </div>
      </div>

      {/* Peso + VIG */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
        <div>
          <label style={lbS}>Peso <span style={{color:"#9CA3AF",fontWeight:400}}>(kg)</span></label>
          <input style={{...inpS,color:"#1D4ED8",fontSize:16}} type="number" step="0.01" value={peso} onChange={e=>setPeso(e.target.value)} placeholder="Ex: 1.250"/>
        </div>
        <div>
          <label style={lbS}>VIG <span style={{color:"#9CA3AF",fontWeight:400}}>(mg/kg/min · 2–12)</span></label>
          <input style={{...inpS,color:"#7C3AED"}} type="number" step="0.5" min="2" max="12" value={vig} onChange={e=>setVig(e.target.value)} placeholder="Ex: 4.5"/>
          <div style={{fontSize:9,color:"#9CA3AF",textAlign:"center",marginTop:2}}>Habitual: 4,5 a 5 mg/kg/min</div>
        </div>
      </div>

      {/* Foto/VMI toggles */}
      <div style={{display:"flex",gap:8,marginBottom:12}}>
        {[[foto,setFoto,"☀️ Fototerapia","+20% QH"],[vmi,setVmi,"🫁 VMI","−20% QH"]].map(([v,sv,l,sub],i)=>(
          <button key={i} onClick={()=>sv(x=>!x)} style={{flex:1,padding:"8px 10px",borderRadius:10,border:`1.5px solid ${v?"#F59E0B":"#E5E7EB"}`,background:v?"#FFFBEB":"white",display:"flex",alignItems:"center",gap:7,transition:"all 0.15s"}}>
            <div style={{width:28,height:16,borderRadius:8,background:v?"#F59E0B":"#D1D5DB",position:"relative",flexShrink:0}}>
              <div style={{position:"absolute",top:2,left:v?14:2,width:12,height:12,borderRadius:"50%",background:"white",transition:"left 0.18s"}}/>
            </div>
            <div style={{textAlign:"left"}}><div style={{fontSize:11,fontWeight:700,color:v?"#D97706":"#6B7280"}}>{l}</div><div style={{fontSize:9,color:"#9CA3AF"}}>{sub}</div></div>
          </button>
        ))}
      </div>

      {/* Eletrólitos */}
      <div style={{background:"#F9FAFB",borderRadius:12,padding:"11px 12px",marginBottom:10,border:"1px solid #E5E7EB"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
          <div style={{fontSize:11,fontWeight:700,color:"#374151"}}>⚗️ ELETRÓLITOS</div>
          <div style={{fontSize:9.5,color:"#9CA3AF",fontWeight:600,background:"#F3F4F6",padding:"3px 8px",borderRadius:6}}>Deixar em branco se não usar</div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
          {/* NaCl */}
          <div style={{background:"white",borderRadius:9,padding:"9px 10px",border:"1px solid #E5E7EB"}}>
            <div style={{fontSize:10,fontWeight:700,color:"#374151",marginBottom:5}}>NaCl <span style={{color:"#9CA3AF",fontWeight:400}}>(mEq/kg/dia) · opcional</span></div>
            <div style={{display:"flex",gap:4,marginBottom:5}}>
              {["10","20"].map(c=><button key={c} onClick={()=>setNacl(c)} style={{flex:1,padding:"4px",borderRadius:7,border:`1px solid ${nacl===c?"#3B82F6":"#E5E7EB"}`,background:nacl===c?"#EFF6FF":"white",color:nacl===c?"#1D4ED8":"#6B7280",fontSize:10,fontWeight:nacl===c?700:500}}>{c}% ({c==="10"?"1,7":"3,4"} mEq/ml)</button>)}
            </div>
            <input style={{...inpS,fontSize:12,borderColor:naclDose?"#3B82F6":"#E5E7EB"}} type="number" step="0.5" value={naclDose} onChange={e=>setNaclDose(e.target.value)} placeholder="em branco = não usar"/>
            <div style={{fontSize:9,color:"#9CA3AF",textAlign:"center",marginTop:2}}>Ref: RNT 2 · RNPT 3–4 mEq/kg</div>
          </div>
          {/* KCl / K2PO4 */}
          <div style={{background:"white",borderRadius:9,padding:"9px 10px",border:"1px solid #E5E7EB"}}>
            <div style={{fontSize:10,fontWeight:700,color:"#374151",marginBottom:5}}>
              <button onClick={()=>setK2po4(x=>!x)} style={{background:k2po4?"#F0FDF4":"#F9FAFB",border:`1px solid ${k2po4?"#22C55E":"#E5E7EB"}`,borderRadius:5,padding:"1px 6px",fontSize:9,fontWeight:700,color:k2po4?"#16A34A":"#6B7280",cursor:"pointer",marginRight:4}}>{k2po4?"K₂PO₄":"KCl"}</button>
              <span style={{color:"#9CA3AF",fontWeight:400}}>(mEq/kg/dia) · opcional</span>
            </div>
            {!k2po4&&<div style={{display:"flex",gap:4,marginBottom:5}}>
              {["10","19.1"].map(c=><button key={c} onClick={()=>setKcl(c)} style={{flex:1,padding:"4px",borderRadius:7,border:`1px solid ${kcl===c?"#22C55E":"#E5E7EB"}`,background:kcl===c?"#F0FDF4":"white",color:kcl===c?"#15803D":"#6B7280",fontSize:9,fontWeight:kcl===c?700:500}}>{c}% ({c==="10"?"1,3":"2,5"} mEq/ml)</button>)}
            </div>}
            {k2po4&&<div style={{fontSize:9,color:"#16A34A",marginBottom:5,fontWeight:700}}>K₂PO₄ 10% = 2 mEq/ml</div>}
            <input style={{...inpS,fontSize:12,borderColor:kclDose?"#22C55E":"#E5E7EB"}} type="number" step="0.5" value={kclDose} onChange={e=>setKclDose(e.target.value)} placeholder="em branco = não usar"/>
            <div style={{fontSize:9,color:"#9CA3AF",textAlign:"center",marginTop:2}}>Ref: RNT 2 · RNPT 1–2 mEq/kg</div>
          </div>
          {/* MgSO4 */}
          <div style={{background:"white",borderRadius:9,padding:"9px 10px",border:"1px solid #E5E7EB"}}>
            <div style={{fontSize:10,fontWeight:700,color:"#374151",marginBottom:5}}>MgSO₄ <span style={{color:"#9CA3AF",fontWeight:400}}>(mEq/kg/dia) · opcional</span></div>
            <div style={{display:"flex",gap:4,marginBottom:5}}>
              {["10","50"].map(c=><button key={c} onClick={()=>setMgso4(c)} style={{flex:1,padding:"4px",borderRadius:7,border:`1px solid ${mgso4===c?"#8B5CF6":"#E5E7EB"}`,background:mgso4===c?"#F5F3FF":"white",color:mgso4===c?"#7C3AED":"#6B7280",fontSize:9,fontWeight:mgso4===c?700:500}}>{c}% ({c==="10"?"0,8":"4,0"} mEq/ml)</button>)}
            </div>
            <input style={{...inpS,fontSize:12,borderColor:mgso4Dose?"#8B5CF6":"#E5E7EB"}} type="number" step="0.1" value={mgso4Dose} onChange={e=>setMgso4Dose(e.target.value)} placeholder="em branco = não usar"/>
            <div style={{fontSize:9,color:"#9CA3AF",textAlign:"center",marginTop:2}}>Ref: RNT 0,25–0,5 · RNPT 0,5 mEq/kg</div>
          </div>
          {/* Gluconato Cálcio */}
          <div style={{background:"white",borderRadius:9,padding:"9px 10px",border:"1px solid #E5E7EB"}}>
            <div style={{fontSize:10,fontWeight:700,color:"#374151",marginBottom:5}}>Gluconato Ca²⁺ 10% <span style={{color:"#9CA3AF",fontWeight:400}}>(mg/kg/dia) · opcional</span></div>
            <div style={{fontSize:9,color:"#EA580C",marginBottom:5,fontWeight:700}}>100 mg/ml</div>
            <input style={{...inpS,fontSize:12,borderColor:glucCaDose?"#EA580C":"#E5E7EB"}} type="number" step="50" value={glucCaDose} onChange={e=>setGlucCaDose(e.target.value)} placeholder="em branco = não usar"/>
            <div style={{fontSize:9,color:"#9CA3AF",textAlign:"center",marginTop:2}}>Ref: 200 mg/kg/dia</div>
          </div>
        </div>
        {/* Bicarbonato opcional */}
        <div style={{background:"white",borderRadius:9,padding:"9px 10px",border:"1px solid #FCA5A5"}}>
          <div style={{fontSize:10,fontWeight:700,color:"#DC2626",marginBottom:4}}>NaHCO₃ 8,4% <span style={{color:"#9CA3AF",fontWeight:400}}>(mEq/kg) · opcional — deixar em branco se não usar</span></div>
          <input style={{...inpS,fontSize:12,borderColor:bic?"#EF4444":"#E5E7EB"}} type="number" step="0.5" value={bic} onChange={e=>setBic(e.target.value)} placeholder="em branco = não usar"/>
          <div style={{fontSize:9,color:"#9CA3AF",textAlign:"center",marginTop:2}}>1 mEq NaHCO₃ 8,4% = 1 mL · Dose: BE × peso × 0,3</div>
        </div>
      </div>

      <div style={{display:"flex",gap:8,marginBottom:14}}>
        <button onClick={limpar} style={{flex:1,padding:"10px",borderRadius:10,border:"1.5px solid #E5E7EB",background:"white",color:"#374151",fontWeight:700,fontSize:13}}>🔄 Limpar</button>
        <button onClick={calcular} style={{flex:2,padding:"11px",borderRadius:10,border:"none",background:"linear-gradient(90deg,#3B82F6,#60A5FA)",color:"white",fontWeight:800,fontSize:14,boxShadow:"0 4px 14px rgba(59,130,246,0.4)"}}>⚡ Calcular</button>
      </div>

      {res&&(res.erro?(
        <div style={{background:"#FEE2E2",borderRadius:12,padding:14,color:"#DC2626",fontWeight:600,fontSize:13}}>⚠️ {res.erro}</div>
      ):(
        <div style={{animation:"fadeIn 0.3s ease"}}>

          {/* QH banner */}
          <div style={{background:"linear-gradient(135deg,#1E40AF,#2563EB)",borderRadius:15,padding:"12px 16px",marginBottom:12,color:"white",textAlign:"center"}}>
            <div style={{fontSize:10,color:"rgba(255,255,255,0.65)",fontWeight:700,marginBottom:2}}>{res.tipo.toUpperCase()} · DIA {res.dia} · PESO {res.pesoN} kg{res.foto?" · FOTOTERAPIA":""}{res.vmi?" · VMI":""}</div>
            <div style={{display:"flex",justifyContent:"center",gap:24,flexWrap:"wrap"}}>
              <div style={{textAlign:"center"}}>
                <div style={{fontSize:10,color:"rgba(255,255,255,0.6)"}}>QH ajustado</div>
                <div style={{fontSize:28,fontWeight:900}}>{res.QH}<span style={{fontSize:13,fontWeight:600}}> ml/kg/dia</span></div>
              </div>
              <div style={{textAlign:"center"}}>
                <div style={{fontSize:10,color:"rgba(255,255,255,0.6)"}}>Volume Total/dia</div>
                <div style={{fontSize:24,fontWeight:900,color:"#93C5FD"}}>{res.QHtotal}<span style={{fontSize:12,fontWeight:600}}> ml</span></div>
              </div>
              <div style={{textAlign:"center"}}>
                <div style={{fontSize:10,color:"rgba(255,255,255,0.6)"}}>VIG</div>
                <div style={{fontSize:22,fontWeight:900,color:"#C4B5FD"}}>{res.vigN}<span style={{fontSize:11}}> mg/kg/min</span></div>
              </div>
            </div>
          </div>

          {/* gG */}
          <div style={{background:"#F5F3FF",borderRadius:10,padding:"9px 13px",marginBottom:10,border:"1px solid #DDD6FE",display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:20}}>🍬</span>
            <div style={{flex:1}}>
              <div style={{fontSize:10,fontWeight:700,color:"#7C3AED"}}>gG — Grama de Glicose / dia</div>
              <div style={{fontSize:13,fontWeight:800,color:"#6D28D9"}}>gG = VIG × Peso × 1,44 = {res.vigN} × {res.pesoN} × 1,44 = <span style={{fontSize:16}}>{res.gG} g/dia</span></div>
            </div>
          </div>

          {/* Tabela de componentes */}
          <div style={{background:"white",borderRadius:13,border:"1.5px solid #E5E7EB",overflow:"hidden",marginBottom:12}}>
            <div style={{background:"linear-gradient(90deg,#3B82F6,#60A5FA)",padding:"8px 14px"}}>
              <div style={{color:"white",fontWeight:800,fontSize:12}}>📋 COMPONENTES DA VENÓCLISE</div>
            </div>
            <div style={{padding:"2px 0"}}>
              {/* Header */}
              <div style={{display:"grid",gridTemplateColumns:"2fr 1.2fr 1.2fr 1.2fr",gap:0,padding:"6px 12px",background:"#F9FAFB",borderBottom:"1px solid #E5E7EB"}}>
                {["Componente","Concentração","Dose/Dia","Volume (ml)"].map(h=><div key={h} style={{fontSize:9.5,fontWeight:700,color:"#9CA3AF"}}>{h}</div>)}
              </div>
              {[
                {label:"💙 SG 5%",      conc:"Glicose 5%",   dose:"—",  vol:res.sg5,    cor:"#3B82F6",bg:"#EFF6FF", skip:false},
                {label:"🟡 Glic. 50%",  conc:"Glicose 50%",  dose:"—",  vol:res.glic50, cor:"#D97706",bg:"#FFFBEB", skip:false},
                {label:"🟠 Glucon. Ca²⁺",conc:"100 mg/ml",   dose:res.glucCaDoseN>0?`${res.glucCaDoseN}mg/kg`:"—", vol:res.glucCaVol, cor:"#EA580C",bg:"#FFF7ED", skip:res.glucCaDoseN===0},
                {label:"🔵 NaCl",        conc:`${res.naclConc}% (${res.naclMeqMl}mEq/ml)`, dose:res.naclDoseN>0?`${res.naclDoseN}mEq/kg`:"—", vol:res.naclVol, cor:"#0369A1",bg:"#F0F9FF", skip:res.naclDoseN===0},
                {label:`🟢 ${res.k2po4?"K₂PO₄":"KCl"}`,conc:res.k2po4?"10% (2mEq/ml)":`${res.kclConc.replace("KCl ","")} (${res.kMeqMl}mEq/ml)`,dose:res.kclDoseN>0?`${res.kclDoseN}mEq/kg`:"—",vol:res.kVol,cor:"#16A34A",bg:"#F0FDF4", skip:res.kclDoseN===0},
                {label:"🟣 MgSO₄",       conc:`${res.mgConc}% (${res.mgMeqMl}mEq/ml)`, dose:res.mgDoseN>0?`${res.mgDoseN}mEq/kg`:"—", vol:res.mgVol, cor:"#7C3AED",bg:"#F5F3FF", skip:res.mgDoseN===0},
                res.bicVol?{label:"⚪ NaHCO₃ 8,4%",conc:"1 mEq/ml",dose:`${res.bicN}mEq/kg`,vol:res.bicVol,cor:"#DC2626",bg:"#FEF2F2",skip:false}:null,
              ].filter(Boolean).filter(r=>!r.skip).map((row,i)=>(
                <div key={i} style={{display:"grid",gridTemplateColumns:"2fr 1.2fr 1.2fr 1.2fr",gap:0,padding:"7px 12px",borderBottom:"1px solid #F3F4F6",background:row.bg,alignItems:"center"}}>
                  <div style={{fontSize:11,fontWeight:700,color:row.cor}}>{row.label}</div>
                  <div style={{fontSize:10,color:"#6B7280"}}>{row.conc}</div>
                  <div style={{fontSize:10,color:"#6B7280"}}>{row.dose}</div>
                  <div style={{fontSize:13,fontWeight:900,color:row.cor}}>{row.vol} ml</div>
                </div>
              ))}
              {/* TOTAL */}
              <div style={{display:"grid",gridTemplateColumns:"2fr 1.2fr 1.2fr 1.2fr",gap:0,padding:"9px 12px",background:"linear-gradient(90deg,#1E40AF10,#3B82F610)",borderTop:"2px solid #3B82F6"}}>
                <div style={{fontSize:13,fontWeight:900,color:"#1E40AF",gridColumn:"1/4"}}>🔷 VOLUME TOTAL (VT)</div>
                <div style={{fontSize:18,fontWeight:900,color:"#1E40AF"}}>{res.VT} ml</div>
              </div>
            </div>
          </div>

          {/* BIC de corr / Velocidade */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
            <div style={{background:"linear-gradient(135deg,#3B82F6,#60A5FA)",borderRadius:12,padding:"12px 14px",color:"white",textAlign:"center"}}>
              <div style={{fontSize:10,color:"rgba(255,255,255,0.7)",fontWeight:700,marginBottom:2}}>⏱ VELOCIDADE DE INFUSÃO</div>
              <div style={{fontSize:26,fontWeight:900}}>{res.velH}</div>
              <div style={{fontSize:12,color:"rgba(255,255,255,0.8)"}}>mL/h</div>
            </div>
            {res.bicMlH&&<div style={{background:"linear-gradient(135deg,#DC2626,#EF4444)",borderRadius:12,padding:"12px 14px",color:"white",textAlign:"center"}}>
              <div style={{fontSize:10,color:"rgba(255,255,255,0.7)",fontWeight:700,marginBottom:2}}>💉 BIC SEPARADO</div>
              <div style={{fontSize:26,fontWeight:900}}>{res.bicMlH}</div>
              <div style={{fontSize:12,color:"rgba(255,255,255,0.8)"}}>mL/h</div>
            </div>}
            {!res.bicMlH&&<div style={{background:"#F9FAFB",borderRadius:12,padding:"12px 14px",border:"1px solid #E5E7EB",textAlign:"center"}}>
              <div style={{fontSize:10,fontWeight:700,color:"#9CA3AF",marginBottom:4}}>🍬 [GLICOSE] FINAL</div>
              <div style={{fontSize:22,fontWeight:900,color:res.concGlic>22?"#DC2626":res.concGlic>12.5?"#D97706":"#16A34A"}}>{res.concGlic}%</div>
              <div style={{fontSize:10,color:res.concGlic>22?"#DC2626":res.concGlic>12.5?"#D97706":"#16A34A",marginTop:2,fontWeight:700}}>{res.concGlic<=12.5?"✅ Veia periférica OK":res.concGlic<=22?"⚠️ Apenas Veia Central":"🚨 Diluir — Acima do limite"}</div>
            </div>}
          </div>

          {/* Concentração glicose alerta */}
          <div style={{background:res.concGlic>22?"#FEE2E2":res.concGlic>12.5?"#FFFBEB":"#DCFCE7",borderRadius:12,padding:"10px 13px",marginBottom:12,border:`1.5px solid ${res.concGlic>22?"#EF4444":res.concGlic>12.5?"#F59E0B":"#22C55E"}30`}}>
            <div style={{fontSize:11,fontWeight:700,color:res.concGlic>22?"#DC2626":res.concGlic>12.5?"#D97706":"#16A34A",marginBottom:4}}>
              {res.concGlic>22?"🚨":"res.concGlic>12.5"?"⚠️":"✅"} Concentração de Glicose Final: <span style={{fontSize:14}}>{res.concGlic}%</span>
            </div>
            <div style={{fontSize:11,color:"#374151",lineHeight:1.7}}>
              <b>Veia periférica:</b> até 12,5% → {res.viaOk50?"✅ OK":"❌ NÃO"}<br/>
              <b>Veia central:</b> até 22% → {res.viaOk22?"✅ OK":"❌ NÃO — Revisar VIG ou aumentar volume"}
            </div>
          </div>

          {/* VIG verificação */}
          <div style={{background:"#F5F3FF",borderRadius:10,padding:"9px 13px",marginBottom:12,border:"1px solid #DDD6FE"}}>
            <div style={{fontSize:10,fontWeight:700,color:"#7C3AED",marginBottom:3}}>✅ VERIFICAÇÃO DO VIG</div>
            <div style={{fontSize:12,color:"#374151"}}>VIG = gG × 1000 / (Peso × 1440) = {res.gG*1000} / ({res.pesoN} × 1440) = <b style={{color:"#7C3AED"}}>{res.vigVerif} mg/kg/min</b> {Math.abs(res.vigVerif-res.vigN)<0.2?"✅ Confere":"⚠️ Verificar arredondamento"}</div>
          </div>

          {/* OBS importantes */}
          <div style={{background:"#FFFBEB",borderRadius:11,padding:"10px 13px",border:"1px solid #FDE68A"}}>
            <div style={{fontSize:11,fontWeight:700,color:"#92400E",marginBottom:6}}>⚠️ OBSERVAÇÕES IMPORTANTES</div>
            <div style={{fontSize:11,color:"#78350F",lineHeight:1.8}}>
              • Sempre subtrair eletrólitos do QH <b>antes</b> de calcular Glic. 50% e SG 5%<br/>
              • Vol. eletrólitos total: <b>{res.volEletTotal} ml</b> → QH ajustado: <b>{res.QHajustado} ml</b><br/>
              • gG = VIG × Peso × 1,44 = <b>{res.gG} g/dia</b><br/>
              • Glic. 50% = (gG × 20 − QH ajustado) / 9<br/>
              • SG 5% = QH ajustado − Glic. 50%<br/>
              {res.foto?"• Fototerapia: QH aumentado em 20% ☀️\n":""}
              {res.vmi?"• VMI: QH reduzido em 20% 🫁\n":""}
              • Após 72h: RNPT máx 150ml/kg/dia · RNT 120ml/kg/dia
            </div>
          </div>
        </div>
      ))}
    </Modal>
  );
}
