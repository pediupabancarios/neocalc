  {id:"adrenalina", nome:"Adrenalina",    conc:"1 mg/mL",    unidDose:"mcg/kg/min",doseMin:0.05, doseMax:2,    doseHab:0.1,  formula:(p,d)=>({vol:p*d*1.44,        bic24:p*d*1.44/24,     bic48:p*d*1.44/48,     formula:`P × dose × 1,44`}),       cor:"#DC2626", bg:"#FEE2E2", emoji:"🚨", via:"Central", obs:"Choque refratário. Monitorar glicemia."},
  {id:"noradrenalina",nome:"Noradrenalina",conc:"4 mg/mL",   unidDose:"mcg/kg/min",doseMin:0.05, doseMax:2,    doseHab:0.1,  formula:(p,d)=>({vol:p*d*1.44,        bic24:p*d*1.44/24,     bic48:p*d*1.44/48,     formula:`P × dose × 1,44`}),       cor:"#991B1B", bg:"#FEF2F2", emoji:"⚡", via:"Central", obs:"Choque vasoplégico. Monitorar PAM e diurese."},
  {id:"milrinona",  nome:"Milrinona",     conc:"1 mg/mL",    unidDose:"mcg/kg/min",doseMin:0.25, doseMax:0.75, doseHab:0.5,  formula:(p,d)=>({vol:p*d*1.44,        bic24:p*d*1.44/24,     bic48:p*d*1.44/48,     formula:`P × dose × 1,44`}),       cor:"#BE185D", bg:"#FDF2F8", emoji:"💗", via:"Central", obs:"Inodilatador. HPPRN/falência cardíaca. Monitorar PA."},
  // grupo 2 — outros
  {id:"nitroprussiato",nome:"Nitroprussiato",conc:"50 mg/2 mL",unidDose:"mcg/kg/min",doseMin:0.5,doseMax:8,   doseHab:1,    formula:(p,d)=>({vol:p*d*1.44/25,     bic24:p*d*1.44/25/24,  bic48:p*d*1.44/25/48,  formula:`P × dose × 1,44 / 25`}), cor:"#0369A1", bg:"#F0F9FF", emoji:"🩵", via:"Central", obs:"HAS/crise hipertensiva. Proteger da luz. Monitorar cianeto se uso >72h."},
  {id:"salbutamol",  nome:"Salbutamol",   conc:"0,5 mg/mL",  unidDose:"mcg/kg/min",doseMin:1,    doseMax:10,   doseHab:2,    formula:(p,d)=>({vol:p*d*1.44/0.5,    bic24:p*d*1.44/0.5/24, bic48:p*d*1.44/0.5/48, formula:`P × dose × 1,44 / 0,5`}),cor:"#16A34A", bg:"#F0FDF4", emoji:"🫁", via:"Central/Periférica", obs:"Broncoespasmo. Monitorar FC e K⁺."},
  {id:"tiopental",   nome:"Tiopental",    conc:"1 g/20 mL",  unidDose:"mcg/kg/min",doseMin:5,    doseMax:60,   doseHab:15,   formula:(p,d)=>({vol:p*d*1.44/50,     bic24:p*d*1.44/50/24,  bic48:p*d*1.44/50/48,  formula:`P × dose × 1,44 / 50`}), cor:"#64748B", bg:"#F8FAFC", emoji:"😶", via:"Central", obs:"Sedação refratária/EE refratário. Monitorar PA e FR."},
  {id:"furosemida",  nome:"Furosemida",   conc:"10 mg/mL",   unidDose:"mg/kg/h",   doseMin:0.1,  doseMax:1,    doseHab:0.5,  formula:(p,d)=>({vol:p*d*24/10,       bic24:p*d*24/10/24,    bic48:p*d*24/10/48,    formula:`P × dose × 24 / 10`}),   cor:"#D97706", bg:"#FFFBEB", emoji:"💧", via:"Central/Periférica", obs:"Diurese forçada. Monitorar eletrólitos e diurese."},
  {id:"prostaglandina",nome:"Prostaglandina E1",conc:"20 mcg/1 mL",unidDose:"mcg/kg/min",doseMin:0.01,doseMax:0.1,doseHab:0.05,formula:(p,d)=>{
    // Apresentação: 20 mcg em 1 mL — concentração pura
    const vol=p*d*1440/20;
    return {vol:parseFloat(vol.toFixed(2)),bic24:parseFloat((vol/24).toFixed(3)),bic48:parseFloat((vol/48).toFixed(3)),formula:`P × dose × 1440 / 20 (mcg/mL)`};
  }, cor:"#DC2626", bg:"#FEF2F2", emoji:"❤️‍🔥", via:"VEIA CENTRAL — obrigatório", obs:"Cardiopatia congênita ducto-dependente. Monitorar apneia! Ter suporte ventilatório disponível.", especial:"pge1"},
];

function DrogasCalc({onClose}){
  const [peso,setPeso]=useState("");
  const [drogaId,setDrogaId]=useState("midazolam");
  const [doseCustom,setDoseCustom]=useState("");
  const [volDilui,setVolDilui]=useState("24");
  const [res,setRes]=useState(null);

  const droga=DROGAS_DB.find(d=>d.id===drogaId)||DROGAS_DB[0];
  const doseN=parseFloat(doseCustom)||droga.doseHab;

  const calcular=()=>{
    const pesoN=parseFloat(peso);
    if(isNaN(pesoN)||pesoN<=0){setRes({erro:"Informe o peso do paciente."});return;}
    if(doseN<droga.doseMin*0.5||doseN>droga.doseMax*1.5){setRes({erro:`Dose fora do intervalo esperado (${droga.doseMin}–${droga.doseMax} ${droga.unidDose}).`});return;}

    const calc=droga.formula(pesoN,doseN);
    const volDrug=parseFloat(calc.vol.toFixed(2));
    const volTotalN=parseFloat(volDilui);
    const volSF=parseFloat((volTotalN-volDrug).toFixed(2));
    const bicMlH=parseFloat((volTotalN/24).toFixed(2));
    const bicMlH48=parseFloat((volTotalN/48).toFixed(2));

    // alertas dose
    let alertaDose=null;
    const pctRange=(doseN-droga.doseMin)/(droga.doseMax-droga.doseMin);
    if(doseN<droga.doseMin) alertaDose={tipo:"warn",txt:"Dose abaixo do mínimo recomendado"};
    else if(doseN>droga.doseMax) alertaDose={tipo:"danger",txt:"⚠️ Dose acima do máximo recomendado"};
    else if(pctRange>0.85) alertaDose={tipo:"warn",txt:"Dose na faixa alta — monitorar"};

    setRes({pesoN,doseN,volDrug,volSF,volTotalN,bicMlH,bicMlH48,formula:calc.formula,alertaDose,droga,pctRange:Math.max(0,Math.min(1,pctRange))});
  };

  const limpar=()=>{setPeso("");setDoseCustom("");setRes(null);};

  const inpS={width:"100%",padding:"10px 12px",borderRadius:10,border:"1.5px solid #E5E7EB",fontSize:14,color:"#111827",outline:"none",background:"#FAFAFA",fontFamily:"inherit",boxSizing:"border-box",fontWeight:700};
  const inpCtrS={...inpS,textAlign:"center",fontSize:15};

  return (
    <Modal title="💊 Drogas de Infusão Contínua — BIC" onClose={onClose}>
      {/* Header */}
      <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:14,padding:"9px 13px",background:"linear-gradient(135deg,#FEF2F2,#FEE2E2)",borderRadius:11,border:"1px solid #EF444420"}}>
        <div style={{width:42,height:42,borderRadius:11,background:"linear-gradient(135deg,#F87171,#EF4444)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0,boxShadow:"0 3px 10px rgba(239,68,68,0.3)"}}>💊</div>
        <div>
          <div style={{fontSize:13,fontWeight:800,color:"#7F1D1D"}}>Cálculo de BIC — Drogas Vasoativas e Sedoanalgesia</div>
          <div style={{fontSize:10,color:"#991B1B",marginTop:1}}>Diluição · Volume · Velocidade (mL/h)</div>
        </div>
      </div>

      {/* PESO */}
      <div style={{marginBottom:12}}>
        <label style={{fontSize:11,fontWeight:700,color:"#374151",display:"block",marginBottom:5}}>Peso do Paciente <span style={{color:"#9CA3AF",fontWeight:400}}>(kg)</span></label>
        <input style={{...inpCtrS,color:"#1D4ED8",fontSize:18,border:"2px solid #3B82F640"}} type="number" step="0.01" value={peso} onChange={e=>setPeso(e.target.value)} placeholder="Ex: 1.250"/>
      </div>

      {/* DROGA selector */}
      <div style={{marginBottom:12}}>
        <label style={{fontSize:11,fontWeight:700,color:"#374151",display:"block",marginBottom:6}}>Medicação</label>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
          {DROGAS_DB.map(d=>(
            <button key={d.id} onClick={()=>{setDrogaId(d.id);setDoseCustom("");setRes(null);}}
              style={{padding:"8px 10px",borderRadius:10,border:`1.5px solid ${drogaId===d.id?d.cor:"#E5E7EB"}`,background:drogaId===d.id?d.bg:"white",cursor:"pointer",textAlign:"left",transition:"all 0.15s",display:"flex",alignItems:"center",gap:7}}>
              <span style={{fontSize:16,flexShrink:0}}>{d.emoji}</span>
              <div>
                <div style={{fontSize:11,fontWeight:drogaId===d.id?800:600,color:drogaId===d.id?d.cor:"#374151",lineHeight:1.2}}>{d.nome}</div>
                <div style={{fontSize:9,color:"#9CA3AF"}}>{d.conc}</div>
              </div>
            </button>
          ))}
        </div>
      </div>

      {/* Info da droga selecionada */}
      <div style={{background:droga.bg,borderRadius:11,padding:"9px 12px",marginBottom:12,border:`1.5px solid ${droga.cor}30`}}>
        <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:5}}>
          <span style={{fontSize:22}}>{droga.emoji}</span>
          <div>
            <div style={{fontSize:13,fontWeight:800,color:droga.cor}}>{droga.nome} <span style={{fontSize:10,fontWeight:500,color:"#6B7280"}}>{droga.conc}</span></div>
            <div style={{fontSize:10,color:"#6B7280"}}>Dose: {droga.doseMin}–{droga.doseMax} {droga.unidDose} · Habitual: {droga.doseHab}</div>
          </div>
        </div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          <span style={{padding:"2px 8px",borderRadius:5,background:droga.cor,color:"white",fontSize:9,fontWeight:700}}>📐 {droga.formula}</span>
          <span style={{padding:"2px 8px",borderRadius:5,background:"rgba(0,0,0,0.06)",color:"#374151",fontSize:9,fontWeight:700}}>🏥 {droga.via}</span>
        </div>
      </div>

      {/* DOSE input com slider */}
      <div style={{marginBottom:10}}>
        <label style={{fontSize:11,fontWeight:700,color:"#374151",display:"block",marginBottom:5}}>
          Dose <span style={{color:"#9CA3AF",fontWeight:400}}>({droga.unidDose})</span>
          <span style={{marginLeft:8,padding:"2px 8px",borderRadius:5,background:droga.cor,color:"white",fontSize:10,fontWeight:700}}>{droga.doseMin}–{droga.doseMax}</span>
        </label>
        <input style={{...inpCtrS,color:droga.cor,border:`2px solid ${droga.cor}50`,fontSize:17}} type="number" step={droga.doseMax<1?"0.01":droga.doseMax<10?"0.5":"1"} value={doseCustom} onChange={e=>setDoseCustom(e.target.value)} placeholder={`Habitual: ${droga.doseHab}`}/>
        {/* Range slider */}
        <input type="range" min={droga.doseMin} max={droga.doseMax} step={droga.doseMax<1?"0.01":droga.doseMax<10?"0.5":"1"} value={doseCustom||droga.doseHab} onChange={e=>setDoseCustom(e.target.value)}
          style={{width:"100%",marginTop:6,accentColor:droga.cor,cursor:"pointer"}}/>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:9,color:"#9CA3AF",marginTop:1}}>
          <span>Mín: {droga.doseMin}</span><span>Habitual: {droga.doseHab}</span><span>Máx: {droga.doseMax}</span>
        </div>
      </div>

      {/* PGE1 diluição especial */}
      {droga.especial==="pge1"&&(
        <div style={{background:"#FEF2F2",borderRadius:10,padding:"9px 12px",marginBottom:10,border:"1.5px solid #EF4444"}}>
          <div style={{fontSize:11,fontWeight:700,color:"#DC2626",marginBottom:4}}>❤️‍🔥 Prostaglandina E1</div>
          <div style={{fontSize:11,color:"#991B1B",lineHeight:1.6}}>
            Apresentação: <b>20 mcg em 1 mL</b><br/>
            Fórmula: <b>P × dose × 1440 / concentração após diluição</b><br/>
            Volume total nas 24h ÷ 24 = mL/h em BIC
          </div>
          <div style={{fontSize:10,color:"#991B1B",marginTop:6,fontWeight:700}}>⚠️ CORRER EM VEIA CENTRAL — obrigatório</div>
        </div>
      )}

      {/* Volume seringa */}
      <div style={{marginBottom:12}}>
        <label style={{fontSize:11,fontWeight:700,color:"#374151",display:"block",marginBottom:5}}>Volume Total da Seringa (diluição)</label>
        <div style={{display:"flex",gap:6}}>
          {[["24","24 mL → 1 mL/h"],["48","48 mL → 2 mL/h"],["12","12 mL → 0,5 mL/h"]].map(([v,l])=>(
            <button key={v} onClick={()=>setVolDilui(v)} style={{flex:1,padding:"8px 6px",borderRadius:10,border:`1.5px solid ${volDilui===v?"#EF4444":"#E5E7EB"}`,background:volDilui===v?"#FEF2F2":"white",color:volDilui===v?"#DC2626":"#6B7280",fontWeight:volDilui===v?700:500,fontSize:10.5,textAlign:"center"}}>{l}</button>
          ))}
        </div>
        <div style={{fontSize:9,color:"#9CA3AF",marginTop:4,textAlign:"center"}}>Obs: Diluir o volume da droga com SF0,9% para completar o volume total → correr em BIC</div>
      </div>

      <div style={{display:"flex",gap:8,marginBottom:14}}>
        <button onClick={limpar} style={{flex:1,padding:"10px",borderRadius:10,border:"1.5px solid #E5E7EB",background:"white",color:"#374151",fontWeight:700,fontSize:13}}>🔄 Limpar</button>
        <button onClick={calcular} style={{flex:2,padding:"11px",borderRadius:10,border:"none",background:`linear-gradient(90deg,${droga.cor},${droga.cor}CC)`,color:"white",fontWeight:800,fontSize:14,boxShadow:`0 4px 14px ${droga.cor}44`}}>⚡ Calcular BIC</button>
      </div>

      {res&&(res.erro?(
        <div style={{background:"#FEE2E2",borderRadius:12,padding:14,color:"#DC2626",fontWeight:600,fontSize:13}}>⚠️ {res.erro}</div>
      ):(
        <div style={{animation:"fadeIn 0.3s ease"}}>

          {/* Alerta dose */}
          {res.alertaDose&&<div style={{background:res.alertaDose.tipo==="danger"?"#FEE2E2":"#FFFBEB",borderRadius:10,padding:"8px 12px",marginBottom:10,border:`1.5px solid ${res.alertaDose.tipo==="danger"?"#EF4444":"#F59E0B"}`,fontSize:12,fontWeight:700,color:res.alertaDose.tipo==="danger"?"#DC2626":"#D97706"}}>
            {res.alertaDose.txt}
          </div>}

          {/* Dose range bar */}
          <div style={{background:"#F9FAFB",borderRadius:11,padding:"9px 12px",marginBottom:12,border:"1px solid #E5E7EB"}}>
            <div style={{fontSize:10,fontWeight:700,color:"#9CA3AF",marginBottom:6}}>📊 POSIÇÃO DA DOSE NO INTERVALO TERAPÊUTICO</div>
            <div style={{position:"relative",height:20,borderRadius:8,overflow:"hidden",background:"linear-gradient(90deg,#DCFCE7,#FEF9C3,#FEE2E2)"}}>
              <div style={{position:"absolute",top:0,left:`${Math.min(97,res.pctRange*100)}%`,width:3,height:"100%",background:droga.cor,transform:"translateX(-50%)"}}/>
              <div style={{position:"absolute",top:"50%",left:`${Math.min(94,res.pctRange*100)}%`,transform:"translate(-50%,-50%)",background:droga.cor,color:"white",borderRadius:5,padding:"1px 6px",fontSize:10,fontWeight:900,whiteSpace:"nowrap"}}>{res.doseN} {droga.unidDose}</div>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:9,color:"#9CA3AF",marginTop:3}}>
              <span>Mín: {droga.doseMin}</span><span style={{fontWeight:700,color:droga.cor}}>Dose: {res.doseN}</span><span>Máx: {droga.doseMax}</span>
            </div>
          </div>

          {/* RESULTADO PRINCIPAL */}
          <div style={{background:`linear-gradient(135deg,${droga.cor}EE,${droga.cor}AA)`,borderRadius:16,padding:"14px 16px",marginBottom:12,color:"white"}}>
            <div style={{fontSize:10,color:"rgba(255,255,255,0.7)",fontWeight:700,marginBottom:8}}>📐 {res.formula}</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <div style={{background:"rgba(255,255,255,0.15)",borderRadius:12,padding:"10px 12px",textAlign:"center"}}>
                <div style={{fontSize:9,color:"rgba(255,255,255,0.7)",fontWeight:700,marginBottom:2}}>💊 VOL. DA DROGA</div>
                <div style={{fontSize:30,fontWeight:900,lineHeight:1}}>{res.volDrug}</div>
                <div style={{fontSize:11,color:"rgba(255,255,255,0.8)"}}>mL</div>
              </div>
              <div style={{background:"rgba(255,255,255,0.15)",borderRadius:12,padding:"10px 12px",textAlign:"center"}}>
                <div style={{fontSize:9,color:"rgba(255,255,255,0.7)",fontWeight:700,marginBottom:2}}>💉 SF 0,9% p/ diluir</div>
                <div style={{fontSize:30,fontWeight:900,lineHeight:1}}>{res.volSF}</div>
                <div style={{fontSize:11,color:"rgba(255,255,255,0.8)"}}>mL</div>
              </div>
            </div>
          </div>

          {/* Volume total + BIC */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
            <div style={{background:"#1E40AF",borderRadius:13,padding:"11px 13px",textAlign:"center",color:"white"}}>
              <div style={{fontSize:9,color:"rgba(255,255,255,0.65)",fontWeight:700,marginBottom:2}}>🧪 VOLUME TOTAL</div>
              <div style={{fontSize:26,fontWeight:900}}>{res.volTotalN} <span style={{fontSize:12}}>mL</span></div>
              <div style={{fontSize:10,color:"rgba(255,255,255,0.7)"}}>Seringa completa</div>
            </div>
            <div style={{background:"linear-gradient(135deg,#16A34A,#22C55E)",borderRadius:13,padding:"11px 13px",textAlign:"center",color:"white"}}>
              <div style={{fontSize:9,color:"rgba(255,255,255,0.65)",fontWeight:700,marginBottom:2}}>⏱ BIC em mL/h</div>
              <div style={{fontSize:32,fontWeight:900,lineHeight:1}}>{res.bicMlH}</div>
              <div style={{fontSize:10,color:"rgba(255,255,255,0.8)"}}>para {res.volTotalN} mL/24h</div>
            </div>
          </div>

          {/* Receita completa */}
          <div style={{background:"white",borderRadius:13,border:"2px solid #E5E7EB",overflow:"hidden",marginBottom:12}}>
            <div style={{background:`linear-gradient(90deg,${droga.cor},${droga.cor}BB)`,padding:"7px 13px"}}>
              <div style={{color:"white",fontWeight:800,fontSize:12}}>📋 PRESCRIÇÃO — {res.droga.nome.toUpperCase()}</div>
            </div>
            <div style={{padding:"12px 14px"}}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:8}}>
                {[
                  {l:"Paciente",v:`${res.pesoN} kg`,cor:"#1D4ED8"},
                  {l:"Medicação",v:res.droga.nome,cor:droga.cor},
                  {l:"Concentração",v:res.droga.conc,cor:"#374151"},
                  {l:"Dose prescrita",v:`${res.doseN} ${droga.unidDose}`,cor:droga.cor},
                  {l:"Vol. droga (puro)",v:`${res.volDrug} mL`,cor:"#7C3AED"},
                  {l:"SF 0,9% diluente",v:`${res.volSF} mL`,cor:"#0369A1"},
                  {l:"Vol. total seringa",v:`${res.volTotalN} mL`,cor:"#374151"},
                  {l:"BIC velocidade",v:`${res.bicMlH} mL/h`,cor:"#16A34A"},
                ].map(r=>(
                  <div key={r.l} style={{background:"#F9FAFB",borderRadius:8,padding:"6px 9px"}}>
                    <div style={{fontSize:9,color:"#9CA3AF",fontWeight:700}}>{r.l}</div>
                    <div style={{fontSize:12,fontWeight:800,color:r.cor}}>{r.v}</div>
                  </div>
                ))}
              </div>
              <div style={{background:droga.bg,borderRadius:9,padding:"8px 10px",border:`1px solid ${droga.cor}20`}}>
                <div style={{fontSize:10,fontWeight:700,color:droga.cor,marginBottom:3}}>🏥 Via: {droga.via}</div>
                <div style={{fontSize:11,color:"#374151",lineHeight:1.6}}>{droga.obs}</div>
              </div>
            </div>
          </div>

          {/* Alternativa 48mL */}
          <div style={{background:"#F9FAFB",borderRadius:11,padding:"9px 13px",border:"1px solid #E5E7EB",marginBottom:12}}>
            <div style={{fontSize:10,fontWeight:700,color:"#9CA3AF",marginBottom:5}}>🔄 ALTERNATIVA — Seringa 48 mL (2 mL/h)</div>
            <div style={{display:"flex",gap:10,alignItems:"center"}}>
              <div style={{textAlign:"center",flex:1}}>
                <div style={{fontSize:9,color:"#6B7280"}}>Vol. droga × 2</div>
                <div style={{fontSize:16,fontWeight:800,color:droga.cor}}>{(res.volDrug*2).toFixed(2)} mL</div>
              </div>
              <div style={{color:"#9CA3AF",fontSize:16}}>+</div>
              <div style={{textAlign:"center",flex:1}}>
                <div style={{fontSize:9,color:"#6B7280"}}>SF 0,9%</div>
                <div style={{fontSize:16,fontWeight:800,color:"#0369A1"}}>{(48-res.volDrug*2).toFixed(2)} mL</div>
              </div>
              <div style={{color:"#9CA3AF",fontSize:16}}>=</div>
              <div style={{textAlign:"center",flex:1}}>
                <div style={{fontSize:9,color:"#6B7280"}}>BIC</div>
                <div style={{fontSize:16,fontWeight:800,color:"#16A34A"}}>2,0 mL/h</div>
              </div>
            </div>
          </div>

          {/* Tabela todas drogas para referência */}
          <div style={{background:"#F9FAFB",borderRadius:11,padding:"10px 12px",border:"1px solid #E5E7EB"}}>
            <div style={{fontSize:10,fontWeight:700,color:"#9CA3AF",marginBottom:7}}>📋 REFERÊNCIA — DROGAS DE INFUSÃO CONTÍNUA</div>
            <div style={{overflowX:"auto"}}>
              <table style={{borderCollapse:"collapse",width:"100%",fontSize:10}}>
                <thead><tr style={{background:"#F3F4F6"}}>
                  {["Droga","Conc.","Dose","Fórmula"].map(h=><th key={h} style={{padding:"5px 7px",textAlign:"left",fontWeight:700,color:"#6B7280",borderBottom:"1px solid #E5E7EB"}}>{h}</th>)}
                </tr></thead>
                <tbody>{DROGAS_DB.map((d,i)=>(
                  <tr key={d.id} style={{background:i%2===0?"white":"#FAFAFA"}}>
                    <td style={{padding:"5px 7px",borderBottom:"1px solid #F3F4F6"}}>
                      <span style={{fontWeight:700,color:d.cor}}>{d.emoji} {d.nome}</span>
                      <div style={{fontSize:9,color:"#9CA3AF"}}>{d.conc}</div>
                    </td>
                    <td style={{padding:"5px 7px",color:"#374151",borderBottom:"1px solid #F3F4F6",whiteSpace:"nowrap"}}>{d.doseMin}–{d.doseMax} {d.unidDose}</td>
                    <td style={{padding:"5px 7px",color:"#6B7280",borderBottom:"1px solid #F3F4F6",fontStyle:"italic",fontSize:9}}>{d.formula.toString().match(/formula:`([^`]+)`/)?.[1]||"—"}</td>
                  </tr>
                ))}</tbody>
              </table>
            </div>
          </div>
        </div>
      ))}
    </Modal>
  );
}

// ── SNAPPE II CALCULATOR ──────────────────────────────────────────────────────
// Ref: Richardson DK et al. J Pediatr 2001;138:92-100
// Variáveis colhidas nas primeiras 12h de admissão na UTI Neonatal

const SNAPPE_VARS = [

// Mortalidade hospitalar estimada (Richardson 2001, curva SNAPPE II)
function getMortalidade(escore){
  if(escore<=9)  return {pct:"<1%",  desc:"Risco muito baixo",    cor:"#16A34A", bg:"#DCFCE7"};
  if(escore<=19) return {pct:"~1–5%",desc:"Risco baixo",          cor:"#65A30D", bg:"#ECFCCB"};
  if(escore<=29) return {pct:"~5–15%",desc:"Risco moderado",      cor:"#D97706", bg:"#FEF9C3"};
  if(escore<=39) return {pct:"~15–30%",desc:"Risco alto",         cor:"#EA580C", bg:"#FFF7ED"};
  if(escore<=49) return {pct:"~30–50%",desc:"Risco muito alto",   cor:"#DC2626", bg:"#FEE2E2"};
  if(escore<=69) return {pct:"~50–70%",desc:"Risco crítico",      cor:"#991B1B", bg:"#FEE2E2"};
  return          {pct:">70%",          desc:"Risco extremamente alto",cor:"#7F1D1D",bg:"#FEE2E2"};
}

  const calcular=()=>{
    const nPreench=Object.keys(sels).length;
    if(nPreench<SNAPPE_VARS.length){
      setRes({aviso:`Preencha todos os ${SNAPPE_VARS.length} campos para o SNAPPE II completo. (${nPreench}/${SNAPPE_VARS.length} preenchidos)`});
    }
    const snapII=["pam","temp","po2fio2","ph","conv","diurese"].reduce((acc,id)=>acc+(sels[id]||0),0);
    const perinatal=["apgar","peso","pig"].reduce((acc,id)=>acc+(sels[id]||0),0);
    const snappeII=snapII+perinatal;
    const mort=getMortalidade(snappeII);

  return (

function getInterpNIPS(score, intubado){
  const s = intubado ? score : score; // mesmo score, só choro muda
  if(s === 0)        return {nivel:"Sem dor",          cor:"#16A34A", bg:"#DCFCE7", emoji:"✅", conduta:"Nenhuma intervenção necessária. Manter conforto e monitoramento."};
  if(s <= 2)         return {nivel:"Dor leve",         cor:"#65A30D", bg:"#ECFCCB", emoji:"💚", conduta:"Medidas não farmacológicas: sucção não nutritiva, sacarose 25% 0,5mL VO 2min antes do procedimento, posicionamento canguru, contenção, enrolamento."};
  if(s <= 3)         return {nivel:"Dor moderada",     cor:"#D97706", bg:"#FEF9C3", emoji:"⚠️", conduta:"Associar medidas não farmacológicas + avaliar analgesia farmacológica. Dipirona 10–15mg/kg/dose EV ou VO. Paracetamol 15mg/kg/dose VO. Reavaliar em 30min."};
  if(s <= 5)         return {nivel:"Dor intensa",      cor:"#EA580C", bg:"#FFF7ED", emoji:"🔴", conduta:"Analgesia farmacológica indicada. Morfina 0,05–0,1mg/kg/dose EV lento. Fentanil 1–2mcg/kg/dose EV. Se VM: considerar infusão contínua. NIPS >3 = transportar com analgesia."};
  return              {nivel:"Dor muito intensa",      cor:"#DC2626", bg:"#FEE2E2", emoji:"🚨", conduta:"Dor intratável. Avaliar causa. Opioides IV contínuos. Sedação se agitação grave. Se recebendo opioides → transportar intubado. Reavaliar a cada 30–60min."};
}

function NIPSCalc({onClose}){
  const [sels,setSels]=useState({});
  const [intubado,setIntubado]=useState(false);
  const [res,setRes]=useState(null);
  const setSel=(id,pts)=>{setSels(s=>({...s,[id]:pts}));setRes(null);};

  // Score com regra de intubado: face×2, sem choro
  const calcScore=()=>{
    let score=0;
    NIPS_VARS.forEach(v=>{
      if(sels[v.id]===undefined) return;
      if(intubado && v.id==="choro") return; // intubado: não pontua choro
      let pts=sels[v.id];
      if(intubado && v.id==="face") pts=pts*2; // dobra face
      score+=pts;
    });
    return score;
  };

  const preenchidos=NIPS_VARS.filter(v=>{
    if(intubado&&v.id==="choro") return true; // skip choro se intubado
    return sels[v.id]!==undefined;
  }).length;
  const total=intubado?NIPS_VARS.length-1:NIPS_VARS.length; // choro não conta se intubado

  const calcular=()=>{
    const varsFaltando=NIPS_VARS.filter(v=>{
      if(intubado&&v.id==="choro") return false;
      return sels[v.id]===undefined;
    });
    if(varsFaltando.length>0){
      setRes({aviso:`Preencha todos os campos. Faltam: ${varsFaltando.map(v=>v.label).join(", ")}`});return;
    }
    const score=calcScore();
    const interp=getInterpNIPS(score,intubado);
    // Detalhes
    const detalhes=NIPS_VARS.map(v=>{
      const skip=intubado&&v.id==="choro";
      const pts=skip?null:sels[v.id];
      const ptsEfetivo=skip?0:(intubado&&v.id==="face"&&pts!==undefined?pts*2:pts);
      return {
        ...v,
        skip,
        pts: pts===undefined?null:pts,
        ptsEfetivo: ptsEfetivo===undefined?null:ptsEfetivo,
        opcaoSel: pts!==undefined?v.opcoes.find(o=>o.pts===pts):null
      };
    });
    setRes({score,interp,detalhes,intubado});
  };

  const limpar=()=>{setSels({});setRes(null);};

  // score em tempo real
  const liveScore=Object.values(sels).length>0?calcScore():null;

  return (

                  </div>

                  {d.skip&&<span style={{padding:"3px 9px",borderRadius:7,background:"#9CA3AF",color:"white",fontSize:10,fontWeight:700}}>—</span>}

            {/* Conduta */}
            <div style={{background:"linear-gradient(135deg,#7F1D1D,#991B1B)",borderRadius:14,padding:"13px 15px",marginBottom:12,color:"white"}}>

            {res.score>3&&<div style={{background:"#FEF2F2",borderRadius:11,padding:"9px 13px",marginBottom:12,border:"2px solid #EF4444"}}>
              <div style={{fontSize:12,fontWeight:800,color:"#DC2626",marginBottom:3}}>🚑 ALERTA DE TRANSPORTE</div>

                NIPS {">"} 3 → <b>transportar com analgesia adequada</b><br/>
                {res.intubado?"RN intubado → manter VM durante transporte.":"Se RN recebendo opioides → <b>transportar intubado</b>."}
              </div>

            {/* Medidas não farmacológicas */}
            <div style={{background:"#F0FDF4",borderRadius:11,padding:"9px 13px",border:"1px solid #86EFAC"}}>

                  <div key={t} style={{background:"white",borderRadius:8,padding:"6px 8px",display:"flex",gap:6,alignItems:"flex-start",border:"1px solid #DCFCE7"}}>

                  </div>
                ))}
              </div>
            </div>
          </>}
        </div>
      )}
    </Modal>
  );
}

// ── ESCORE TRANSFUSIONAL CALCULATOR ──────────────────────────────────────────
// Tabela 33.3 — Indicação de Transfusão Sanguínea (Hemácias)
// Critérios baseados em assistência respiratória, tempo de vida, FiO2/MAP e Hb/Ht

function avaliarTransfusao(assist, diasVida, fio2, map, hb, ht){
  const diasN = parseFloat(diasVida);
  const fio2N = parseFloat(fio2);
  const mapN  = parseFloat(map);
  const hbN   = parseFloat(hb);
  const htN   = parseFloat(ht);

  let indicado = false, motivo = "", nivel = "", cor = "", bg = "", emoji = "";
  let limHb = null, limHt = null, conduta = "", obs = "";

  if(assist === "vm"){
    if(diasN < 28){
      if(fio2N >= 0.30){
        limHb = 12; limHt = 40;
        if((!isNaN(hbN)&&hbN<12)||(!isNaN(htN)&&htN<40)){ indicado=true; motivo="VM < 28 dias + FiO₂ ≥ 0,30"; }
      } else {
        limHb = 11; limHt = 35;
        if((!isNaN(hbN)&&hbN<11)||(!isNaN(htN)&&htN<35)){ indicado=true; motivo="VM < 28 dias + FiO₂ < 0,30"; }
      }
    } else {
      // ≥ 28 dias — VAFO MAP > 14 ou ≤ 14
      if(mapN > 14 || fio2N > 0.40){
        limHb = 10; limHt = 30;
        if((!isNaN(hbN)&&hbN<10)||(!isNaN(htN)&&htN<30)){ indicado=true; motivo="VM ≥ 28 dias + FiO₂ > 0,40 ou MAP > 14"; obs="*VAFO com MAP > 14 cmH₂O"; }
      } else {
        limHb = 8; limHt = 25;
        if((!isNaN(hbN)&&hbN<=8)||(!isNaN(htN)&&htN<25)){ indicado=true; motivo="VM ≥ 28 dias + FiO₂ < 0,40 e MAP ≤ 14"; obs="**VAFO com MAP ≤ 14 cmH₂O"; }
      }
    }
  } else if(assist === "cpap"){
    if(diasN <= 1){
      limHb = 12; limHt = 40;
      if((!isNaN(hbN)&&hbN<12)||(!isNaN(htN)&&htN<40)){ indicado=true; motivo="CPAP ≤ 24h de vida"; }
    } else if(diasN < 28){
      limHb = 10; limHt = 30;
      if((!isNaN(hbN)&&hbN<10)||(!isNaN(htN)&&htN<30)){ indicado=true; motivo="CPAP 1–28 dias de vida"; }
    } else {
      limHb = 8.5; limHt = 25;
      if((!isNaN(hbN)&&hbN<8.5)||(!isNaN(htN)&&htN<25)){ indicado=true; motivo="CPAP ≥ 28 dias de vida"; }
    }
  } else { // espontânea
    if(fio2N >= 0.21){
      limHb = 8.5; limHt = 25;
      if((!isNaN(hbN)&&hbN<8.5)||(!isNaN(htN)&&htN<25)){ indicado=true; motivo="Resp. Espontânea + FiO₂ ≥ 0,21"; obs="*Associado a sintomas clínicos (ver abaixo)"; }
    } else {
      // ar ambiente
      limHb = 7; limHt = 20;
      if((!isNaN(hbN)&&hbN<7)||(!isNaN(htN)&&htN<20)){ indicado=true; motivo="Resp. Espontânea em ar ambiente"; obs="*Associado a sintomas clínicos"; }
    }
  }

  if(indicado){
    const gravHb = !isNaN(hbN)?(hbN<(limHb-4)?"grave":hbN<(limHb-2)?"moderada":"leve"):null;
    nivel = gravHb==="grave"?"Anemia grave — Transfusão urgente":gravHb==="moderada"?"Anemia moderada — Transfusão indicada":"Anemia leve — Transfusão indicada";
    cor="#DC2626"; bg="#FEE2E2"; emoji="🩸";
    conduta=`TRANSFUSÃO INDICADA\n• Volume: 10–15 mL/kg de concentrado de hemácias (CH)\n• Tempo de infusão: 3–4 horas\n• Filtrado, irradiado e CMV negativo para RNPT\n• Reavaliação pós-transfusional em 4–6h\n• Solicitar: tipagem e XPROVA, CH irradiado/filtrado\n• Motivo: ${motivo}`;
  } else {
    nivel = "Transfusão NÃO indicada pelos critérios atuais";
    cor="#16A34A"; bg="#DCFCE7"; emoji="✅";
    conduta=`Hb/Ht acima dos limiares de transfusão para o perfil atual.\n• Limiar Hb: ${limHb} g/dL · Limiar Ht: ${limHt}%\n• Manter monitoramento clínico e laboratorial\n• Reavaliação se deterioração clínica`;
  }

  return {indicado, nivel, motivo, cor, bg, emoji, conduta, limHb, limHt, obs};
}

function TransfusaoCalc({onClose}){
  const [assist, setAssist]   = useState("");   // vm | cpap | espontanea
  const [diasVida, setDiasVida] = useState("");
  const [fio2, setFio2]       = useState("");
  const [map, setMap]         = useState("");
  const [hb, setHb]           = useState("");
  const [ht, setHt]           = useState("");
  const [peso, setPeso]       = useState("");
  const [res, setRes]         = useState(null);

  // Sintomas clínicos (para resp. espontânea)
  const [sintomas, setSintomas] = useState({apneia:false,taqu:false,ganho:false,cirurgia:false,acidose:false});
  const toggleS = k => setSintomas(s=>({...s,[k]:!s[k]}));
  const nSintomas = Object.values(sintomas).filter(Boolean).length;

  const calcular = () => {
    if(!assist){setRes({erro:"Selecione a assistência respiratória."});return;}
    if(!hb&&!ht){setRes({erro:"Informe pelo menos Hb (g/dL) ou Ht (%)."});return;}
    const diasN=parseFloat(diasVida)||0;
    const fio2N=parseFloat(fio2)||0;
    const mapN=parseFloat(map)||0;
    const hbN=parseFloat(hb);
    const htN=parseFloat(ht);
    const pesoN=parseFloat(peso);

    const r = avaliarTransfusao(assist, diasN, fio2N, mapN, hbN, htN);

    // Volume de CH
    let volCH="", volCH15="";
    if(!isNaN(pesoN)&&pesoN>0){
      volCH  = (10*pesoN).toFixed(1);
      volCH15 = (15*pesoN).toFixed(1);
    }

    // Déficit de Hb (se hb informada)
    let defHb="";
    if(!isNaN(hbN)&&r.limHb&&hbN<r.limHb){
      defHb = (r.limHb - hbN).toFixed(1);
    }

    // Sintomas para resp espontânea
    const sintomasPresentes = assist==="espontanea" && nSintomas > 0;

    setRes({...r, volCH, volCH15, defHb, hbN, htN, pesoN, fio2N, mapN, diasN, sintomasPresentes, nSintomas, assist});
  };

  const limpar=()=>{setAssist("");setDiasVida("");setFio2("");setMap("");setHb("");setHt("");setPeso("");setSintomas({apneia:false,taqu:false,ganho:false,cirurgia:false,acidose:false});setRes(null);};

  const inpS={width:"100%",padding:"9px 11px",borderRadius:9,border:"1.5px solid #E5E7EB",fontSize:14,color:"#111827",outline:"none",background:"#FAFAFA",fontFamily:"inherit",boxSizing:"border-box",textAlign:"center",fontWeight:700};
  const lbS={fontSize:10,fontWeight:700,color:"#374151",display:"block",marginBottom:3,textAlign:"center"};

  return (
    <Modal title="🩸 Escore Transfusional — Indicação de Transfusão" onClose={onClose}>
      {/* Header */}
      <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:14,padding:"9px 13px",background:"linear-gradient(135deg,#FDF2F8,#FCE7F3)",borderRadius:11,border:"1px solid #EC489920"}}>
        <div style={{width:42,height:42,borderRadius:11,background:"linear-gradient(135deg,#F472B6,#EC4899)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0,boxShadow:"0 3px 10px rgba(236,72,153,0.3)"}}>🩸</div>
        <div>
          <div style={{fontSize:13,fontWeight:800,color:"#831843"}}>Indicação de Transfusão de Hemácias</div>
          <div style={{fontSize:10,color:"#9D174D",marginTop:1}}>Tabela 33.3 · VM · CPAP · Respiração Espontânea</div>
        </div>
      </div>

      {/* Assistência respiratória */}
      <div style={{marginBottom:12}}>
        <label style={{fontSize:11,fontWeight:700,color:"#374151",display:"block",marginBottom:6}}>1. Assistência Respiratória</label>
        <div style={{display:"flex",flexDirection:"column",gap:5}}>
          {[
            ["vm","🫁 Ventilação Mecânica (VM)","Inclui VAFO"],
            ["cpap","😮‍💨 CPAP Nasal","CPAP ou O₂ de alto fluxo"],
            ["espontanea","🌬️ Respiração Espontânea","Ar ambiente ou FiO₂ suplementar"],
          ].map(([v,l,sub])=>(
            <button key={v} onClick={()=>{setAssist(v);setRes(null);}}
              style={{padding:"9px 12px",borderRadius:10,border:`1.5px solid ${assist===v?"#EC4899":"#E5E7EB"}`,background:assist===v?"#FDF2F8":"white",display:"flex",alignItems:"center",gap:10,transition:"all 0.15s",textAlign:"left"}}>
              <div style={{width:16,height:16,borderRadius:"50%",border:`2px solid ${assist===v?"#EC4899":"#D1D5DB"}`,background:assist===v?"#EC4899":"white",flexShrink:0}}/>
              <div><div style={{fontSize:12,fontWeight:700,color:assist===v?"#BE185D":"#374151"}}>{l}</div><div style={{fontSize:10,color:"#9CA3AF"}}>{sub}</div></div>
            </button>
          ))}
        </div>
      </div>

      {/* Dias de vida */}
      <div style={{marginBottom:10}}>
        <label style={lbS}>2. Dias de vida</label>
        <input style={inpS} type="number" step="1" min="0" value={diasVida} onChange={e=>setDiasVida(e.target.value)} placeholder="Ex: 5"/>
      </div>

      {/* FiO2 + MAP — só se VM ou espontânea */}
      {(assist==="vm"||assist==="espontanea")&&(
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
          <div>
            <label style={lbS}>FiO₂ <span style={{color:"#9CA3AF",fontWeight:400}}>(fração 0–1)</span></label>
            <input style={{...inpS,color:"#7C3AED"}} type="number" step="0.01" min="0.21" max="1" value={fio2} onChange={e=>setFio2(e.target.value)} placeholder="Ex: 0.35"/>
            <div style={{fontSize:9,color:"#9CA3AF",textAlign:"center",marginTop:2}}>0,21 = ar ambiente</div>
          </div>
          {assist==="vm"&&<div>
            <label style={lbS}>MAP <span style={{color:"#9CA3AF",fontWeight:400}}>(cmH₂O)</span></label>
            <input style={{...inpS,color:"#0369A1"}} type="number" step="0.5" min="0" value={map} onChange={e=>setMap(e.target.value)} placeholder="Ex: 12"/>
            <div style={{fontSize:9,color:"#9CA3AF",textAlign:"center",marginTop:2}}>Pressão média via aérea</div>
          </div>}
        </div>
      )}

      {/* Hb + Ht + Peso */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:10}}>
        <div>
          <label style={lbS}>Hb <span style={{color:"#9CA3AF",fontWeight:400}}>(g/dL)</span></label>
          <input style={{...inpS,color:"#DC2626",fontSize:16}} type="number" step="0.1" value={hb} onChange={e=>setHb(e.target.value)} placeholder="Ex: 9.5"/>
        </div>
        <div>
          <label style={lbS}>Ht <span style={{color:"#9CA3AF",fontWeight:400}}>(%) — opcional</span></label>
          <input style={{...inpS,color:"#EA580C"}} type="number" step="0.5" value={ht} onChange={e=>setHt(e.target.value)} placeholder="Ex: 28"/>
        </div>
        <div>
          <label style={lbS}>Peso <span style={{color:"#9CA3AF",fontWeight:400}}>(kg)</span></label>
          <input style={{...inpS,color:"#0369A1"}} type="number" step="0.01" value={peso} onChange={e=>setPeso(e.target.value)} placeholder="Ex: 1.2"/>
        </div>
      </div>

      {/* Sintomas clínicos — apenas para espontânea */}
      {assist==="espontanea"&&(
        <div style={{background:"#FDF2F8",borderRadius:11,padding:"10px 12px",marginBottom:12,border:"1.5px solid #F9A8D4"}}>
          <div style={{fontSize:11,fontWeight:700,color:"#BE185D",marginBottom:8}}>🔴 Sintomas Clínicos Associados <span style={{fontWeight:500,color:"#9CA3AF"}}>(marque os presentes)</span></div>
          {[
            ["apneia","😮‍💨","Apneia ou bradicardia significativa","≥6 episódios/12h ou 2/24h com VPP, sob metilxantina"],
            ["taqu","💓","Taquicardia ou taquipneia significativa","FC >180 bpm em 24h ou FR >80 ipm em 24h"],
            ["ganho","⚖️","Ganho de peso inadequado","<10 g/dia por >4 dias com oferta ≥100 kcal/kg/dia"],
            ["cirurgia","🔪","Intervenção cirúrgica","Procedimento cirúrgico planejado ou recente"],
            ["acidose","⚗️","Acidose metabólica","pH <7,2 ou Lactato ≥2,5 mEq/L"],
          ].map(([k,e,l,d])=>(
            <button key={k} onClick={()=>toggleS(k)}
              style={{width:"100%",marginBottom:5,padding:"7px 10px",borderRadius:9,border:`1.5px solid ${sintomas[k]?"#EC4899":"#E5E7EB"}`,background:sintomas[k]?"#FCE7F3":"white",display:"flex",alignItems:"center",gap:8,transition:"all 0.15s",textAlign:"left"}}>
              <div style={{width:18,height:18,borderRadius:4,border:`2px solid ${sintomas[k]?"#EC4899":"#D1D5DB"}`,background:sintomas[k]?"#EC4899":"white",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                {sintomas[k]&&<span style={{color:"white",fontSize:11,fontWeight:900}}>✓</span>}
              </div>
              <span style={{fontSize:15,flexShrink:0}}>{e}</span>
              <div><div style={{fontSize:11,fontWeight:600,color:sintomas[k]?"#BE185D":"#374151"}}>{l}</div><div style={{fontSize:9,color:"#9CA3AF",lineHeight:1.3}}>{d}</div></div>
            </button>
          ))}
          {nSintomas>0&&<div style={{marginTop:6,padding:"5px 9px",borderRadius:7,background:"#FCE7F3",border:"1px solid #F9A8D4",fontSize:11,fontWeight:700,color:"#BE185D"}}>✓ {nSintomas} sintoma{nSintomas>1?"s":""} selecionado{nSintomas>1?"s":""}</div>}
        </div>
      )}

      <div style={{display:"flex",gap:8,marginBottom:14}}>
        <button onClick={limpar} style={{flex:1,padding:"10px",borderRadius:10,border:"1.5px solid #E5E7EB",background:"white",color:"#374151",fontWeight:700,fontSize:13}}>🔄 Limpar</button>
        <button onClick={calcular} style={{flex:2,padding:"11px",borderRadius:10,border:"none",background:"linear-gradient(90deg,#EC4899,#F472B6)",color:"white",fontWeight:800,fontSize:14,boxShadow:"0 4px 14px rgba(236,72,153,0.4)"}}>⚡ Avaliar Indicação</button>
      </div>

      {res&&(res.erro?(
        <div style={{background:"#FEE2E2",borderRadius:12,padding:14,color:"#DC2626",fontWeight:600,fontSize:13}}>⚠️ {res.erro}</div>
      ):(
        <div style={{animation:"fadeIn 0.3s ease"}}>

          {/* Badge principal */}
          <div style={{background:res.bg,borderRadius:16,padding:"14px 16px",marginBottom:12,border:`2px solid ${res.cor}40`,textAlign:"center"}}>
            <div style={{fontSize:36,marginBottom:6}}>{res.emoji}</div>
            <div style={{display:"inline-block",padding:"5px 20px",borderRadius:20,background:res.cor,color:"white",fontWeight:900,fontSize:13,marginBottom:8,letterSpacing:0.5}}>
              {res.indicado?"TRANSFUSÃO INDICADA":"NÃO INDICADO"}
            </div>
            <div style={{fontSize:12,fontWeight:700,color:res.cor,lineHeight:1.5}}>{res.nivel}</div>
            {res.motivo&&<div style={{fontSize:11,color:res.cor+"99",marginTop:4}}>{res.motivo}</div>}
          </div>

          {/* Alerta sintomas (espontânea) */}
          {res.assist==="espontanea"&&res.indicado&&!res.sintomasPresentes&&(
            <div style={{background:"#FEF9C3",borderRadius:11,padding:"9px 13px",marginBottom:12,border:"1.5px solid #F59E0B"}}>
              <div style={{fontSize:12,fontWeight:800,color:"#92400E",marginBottom:3}}>⚠️ Atenção — Sintomas Clínicos</div>
              <div style={{fontSize:11,color:"#92400E",lineHeight:1.6}}>Para respiração espontânea, a transfusão deve estar associada a <b>1 ou mais sintomas clínicos</b>. Verifique se algum está presente.</div>
            </div>
          )}
          {res.assist==="espontanea"&&res.indicado&&res.sintomasPresentes&&(
            <div style={{background:"#FEE2E2",borderRadius:11,padding:"8px 12px",marginBottom:12,border:"1px solid #FCA5A5"}}>
              <div style={{fontSize:11,fontWeight:700,color:"#DC2626"}}>✓ {res.nSintomas} sintoma{res.nSintomas>1?"s":""} clínico{res.nSintomas>1?"s":""} confirmado{res.nSintomas>1?"s":""} — Indicação reforçada</div>
            </div>
          )}

          {/* Limiares */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
            <div style={{background:"#FEF2F2",borderRadius:12,padding:"10px 12px",textAlign:"center",border:"1.5px solid #FECACA"}}>
              <div style={{fontSize:10,fontWeight:700,color:"#9CA3AF",marginBottom:3}}>LIMIAR Hb</div>
              <div style={{fontSize:22,fontWeight:900,color:"#DC2626"}}>{res.limHb} <span style={{fontSize:12}}>g/dL</span></div>
              {!isNaN(res.hbN)&&<div style={{fontSize:11,marginTop:3,fontWeight:700,color:res.hbN<res.limHb?"#DC2626":"#16A34A"}}>Atual: {res.hbN} g/dL {res.hbN<res.limHb?"↓ ABAIXO":"✓ OK"}</div>}
              {res.defHb&&<div style={{fontSize:10,color:"#DC2626",marginTop:2}}>Déficit: {res.defHb} g/dL</div>}
            </div>
            <div style={{background:"#FFF7ED",borderRadius:12,padding:"10px 12px",textAlign:"center",border:"1.5px solid #FED7AA"}}>
              <div style={{fontSize:10,fontWeight:700,color:"#9CA3AF",marginBottom:3}}>LIMIAR Ht</div>
              <div style={{fontSize:22,fontWeight:900,color:"#EA580C"}}>{res.limHt} <span style={{fontSize:12}}>%</span></div>
              {!isNaN(res.htN)&&<div style={{fontSize:11,marginTop:3,fontWeight:700,color:res.htN<res.limHt?"#EA580C":"#16A34A"}}>Atual: {res.htN}% {res.htN<res.limHt?"↓ ABAIXO":"✓ OK"}</div>}
            </div>
          </div>

          {/* Volume CH */}
          {res.volCH&&<div style={{background:"linear-gradient(135deg,#831843,#BE185D)",borderRadius:13,padding:"11px 14px",marginBottom:12,color:"white"}}>
            <div style={{fontSize:10,color:"rgba(255,255,255,0.7)",fontWeight:700,marginBottom:6}}>🩸 VOLUME DE CONCENTRADO DE HEMÁCIAS (CH)</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,textAlign:"center"}}>
              <div style={{background:"rgba(255,255,255,0.15)",borderRadius:10,padding:"9px"}}>
                <div style={{fontSize:10,color:"rgba(255,255,255,0.7)"}}>10 mL/kg</div>
                <div style={{fontSize:26,fontWeight:900,lineHeight:1}}>{res.volCH}</div>
                <div style={{fontSize:11,color:"rgba(255,255,255,0.8)"}}>mL</div>
              </div>
              <div style={{background:"rgba(255,255,255,0.15)",borderRadius:10,padding:"9px"}}>
                <div style={{fontSize:10,color:"rgba(255,255,255,0.7)"}}>15 mL/kg</div>
                <div style={{fontSize:26,fontWeight:900,lineHeight:1}}>{res.volCH15}</div>
                <div style={{fontSize:11,color:"rgba(255,255,255,0.8)"}}>mL</div>
              </div>
            </div>
            <div style={{marginTop:8,fontSize:11,color:"rgba(255,255,255,0.8)",textAlign:"center"}}>Infusão em 3–4h · CH filtrado, irradiado e CMV negativo</div>
          </div>}

          {/* Conduta */}
          <div style={{background:"linear-gradient(135deg,#1E1B4B,#312E81)",borderRadius:14,padding:"13px 15px",marginBottom:12,color:"white"}}>
            <div style={{fontSize:10,color:"rgba(255,255,255,0.65)",fontWeight:700,marginBottom:6}}>💊 CONDUTA</div>
            <div style={{fontSize:12,lineHeight:1.8,color:"rgba(255,255,255,0.93)",whiteSpace:"pre-line"}}>{res.conduta}</div>
          </div>
          {res.obs&&<div style={{background:"#FFFBEB",borderRadius:10,padding:"7px 12px",marginBottom:12,border:"1px solid #FDE68A",fontSize:11,color:"#92400E",fontWeight:600}}>{res.obs}</div>}

          {/* Tabela completa de referência */}
          <div style={{background:"#F9FAFB",borderRadius:12,padding:"10px 13px",border:"1px solid #E5E7EB"}}>
            <div style={{fontSize:10,fontWeight:700,color:"#9CA3AF",marginBottom:8}}>📋 TABELA 33.3 — REFERÊNCIA COMPLETA</div>
            <div style={{overflowX:"auto"}}>
              <table style={{borderCollapse:"collapse",width:"100%",fontSize:10}}>
                <thead><tr style={{background:"linear-gradient(90deg,#EC4899,#F472B6)"}}>
                  {["Assistência","Tempo de vida","FiO₂/MAP","Hb / Ht"].map(h=><th key={h} style={{padding:"6px 8px",color:"white",fontWeight:700,textAlign:"left",whiteSpace:"nowrap"}}>{h}</th>)}
                </tr></thead>
                <tbody>
                  {[
                    ["VM","< 28 dias","FiO₂ ≥ 0,30","Hb < 12 g/dL / Ht < 40%"],
                    ["VM","< 28 dias","FiO₂ < 0,30","Hb < 11 g/dL / Ht < 35%"],
                    ["VM","≥ 28 dias","FiO₂ > 0,40 ou MAP > 14","Hb < 10 g/dL / Ht < 30%*"],
                    ["VM","≥ 28 dias","FiO₂ < 0,40 e MAP ≤ 14","Hb ≤ 8 g/dL / Ht < 25%**"],
                    ["CPAP","≤ 24h de vida","—","Hb < 12 g/dL / Ht < 40%"],
                    ["CPAP","1–28 dias","—","Hb < 10 g/dL / Ht < 30%"],
                    ["CPAP","≥ 28 dias","—","Hb < 8,5 g/dL / Ht < 25%"],
                    ["Resp. Espontânea","—","FiO₂ ≥ 0,21","Hb < 8,5 g/dL / Ht < 25%*"],
                    ["Resp. Espontânea","—","Ar ambiente","Hb < 7 g/dL / Ht < 20%*"],
                  ].map((row,i)=>(
                    <tr key={i} style={{background:i%2===0?"white":"#FDF2F8"}}>
                      {row.map((cell,j)=><td key={j} style={{padding:"5px 7px",borderBottom:"1px solid #F3F4F6",color:"#374151",fontWeight:j===3?700:400}}>{cell}</td>)}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div style={{marginTop:8,fontSize:9.5,color:"#9CA3AF",lineHeight:1.6}}>
              * VAFO com MAP {">"} 14 cmH₂O · ** VAFO com MAP ≤ 14 cmH₂O<br/>
              * Resp. espontânea: associado a ≥1 sintoma clínico (apneia/bradicardia, taquicardia/taquipneia, ganho inadequado, cirurgia ou acidose metabólica)
            </div>
          </div>
        </div>
      ))}
    </Modal>
  );
}

// ── SECTION GRID ──────────────────────────────────────────────────────────────
function SectionGrid({items,isGestor,onEdit,onDelete,onAdd,cols=3}){
  const [detail,setDetail]=useState(null);
  const [rodwellItem,setRodwellItem]=useState(null);
  const [bilirubinOpen,setBilirubinOpen]=useState(false);
  const [oiOpen,setOiOpen]=useState(false);
  const [gasoOpen,setGasoOpen]=useState(false);
  const [tfgOpen,setTfgOpen]=useState(false);
  const [venocliseOpen,setVenocliseOpen]=useState(false);
  const [drogasOpen,setDrogasOpen]=useState(false);
  const [snappeOpen,setSnappeOpen]=useState(false);
  const [nipsOpen,setNipsOpen]=useState(false);
  const [transfOpen,setTransfOpen]=useState(false);
  const visible=isGestor?items:items.filter(i=>i.active!==false);
  const handleClick=(item)=>{
    const t=(item.title||"").toLowerCase();
    if(t.includes("rodwell")) setRodwellItem(item);
    else if(t.includes("hiperbilirrubin")) setBilirubinOpen(true);
    else if(t.includes("oxygenation")||t.includes("oxigenação")||t.includes("oi)")) setOiOpen(true);
    else if(t.includes("gasometria")||t.includes("gasometry")) setGasoOpen(true);
    else if(t.includes("tfg")||t.includes("filtração")||t.includes("glomerular")) setTfgOpen(true);
    else if(t.includes("hidrat")||t.includes("venosa")||t.includes("venócl")||t.includes("venoclise")) setVenocliseOpen(true);
    else if(t.includes("droga")||t.includes("infusão")||t.includes("contínua")||t.includes("bic")||t.includes("vasoativ")) setDrogasOpen(true);
    else if(t.includes("snappe")) setSnappeOpen(true);
    else if(t.includes("dor")||t.includes("nips")||t.includes("pipp")||t.includes("n-pass")) setNipsOpen(true);
    else if(t.includes("transfus")) setTransfOpen(true);
    else setDetail(item);
  };
  return (
    <div>
      <div style={{display:"grid",gridTemplateColumns:`repeat(${cols},1fr)`,gap:9}}>
        {visible.map(item=>(
          <div key={item.id} style={{background:item.bg,borderRadius:13,padding:"11px 9px",cursor:"pointer",textAlign:"center",border:`1.5px solid ${item.color}22`,transition:"transform 0.18s,box-shadow 0.18s",position:"relative",opacity:item.active===false?0.55:1}}
            onMouseEnter={e=>{e.currentTarget.style.transform="scale(1.04)";e.currentTarget.style.boxShadow="0 6px 20px rgba(0,0,0,0.1)";}}
            onMouseLeave={e=>{e.currentTarget.style.transform="";e.currentTarget.style.boxShadow="";}}
            onClick={()=>handleClick(item)}>
            {isGestor&&<div style={{position:"absolute",top:5,right:5,display:"flex",gap:2}} onClick={e=>e.stopPropagation()}>
              <button onClick={()=>onEdit(item)} style={{width:21,height:21,borderRadius:5,border:"none",background:"rgba(79,110,247,0.15)",color:"#4F6EF7",fontSize:10}}>✏</button>
              <button onClick={()=>onDelete(item.id)} style={{width:21,height:21,borderRadius:5,border:"none",background:"rgba(239,68,68,0.15)",color:"#EF4444",fontSize:10}}>✕</button>
            </div>}
            {item.active===false&&isGestor&&<span style={{position:"absolute",top:5,left:5,background:"#FEE2E2",color:"#DC2626",fontSize:8,fontWeight:700,borderRadius:4,padding:"2px 4px"}}>OFF</span>}
            <div style={{fontSize:26,marginBottom:4}}>{item.icon}</div>
            <div style={{fontSize:11,fontWeight:700,color:item.color,lineHeight:1.2,marginBottom:2}}>{item.title}</div>
            <div style={{fontSize:9.5,color:"#6B7280",lineHeight:1.3}}>{item.sub}</div>
          </div>
        ))}
        {isGestor&&<div onClick={onAdd} style={{background:"white",borderRadius:13,padding:"11px 9px",cursor:"pointer",textAlign:"center",border:"2px dashed #D1D5DB",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:5,minHeight:95,transition:"border-color 0.2s"}}
          onMouseEnter={e=>e.currentTarget.style.borderColor="#4F6EF7"}
          onMouseLeave={e=>e.currentTarget.style.borderColor="#D1D5DB"}>
          <span style={{fontSize:22,color:"#9CA3AF"}}>＋</span>
          <span style={{fontSize:10,color:"#9CA3AF",fontWeight:700}}>Adicionar</span>
        </div>}
      </div>
      {detail&&<Modal title={detail.title} onClose={()=>setDetail(null)}>
        <div style={{display:"flex",gap:12,alignItems:"center",marginBottom:14}}>
          <div style={{width:50,height:50,borderRadius:14,background:detail.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,border:`2px solid ${detail.color}22`,flexShrink:0}}>{detail.icon}</div>
          <div><div style={{fontSize:15,fontWeight:800,color:detail.color}}>{detail.title}</div><div style={{fontSize:12,color:"#6B7280"}}>{detail.sub}</div></div>
        </div>
        <div style={{background:"#F9FAFB",borderRadius:12,padding:14,fontSize:13,color:"#374151",lineHeight:1.8,whiteSpace:"pre-wrap",maxHeight:320,overflowY:"auto"}}>{detail.content||"Sem conteúdo adicional."}</div>
      </Modal>}
      {rodwellItem&&<RodwellCalc item={rodwellItem} onClose={()=>setRodwellItem(null)}/>}
      {bilirubinOpen&&<BilirubinCalc onClose={()=>setBilirubinOpen(false)}/>}
      {oiOpen&&<OICalc onClose={()=>setOiOpen(false)}/>}
      {gasoOpen&&<GasometriaCalc onClose={()=>setGasoOpen(false)}/>}
      {tfgOpen&&<TFGCalc onClose={()=>setTfgOpen(false)}/>}
      {venocliseOpen&&<VenocliseCalc onClose={()=>setVenocliseOpen(false)}/>}
      {drogasOpen&&<DrogasCalc onClose={()=>setDrogasOpen(false)}/>}
      {snappeOpen&&<SNAPPECalc onClose={()=>setSnappeOpen(false)}/>}
      {nipsOpen&&<NIPSCalc onClose={()=>setNipsOpen(false)}/>}
      {transfOpen&&<TransfusaoCalc onClose={()=>setTransfOpen(false)}/>}
    </div>
  );
}

// ── TABLES SECTION ────────────────────────────────────────────────────────────
function TablesSection({tables,isGestor,onUpdate}){
  const [editing,setEditing]=useState(null);
  const [showNew,setShowNew]=useState(false);
  const [open,setOpen]=useState(null);
  const save=t=>{const u=tables.find(x=>x.id===t.id)?tables.map(x=>x.id===t.id?t:x):[...tables,t];onUpdate(u);setEditing(null);setShowNew(false);};
  const del=id=>onUpdate(tables.filter(t=>t.id!==id));
  if(tables.length===0&&!isGestor)return <div style={{textAlign:"center",color:"#9CA3AF",padding:40,fontSize:13}}>Nenhuma tabela disponível.</div>;
  return (
    <div>
      {tables.map(t=>(
        <div key={t.id} style={{background:"white",borderRadius:14,border:"1.5px solid #E5E7EB",overflow:"hidden",boxShadow:"0 2px 8px rgba(0,0,0,0.04)",marginBottom:10}}>
          <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:"#F9FAFB",borderBottom:open===t.id?"1px solid #E5E7EB":"none",cursor:"pointer"}}
            onClick={()=>setOpen(open===t.id?null:t.id)}>
            <span style={{fontSize:16}}>📊</span>
            <span style={{flex:1,fontWeight:700,fontSize:13,color:"#111827"}}>{t.title||"Tabela sem título"}</span>
            {isGestor&&<div style={{display:"flex",gap:5}} onClick={e=>e.stopPropagation()}>
              <button onClick={()=>setEditing(t)} style={{padding:"3px 8px",borderRadius:6,border:"none",background:"#EEF1FF",color:"#4F6EF7",fontSize:11,fontWeight:700}}>✏ Editar</button>
              <button onClick={()=>del(t.id)} style={{padding:"3px 8px",borderRadius:6,border:"none",background:"#FEE2E2",color:"#EF4444",fontSize:11}}>✕</button>
            </div>}
            <span style={{color:"#9CA3AF",fontSize:13}}>{open===t.id?"▲":"▼"}</span>
          </div>
          {open===t.id&&<div style={{overflowX:"auto",padding:12}}>
            <table style={{borderCollapse:"collapse",width:"100%",fontSize:12}}>
              <thead><tr>{t.headers.map((h,i)=><th key={i} style={{padding:"7px 10px",background:"#EEF1FF",color:"#4F6EF7",fontWeight:700,textAlign:"left",borderBottom:"2px solid #4F6EF7"}}>{h}</th>)}</tr></thead>
              <tbody>{t.rows.map((row,ri)=><tr key={ri} style={{background:ri%2===0?"white":"#FAFAFA"}}>{row.map((cell,ci)=><td key={ci} style={{padding:"7px 10px",borderBottom:"1px solid #E5E7EB",color:"#374151"}}>{cell}</td>)}</tr>)}</tbody>
            </table>
          </div>}
        </div>
      ))}
      {isGestor&&<button onClick={()=>setShowNew(true)} style={{width:"100%",padding:11,borderRadius:12,border:"2px dashed #4F6EF7",background:"#EEF1FF",color:"#4F6EF7",fontWeight:800,fontSize:13}}>+ Nova Tabela</button>}
      {(editing||showNew)&&<TableEditor table={editing} onSave={save} onClose={()=>{setEditing(null);setShowNew(false);}}/>}
    </div>
  );
}

function App(){
  const [session,setSession]=useState(()=>loadSess());
  const [db,setDb]=useState(()=>loadDB());
  const [nav,setNav]=useState("home");
  const [sideOpen,setSideOpen]=useState(true);
  const [editItem,setEditItem]=useState(null);
  const [editSection,setEditSection]=useState(null);
  const [addSection,setAddSection]=useState(null);
  const [showUsers,setShowUsers]=useState(false);
  const [showTabs,setShowTabs]=useState(false);
  const [showPanel,setShowPanel]=useState(false);
  const [toast,setToast]=useState(null);
  const pollRef=useRef();

  const isGestor=session?.role==="gestor";

  useEffect(()=>{
    pollRef.current=setInterval(()=>{
      const fresh=loadDB();
      if(fresh.lastUpdated!==db.lastUpdated) setDb(fresh);
    },1500);
    return()=>clearInterval(pollRef.current);
  },[db.lastUpdated]);

  const persist=useCallback(d=>{const u={...d,lastUpdated:Date.now()};setDb(u);saveDB(u);},[]);
  const showT=(msg,type="ok")=>{setToast({msg,type});setTimeout(()=>setToast(null),2500);};

  const saveItem=(sec,item)=>{
    const list=db[sec]||[];
    const upd=list.find(x=>x.id===item.id)?list.map(x=>x.id===item.id?{...x,...item}:x):[...list,{...item,id:Date.now()}];
    persist({...db,[sec]:upd});
    setEditItem(null);setEditSection(null);setAddSection(null);
    showT("Salvo com sucesso!");
  };
  const delItem=(sec,id)=>{persist({...db,[sec]:(db[sec]||[]).filter(x=>x.id!==id)});showT("Item removido.","err");};

  if(!session) return <Login onLogin={s=>{setSession(s);}}/>;

  const tabs=db.tabs||DEFAULT_DB.tabs;

  const renderPage=()=>{
    if(nav==="home") return <HomePage db={db} isGestor={isGestor} onEdit={(s,it)=>{setEditSection(s);setEditItem(it);}} onDelete={delItem} onAdd={s=>setAddSection(s)}/>;
    if(nav==="scores") return <FullSection title="Scores" sub="Avaliações e escalas neonatais" icon="📋" items={db.scores} section="scores" isGestor={isGestor} onEdit={it=>{setEditSection("scores");setEditItem(it);}} onDelete={id=>delItem("scores",id)} onAdd={()=>setAddSection("scores")} cols={3}/>;
    if(nav==="calculos") return <FullSection title="Cálculos" sub="Ferramentas de cálculo" icon="🧮" items={db.calculos} section="calculos" isGestor={isGestor} onEdit={it=>{setEditSection("calculos");setEditItem(it);}} onDelete={id=>delItem("calculos",id)} onAdd={()=>setAddSection("calculos")} cols={3}/>;
    if(nav==="grafico") return (
      <div style={{animation:"fadeIn 0.3s ease"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18}}><span style={{fontSize:26}}>📈</span><div><div style={{fontSize:20,fontWeight:800,color:"#111827"}}>Gráfico de Crescimento</div><div style={{fontSize:12,color:"#9CA3AF"}}>Curvas OMS</div></div></div>
        <Card title="Gráfico de Crescimento" sub="Curvas de crescimento (OMS)" icon="📈"><GrowthChartSVG/></Card>
      </div>

    if(nav==="medicacoes") return <FullSection title="Medicações" sub="Calculadoras de medicações" icon="💊" items={db.medicacoes} section="medicacoes" isGestor={isGestor} onEdit={it=>{setEditSection("medicacoes");setEditItem(it);}} onDelete={id=>delItem("medicacoes",id)} onAdd={()=>setAddSection("medicacoes")} cols={2}/>;
    if(nav==="doencas") return <FullSection title="Doenças Neonatais" sub="Protocolos e orientações" icon="🧬" items={db.doencas} section="doencas" isGestor={isGestor} onEdit={it=>{setEditSection("doencas");setEditItem(it);}} onDelete={id=>delItem("doencas",id)} onAdd={()=>setAddSection("doencas")} cols={4}/>;
    if(nav==="vacinas") return <FullSection title="Vacinas" sub="Calendário e dose" icon="💉" items={db.vacinas} section="vacinas" isGestor={isGestor} onEdit={it=>{setEditSection("vacinas");setEditItem(it);}} onDelete={id=>delItem("vacinas",id)} onAdd={()=>setAddSection("vacinas")} cols={2}/>;
    const curTab=tabs.find(t=>t.id===nav)||{icon:"📌",label:"Seção"};
    return (
      <div style={{animation:"fadeIn 0.3s ease"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18}}><span style={{fontSize:26}}>{curTab.icon}</span><div><div style={{fontSize:20,fontWeight:800,color:"#111827"}}>{curTab.label}</div><div style={{fontSize:12,color:"#9CA3AF"}}>Seção personalizada</div></div></div>
        <Card title="Tabelas" sub="Tabelas e referências desta seção" icon="📊">
          <TablesSection tables={db.tabelas||[]} isGestor={isGestor} onUpdate={t=>{persist({...db,tabelas:t});showT("Tabelas atualizadas!");}}/>
        </Card>
        {isGestor&&<div style={{marginTop:12,padding:14,background:"#EEF1FF",borderRadius:14,border:"1.5px solid #4F6EF7",fontSize:13,color:"#4F6EF7",fontWeight:600}}>💡 Use o painel do gestor para adicionar itens a qualquer seção.</div>}
      </div>
    );
  };

              <span style={{fontSize:15,flexShrink:0}}>{t.icon}</span>

        {showPanel&&isGestor&&<div style={{background:"linear-gradient(90deg,#1E2D6E,#2D4299)",padding:"9px 18px",display:"flex",gap:6,alignItems:"center",flexWrap:"wrap",borderBottom:"1px solid rgba(255,255,255,0.1)"}}>
          <span style={{color:"rgba(255,255,255,0.65)",fontSize:11,fontWeight:700,marginRight:4}}>⚙️ GESTOR:</span>
          {[["👥 Usuários",()=>setShowUsers(true)],["🗂️ Abas",()=>setShowTabs(true)],["📋 + Score",()=>setAddSection("scores")],["🧮 + Cálculo",()=>setAddSection("calculos")],["💊 + Medicação",()=>setAddSection("medicacoes")],["🧬 + Doença",()=>setAddSection("doencas")],["💉 + Vacina",()=>setAddSection("vacinas")]].map(([l,fn],i)=>(
            <button key={i} onClick={fn} style={{padding:"5px 11px",borderRadius:8,border:"1px solid rgba(255,255,255,0.15)",background:"rgba(255,255,255,0.08)",color:"rgba(255,255,255,0.85)",fontSize:11,fontWeight:700,transition:"all 0.15s"}}
              onMouseEnter={e=>e.currentTarget.style.background="rgba(255,255,255,0.2)"}
              onMouseLeave={e=>e.currentTarget.style.background="rgba(255,255,255,0.08)"}>{l}</button>
          ))}
        </div>}

        {/* CONTENT */}
        <main style={{flex:1,overflowY:"auto",padding:"16px 20px"}}>
          {renderPage()}
        </main>
      </div>

      {/* MODALS */}
      {(editItem||addSection)&&<ItemEditor item={editItem} section={editSection||addSection} onSave={form=>saveItem(editSection||addSection,form)} onClose={()=>{setEditItem(null);setEditSection(null);setAddSection(null);}}/>}
      {showUsers&&<UserManager onClose={()=>setShowUsers(false)}/>}
      {showTabs&&<TabManager tabs={db.tabs||DEFAULT_DB.tabs} onSave={t=>{persist({...db,tabs:t});setShowTabs(false);showT("Abas atualizadas!");}} onClose={()=>setShowTabs(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
