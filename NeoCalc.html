    {id:3,color:"#EF4444",bg:"#FEF2F2",icon:"😢",title:"Escala de Dor",sub:"NIPS • PIPP • N-PASS",content:"Avaliação multidimensional da dor neonatal.\n\nNIPS (Neonatal Infant Pain Scale):\n• Expressão facial (0-1)\n• Choro (0-2)\n• Respiração (0-1)\n• Braços (0-1)\n• Pernas (0-1)\n• Estado de alerta (0-2)\nTotal >3: dor presente\n\nN-PASS: avalia dor e sedação em RN.",active:true},

    {id:2,color:"#22C55E",bg:"#EDFDF5",icon:"⚖️",title:"Balanço Hídrico",sub:"Entrada e saída de líquidos",content:"Controle do balanço hídrico em 24h.\n\nEntradas: EV + enteral + medicações\nSaídas: diurese + perdas insensíveis + fezes\n\nPerdas insensíveis:\n• RN a termo: 15-20ml/kg/dia\n• RNPT: 30-60ml/kg/dia\n• Sob fototerapia: +30%\n\nMeta: balanço ligeiramente positivo nas primeiras 48h",active:true},
    {id:3,color:"#EF4444",bg:"#FEF2F2",icon:"🦶",title:"Índice Gestacional Corrigido",sub:"Idade corrigida do recém-nascido",content:"Cálculo da idade gestacional corrigida (IGC).\n\nFórmula: IGC = IG ao nascer + semanas pós-natal\n\nUsar IGC para:\n• Avaliação do desenvolvimento\n• Curvas de crescimento\n• Vacinas\n• Critérios de alta\n\nExemplo: RN de 30 sem, com 8 sem de vida\nIGC = 30 + 8 = 38 semanas",active:true},

    {id:5,color:"#F97316",bg:"#FFF7ED",icon:"🫘",title:"TFG",sub:"Taxa de Filtração Glomerular",content:"Avaliação da função renal neonatal.\n\nFórmula de Schwartz:\nTFG = k × comprimento (cm) / creatinina sérica\n\nk = 0,45 (RN a termo)\nk = 0,33 (RNPT)\n\nNormal em RN a termo: 20-40ml/min/1,73m²\nNormal em RNPT: 10-15ml/min/1,73m²\n\nOligúria: diurese <1ml/kg/h",active:true},
    {id:6,color:"#0EA5E9",bg:"#F0F9FF",icon:"🫁",title:"Oxygenation Index (OI)",sub:"(MAP × FiO₂ × 100) / PaO₂",content:"Índice de oxigenação para avaliação de gravidade.\n\nFórmula: OI = (MAP × FiO₂ × 100) / PaO₂\n\nInterpretação:\nOI <15: disfunção leve\nOI 15-25: moderada\nOI >25: grave → considerar VAFO\nOI >40: indicação de ECMO\n\nFiO₂ em fração (ex: 60% = 0,6)",active:true},
    {id:7,color:"#EF4444",bg:"#FEF2F2",icon:"💊",title:"Drogas de Infusão Contínua — BIC",sub:"Vasoativos · Sedoanalgesia · Diuréticos",content:"Cálculo de BIC para drogas vasoativas e sedoanalgesia em neonatologia.",active:true},

    {id:2,color:"#22C55E",bg:"#EDFDF5",icon:"☕",title:"Cafeína em Neonatologia",sub:"Dose de ataque e manutenção",content:"Tratamento de apneia da prematuridade.\n\nIndicação: apneia em RNPT <34 semanas\n\nDose:\n• Ataque: 20mg/kg IV ou VO (1x)\n• Manutenção: 5-10mg/kg/dia (24/24h)\n• Início 24h após ataque\n\nSuspender: IG corrigida ≥34-36 semanas\n\nEfeitos adversos: taquicardia, irritabilidade",active:true},

    {id:2,color:"#F59E0B",bg:"#FFFBEB",icon:"🧬",title:"Sífilis",sub:"Conduta em RN exposto",content:"Protocolo de sífilis congênita.\n\nInvestigar RN quando:\n• Mãe com sífilis sem tratamento\n• Tratamento inadequado da mãe\n• Mãe não tratada\n\nExames: VDRL, hemograma, Rx ossos, LCR\n\nTratamento:\n• Sífilis congênita confirmada: Pen.G cristalina 50.000UI/kg/dose 12/12h × 10 dias\n• Exposição sem confirmação: Pen.G benzatina 50.000UI/kg dose única",active:true},
    {id:3,color:"#22C55E",bg:"#EDFDF5",icon:"🦠",title:"Toxoplasmose",sub:"Conduta em RN exposto",content:"Toxoplasmose congênita.\n\nInvestigar se mãe soroconverteu na gestação.\n\nExames: IgM/IgG, fundo de olho, TC crânio, LCR\n\nTratamento (12 meses):\n• Pirimetamina 1mg/kg/dia\n• Sulfadiazina 100mg/kg/dia (12/12h)\n• Ácido folínico 10mg 3x/semana\n\nMonitorar: hemograma quinzenal",active:true},
    {id:4,color:"#EC4899",bg:"#FDF2F8",icon:"❤️",title:"Persistência de Duto Arterial",sub:"Avaliação e conduta",content:"PDA hemodinamicamente significativo.\n\nDiagnóstico: ecocardiograma\n\nTratamento clínico:\n• Restrição hídrica\n• Ibuprofeno: 10-5-5mg/kg/dia VO/EV\n• Indometacina: 0,1-0,2mg/kg EV\n\nContraindicações: CrS >1,8, plaquetas <60mil, enterocolite\n\nCirurgia (ligadura): falha do tratamento clínico\n\nFechamento espontâneo: frequente em RNPT >28sem",active:true},
  ],
  vacinas:[
    {id:1,color:"#4F6EF7",bg:"#EEF1FF",icon:"💉",title:"BCG",sub:"Dose única intradérmica RN ≥ 2.000g",content:"Vacina BCG intradérmica.\n\nIndicação: RN com peso ≥2.000g\n\nDose: 0,1ml intradérmico\nLocal: região deltoide direita\n\nContraindicações:\n• Peso <2.000g\n• Imunodeficiência grave\n• RN exposto ao HIV (aguardar PCR)\n\nReação esperada: pápula → pústula → cicatriz (3-12 semanas)",active:true},
  ],

// ── COMPONENTS ───────────────────────────────────────────────────────────────

function Toast({msg,type}){
  return <div style={{position:"fixed",top:16,right:16,zIndex:9999,padding:"10px 18px",borderRadius:12,background:type==="err"?"#FEE2E2":"#DCFCE7",color:type==="err"?"#DC2626":"#16A34A",fontWeight:700,fontSize:13,boxShadow:"0 4px 20px rgba(0,0,0,0.15)",border:`1.5px solid ${type==="err"?"#FCA5A5":"#86EFAC"}`,animation:"slideIn 0.3s ease"}}>{type==="err"?"✕ ":"✓ "}{msg}</div>;
}

function Modal({title,onClose,children}){
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={onClose}>
      <div style={{background:"white",borderRadius:20,padding:24,width:"100%",maxWidth:520,maxHeight:"88vh",overflowY:"auto",boxShadow:"0 20px 60px rgba(0,0,0,0.3)",animation:"fadeIn 0.2s ease"}} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
          <h3 style={{margin:0,fontSize:16,fontWeight:800,color:"#111827"}}>{title}</h3>
          <button onClick={onClose} style={{background:"#F3F4F6",border:"none",borderRadius:8,width:30,height:30,fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>×</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function Inp({label,value,onChange,type="text",placeholder="",rows}){
  const s={width:"100%",padding:"9px 12px",borderRadius:10,border:"1.5px solid #E5E7EB",fontSize:13,color:"#111827",outline:"none",boxSizing:"border-box",background:"#FAFAFA",fontFamily:"inherit"};
  return (
    <div style={{marginBottom:12}}>
      {label&&<label style={{fontSize:11,fontWeight:700,color:"#374151",display:"block",marginBottom:4}}>{label}</label>}
      {rows?<textarea value={value} onChange={e=>onChange(e.target.value)} rows={rows} placeholder={placeholder} style={{...s,resize:"vertical"}}/>
           :<input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={s}/>}
    </div>
  );
}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function Login({onLogin}){
  const [login,setLogin]=useState("");
  const [pass,setPass]=useState("");
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);

  const go=()=>{
    if(!login||!pass){setErr("Preencha login e senha.");return;}
    setLoading(true);
    setTimeout(()=>{
      const u=loadUsers().find(x=>x.login===login&&x.password===pass&&x.active);
      if(u){const s={userId:u.id,name:u.name,role:u.role,avatar:u.avatar};saveSess(s);onLogin(s);}
      else setErr("Credenciais inválidas. Solicite acesso ao Dr. Rodrigo Cahuana.");
      setLoading(false);
    },700);
  };

  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#0f172a 0%,#1e3a8a 50%,#0f172a 100%)",display:"flex",alignItems:"center",justifyContent:"center",padding:16,fontFamily:"'Nunito','Segoe UI',sans-serif"}}>
      {[...Array(6)].map((_,i)=><div key={i} style={{position:"fixed",borderRadius:"50%",background:`rgba(79,110,247,${0.03+i*0.015})`,width:180+i*100,height:180+i*100,top:`${i*14-10}%`,left:`${i*12-5}%`,pointerEvents:"none"}}/>)}
      <div style={{position:"relative",zIndex:1,width:"100%",maxWidth:400}}>
        <div style={{background:"rgba(255,255,255,0.05)",backdropFilter:"blur(20px)",borderRadius:24,padding:36,border:"1px solid rgba(255,255,255,0.1)",boxShadow:"0 25px 80px rgba(0,0,0,0.5)"}}>
          <div style={{textAlign:"center",marginBottom:24}}>
            <div style={{width:72,height:72,borderRadius:20,background:"linear-gradient(135deg,#7C9EFF,#4F6EF7)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:36,margin:"0 auto 12px",boxShadow:"0 8px 32px rgba(79,110,247,0.4)"}}>👶</div>
            <h1 style={{color:"white",fontSize:28,fontWeight:900,letterSpacing:-0.5,margin:0}}>NeoCalc</h1>
            <p style={{color:"rgba(255,255,255,0.45)",fontSize:12,marginTop:4}}>Cálculos e Scores em Neonatologia</p>
          </div>
          <div style={{background:"rgba(79,110,247,0.15)",border:"1px solid rgba(79,110,247,0.3)",borderRadius:12,padding:"10px 14px",marginBottom:20,display:"flex",gap:10,alignItems:"center"}}>
            <span style={{fontSize:20}}>👨‍⚕️</span>
            <div>
              <div style={{color:"rgba(255,255,255,0.9)",fontSize:12,fontWeight:700}}>Gestor: Dr. Rodrigo Cahuana</div>
              <div style={{color:"rgba(255,255,255,0.4)",fontSize:10}}>Acesso somente com credenciais autorizadas</div>
            </div>
          </div>
          <div style={{marginBottom:12}}>
            <label style={{color:"rgba(255,255,255,0.6)",fontSize:11,fontWeight:700,display:"block",marginBottom:4}}>LOGIN</label>
            <input value={login} onChange={e=>setLogin(e.target.value)} placeholder="Seu login" onKeyDown={e=>e.key==="Enter"&&go()}
              style={{width:"100%",padding:"11px 14px",borderRadius:12,border:"1.5px solid rgba(255,255,255,0.1)",background:"rgba(255,255,255,0.07)",color:"white",fontSize:14,outline:"none",boxSizing:"border-box",fontFamily:"inherit"}}/>
          </div>
          <div style={{marginBottom:16}}>
            <label style={{color:"rgba(255,255,255,0.6)",fontSize:11,fontWeight:700,display:"block",marginBottom:4}}>SENHA</label>
            <input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="Sua senha" onKeyDown={e=>e.key==="Enter"&&go()}
              style={{width:"100%",padding:"11px 14px",borderRadius:12,border:"1.5px solid rgba(255,255,255,0.1)",background:"rgba(255,255,255,0.07)",color:"white",fontSize:14,outline:"none",boxSizing:"border-box",fontFamily:"inherit"}}/>
          </div>
          {err&&<div style={{background:"rgba(239,68,68,0.15)",border:"1px solid rgba(239,68,68,0.3)",borderRadius:10,padding:"8px 12px",color:"#FCA5A5",fontSize:12,marginBottom:14}}>{err}</div>}
          <button onClick={go} disabled={loading}
            style={{width:"100%",padding:13,borderRadius:13,border:"none",background:"linear-gradient(90deg,#4F6EF7,#7C9EFF)",color:"white",fontWeight:800,fontSize:14,boxShadow:"0 4px 20px rgba(79,110,247,0.4)",opacity:loading?0.7:1}}>
            {loading?"Entrando...":"Entrar no NeoCalc"}
          </button>
          <p style={{color:"rgba(255,255,255,0.3)",fontSize:11,textAlign:"center",marginTop:16,lineHeight:1.6}}>Sem acesso? Solicite ao gestor<br/>Dr. Rodrigo Cahuana</p>
        </div>
      </div>
    </div>
  );
}

// ── ITEM EDITOR ───────────────────────────────────────────────────────────────
function ItemEditor({item,section,onSave,onClose}){

// ── USER MANAGER ──────────────────────────────────────────────────────────────
function UserManager({onClose}){
  const [users,setUsers]=useState(loadUsers());
  const [showAdd,setShowAdd]=useState(false);
  const [f,setF]=useState({name:"",login:"",password:"",specialty:"Neonatologia",avatar:"👩‍⚕️",role:"usuario",active:true});
  const sf=(k,v)=>setF(x=>({...x,[k]:v}));
  const add=()=>{
    if(!f.name||!f.login||!f.password)return;
    const u=[...users,{...f,id:Date.now().toString()}];
    setUsers(u);saveUsers(u);setShowAdd(false);
    setF({name:"",login:"",password:"",specialty:"Neonatologia",avatar:"👩‍⚕️",role:"usuario",active:true});
  };
  const tog=id=>{const u=users.map(x=>x.id===id?{...x,active:!x.active}:x);setUsers(u);saveUsers(u);};
  const del=id=>{const u=users.filter(x=>x.id!==id);setUsers(u);saveUsers(u);};
  return (
    <Modal title="👥 Gerenciar Usuários" onClose={onClose}>
      <div style={{marginBottom:14}}>
        {users.map(u=>(
          <div key={u.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:12,border:"1.5px solid #E5E7EB",marginBottom:8,background:u.active?"#FAFAFA":"#F3F4F6",opacity:u.active?1:0.65}}>
            <span style={{fontSize:22}}>{u.avatar}</span>
            <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700,color:"#111827"}}>{u.name}</div><div style={{fontSize:10,color:"#9CA3AF"}}>@{u.login} · {u.role==="gestor"?"Gestor":"Usuário"}</div></div>
            {u.id!=="admin"?<div style={{display:"flex",gap:5}}>
              <button onClick={()=>tog(u.id)} style={{padding:"3px 10px",borderRadius:7,border:"none",background:u.active?"#DCFCE7":"#FEE2E2",color:u.active?"#16A34A":"#DC2626",fontSize:11,fontWeight:700}}>{u.active?"Ativo":"Inativo"}</button>
              <button onClick={()=>del(u.id)} style={{padding:"3px 8px",borderRadius:7,border:"none",background:"#FEE2E2",color:"#DC2626",fontSize:12}}>🗑</button>
            </div>:<span style={{padding:"4px 10px",borderRadius:7,background:"linear-gradient(90deg,#4F6EF7,#7C9EFF)",color:"white",fontSize:11,fontWeight:700}}>Gestor</span>}
          </div>
        ))}
      </div>
      {!showAdd?<button onClick={()=>setShowAdd(true)} style={{width:"100%",padding:11,borderRadius:12,border:"2px dashed #4F6EF7",background:"#EEF1FF",color:"#4F6EF7",fontWeight:800,fontSize:13}}>+ Adicionar Novo Usuário</button>:(
        <div style={{background:"#F9FAFB",borderRadius:14,padding:14,border:"1.5px solid #E5E7EB"}}>
          <div style={{fontWeight:800,color:"#111827",marginBottom:10,fontSize:13}}>Novo Usuário</div>
          <div style={{display:"flex",gap:6,marginBottom:10}}>
            {["👨‍⚕️","👩‍⚕️","🧑‍⚕️","👶","🏥"].map(av=><button key={av} onClick={()=>sf("avatar",av)} style={{width:36,height:36,borderRadius:9,border:f.avatar===av?"2px solid #4F6EF7":"1.5px solid #E5E7EB",background:f.avatar===av?"#EEF1FF":"white",fontSize:20}}>{av}</button>)}
          </div>
          <Inp label="Nome completo" value={f.name} onChange={v=>sf("name",v)} placeholder="Dr. Nome Sobrenome"/>
          <Inp label="Login" value={f.login} onChange={v=>sf("login",v)} placeholder="usuario.login"/>
          <Inp label="Senha inicial" value={f.password} onChange={v=>sf("password",v)} type="password" placeholder="Senha"/>

// ── TABLE EDITOR ──────────────────────────────────────────────────────────────
function TableEditor({table,onSave,onClose}){
  const [title,setTitle]=useState(table?.title||"");
  const [headers,setHeaders]=useState(table?.headers||["Coluna 1","Coluna 2","Coluna 3"]);
  const [rows,setRows]=useState(table?.rows||[["","",""],["","",""]]);
  const addCol=()=>{setHeaders(h=>[...h,"Nova Coluna"]);setRows(r=>r.map(row=>[...row,""]));};
  const addRow=()=>setRows(r=>[...r,headers.map(()=>"")]);
  const setH=(i,v)=>setHeaders(h=>h.map((c,j)=>j===i?v:c));
  const setC=(ri,ci,v)=>setRows(rs=>rs.map((row,r)=>r===ri?row.map((c,ci2)=>ci2===ci?v:c):row));
  const remRow=i=>setRows(r=>r.filter((_,j)=>j!==i));
  const remCol=i=>{setHeaders(h=>h.filter((_,j)=>j!==i));setRows(r=>r.map(row=>row.filter((_,j)=>j!==i)));};
  return (
    <Modal title={table?"Editar Tabela":"Nova Tabela"} onClose={onClose}>
      <Inp label="Título da Tabela" value={title} onChange={setTitle} placeholder="Ex: Tabela de Antibióticos"/>
      <div style={{overflowX:"auto",marginBottom:12}}>
        <table style={{borderCollapse:"collapse",width:"100%",fontSize:12}}>
          <thead><tr>
            {headers.map((h,i)=><th key={i} style={{padding:6,borderBottom:"2px solid #4F6EF7",minWidth:90}}>
              <div style={{display:"flex",gap:3,alignItems:"center"}}>
                <input value={h} onChange={e=>setH(i,e.target.value)} style={{border:"none",background:"#EEF1FF",padding:"4px 6px",borderRadius:6,fontSize:11,fontWeight:700,color:"#4F6EF7",width:"100%",outline:"none",fontFamily:"inherit"}}/>
                {headers.length>1&&<button onClick={()=>remCol(i)} style={{background:"none",border:"none",color:"#EF4444",fontSize:12,flexShrink:0}}>✕</button>}
              </div>
            </th>)}
            <th style={{padding:6}}><button onClick={addCol} style={{background:"#EEF1FF",border:"none",borderRadius:6,padding:"4px 8px",color:"#4F6EF7",fontSize:12,fontWeight:700}}>+ Col</button></th>
          </tr></thead>
          <tbody>{rows.map((row,ri)=>(
            <tr key={ri} style={{background:ri%2===0?"#FAFAFA":"white"}}>
              {row.map((cell,ci)=><td key={ci} style={{padding:"3px 5px",border:"1px solid #E5E7EB"}}>
                <input value={cell} onChange={e=>setC(ri,ci,e.target.value)} style={{border:"none",background:"transparent",padding:"2px 4px",fontSize:12,color:"#374151",width:"100%",outline:"none",fontFamily:"inherit"}}/>
              </td>)}
              <td style={{padding:4}}><button onClick={()=>remRow(ri)} style={{background:"none",border:"none",color:"#EF4444",fontSize:12}}>✕</button></td>
            </tr>
          ))}</tbody>
        </table>
      </div>
      <button onClick={addRow} style={{width:"100%",padding:8,borderRadius:9,border:"2px dashed #22C55E",background:"#EDFDF5",color:"#16A34A",fontWeight:700,fontSize:12,marginBottom:14}}>+ Linha</button>
      <div style={{display:"flex",gap:8}}>
        <button onClick={onClose} style={{flex:1,padding:10,borderRadius:10,border:"1.5px solid #E5E7EB",background:"white",color:"#374151",fontWeight:700}}>Cancelar</button>
        <button onClick={()=>onSave({...table,title,headers,rows,id:table?.id||Date.now()})} style={{flex:2,padding:10,borderRadius:10,border:"none",background:"linear-gradient(90deg,#4F6EF7,#7C9EFF)",color:"white",fontWeight:800}}>Salvar Tabela</button>
      </div>
    </Modal>
  );
}

// ── GROWTH CHART SVG ──────────────────────────────────────────────────────────
function GrowthChartSVG(){
  const W=360,H=170,PL=38,PB=26,PT=8,PR=8;
  const cW=W-PL-PR,cH=H-PB-PT;
  const xS=m=>PL+(m/12)*cW, yS=w=>PT+cH-((w/11000))*cH;
  const pathFor=arr=>arr.map((v,i)=>`${i===0?"M":"L"}${xS(MONTHS[i])},${yS(v)}`).join(" ");
  return (
    <svg width={W} height={H} style={{overflow:"visible",maxWidth:"100%"}}>
      <defs><filter id="sh2"><feDropShadow dx="0" dy="2" stdDeviation="3" floodOpacity="0.12"/></filter></defs>
      {[0,2000,4000,6000,8000,10000].map(v=><line key={v} x1={PL} x2={W-PR} y1={yS(v)} y2={yS(v)} stroke="#E5E7EB" strokeWidth="1"/>)}
      {MONTHS.map(m=><line key={m} x1={xS(m)} x2={xS(m)} y1={PT} y2={H-PB} stroke="#E5E7EB" strokeWidth="1"/>)}
      {[0,2000,4000,6000,8000,10000].map(v=><text key={v} x={PL-5} y={yS(v)+4} textAnchor="end" fontSize="9" fill="#9CA3AF">{v===0?"0":v/1000+"k"}</text>)}
      {MONTHS.map(m=><text key={m} x={xS(m)} y={H-PB+14} textAnchor="middle" fontSize="9" fill="#9CA3AF">{m}</text>)}
      {Object.entries(PERC).map(([k,arr])=><path key={k} d={pathFor(arr)} fill="none" stroke={PC[k]} strokeWidth="2" strokeLinecap="round"/>)}
      <circle cx={xS(2)} cy={yS(2450)} r="5" fill="#4F6EF7" stroke="white" strokeWidth="2"/>
      <rect x={xS(2)+8} y={yS(2450)-20} width="106" height="40" rx="6" fill="white" stroke="#E5E7EB" filter="url(#sh2)"/>
      <text x={xS(2)+14} y={yS(2450)-7} fontSize="9" fill="#6B7280">Idade: 5 dias</text>
      <text x={xS(2)+14} y={yS(2450)+4} fontSize="9" fill="#374151" fontWeight="bold">Peso: 2.450 g</text>
      <text x={xS(2)+14} y={yS(2450)+14} fontSize="9" fill="#22C55E">Percentil: P50</text>
    </svg>
  );
}

// ── RODWELL CALCULATOR ────────────────────────────────────────────────────────
function RodwellCalc({item,onClose}){
  const [vals,setVals]=useState({leucocitos:"",it:"",pmnImaduros:"",plaquetas:"",pcr:"n"});
  const [resultado,setResultado]=useState(null);
  const sv=(k,v)=>setVals(x=>({...x,[k]:v}));

  const calcular=()=>{
    const leuco=parseFloat(vals.leucocitos);
    const it=parseFloat(vals.it);
    const pmn=parseFloat(vals.pmnImaduros);
    const plaq=parseFloat(vals.plaquetas);
    const pcr=vals.pcr;
    if(isNaN(leuco)||isNaN(it)||isNaN(pmn)||isNaN(plaq)){
      setResultado({erro:"Preencha todos os campos numéricos."});return;
    }
    let pontos=0, criterios=[];
    if(leuco<5000){pontos++;criterios.push({ok:true,texto:"Leucócitos <5.000/mm³",valor:`${leuco.toLocaleString("pt-BR")}/mm³`,pts:"+1pt"});}
    else criterios.push({ok:false,texto:"Leucócitos <5.000/mm³",valor:`${leuco.toLocaleString("pt-BR")}/mm³`,pts:"0pt"});
    if(leuco>30000){pontos++;criterios.push({ok:true,texto:"Leucócitos >30.000/mm³",valor:`${leuco.toLocaleString("pt-BR")}/mm³`,pts:"+1pt"});}
    else criterios.push({ok:false,texto:"Leucócitos >30.000/mm³",valor:`${leuco.toLocaleString("pt-BR")}/mm³`,pts:"0pt"});
    if(it>=0.2){pontos++;criterios.push({ok:true,texto:"Relação I/T ≥0,2",valor:it.toFixed(2),pts:"+1pt"});}
    else criterios.push({ok:false,texto:"Relação I/T ≥0,2",valor:it.toFixed(2),pts:"0pt"});
    if(pmn>=1500){pontos++;criterios.push({ok:true,texto:"PMN imaturos ≥1.500/mm³",valor:`${pmn.toLocaleString("pt-BR")}/mm³`,pts:"+1pt"});}
    else criterios.push({ok:false,texto:"PMN imaturos ≥1.500/mm³",valor:`${pmn.toLocaleString("pt-BR")}/mm³`,pts:"0pt"});
    if(plaq<150000){pontos++;criterios.push({ok:true,texto:"Plaquetas <150.000/mm³",valor:`${plaq.toLocaleString("pt-BR")}/mm³`,pts:"+1pt"});}
    else criterios.push({ok:false,texto:"Plaquetas <150.000/mm³",valor:`${plaq.toLocaleString("pt-BR")}/mm³`,pts:"0pt"});
    if(pcr==="s"){pontos++;criterios.push({ok:true,texto:"PCR positiva (>10 mg/L)",valor:"Positiva",pts:"+1pt"});}
    else criterios.push({ok:false,texto:"PCR positiva (>10 mg/L)",valor:"Negativa",pts:"0pt"});

    let interp,cor,bgCor,emoji,conduta;
    if(pontos===0){interp="Sepse muito improvável";cor="#16A34A";bgCor="#DCFCE7";emoji="✅";conduta="Observação clínica. Não iniciar antibiótico empiricamente.";}
    else if(pontos<=2){interp="Sepse possível";cor="#D97706";bgCor="#FEF9C3";emoji="⚠️";conduta="Considerar coleta de hemocultura e observação. Antibiótico a critério clínico.";}
    else if(pontos<=4){interp="Sepse provável";cor="#DC2626";bgCor="#FEE2E2";emoji="🔴";conduta="Iniciar antibioticoterapia empírica. Coletar hemocultura antes do antibiótico. Ampicilina + Gentamicina.";}
    else{interp="Sepse muito provável / Confirmada";cor="#7F1D1D";bgCor="#FEE2E2";emoji="🚨";conduta="Iniciar antibioticoterapia imediatamente. Hemocultura urgente. Considerar UTI Neonatal.";}
    setResultado({pontos,criterios,interp,cor,bgCor,emoji,conduta});
  };

  const limpar=()=>{setVals({leucocitos:"",it:"",pmnImaduros:"",plaquetas:"",pcr:"n"});setResultado(null);};

  const inpS={width:"100%",padding:"9px 12px",borderRadius:10,border:"1.5px solid #E5E7EB",fontSize:13,color:"#111827",outline:"none",background:"#FAFAFA",fontFamily:"inherit",boxSizing:"border-box"};
  const lbS={fontSize:11,fontWeight:700,color:"#374151",display:"block",marginBottom:4};

  return (
    <Modal title="🧠 Escore Hematológico de Rodwell" onClose={onClose}>
      {/* Header */}
      <div style={{display:"flex",gap:12,alignItems:"center",marginBottom:16,padding:"10px 14px",background:"#EEF1FF",borderRadius:12,border:"1.5px solid #4F6EF720"}}>
        <div style={{width:46,height:46,borderRadius:13,background:"linear-gradient(135deg,#7C9EFF,#4F6EF7)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,flexShrink:0}}>🧠</div>
        <div>
          <div style={{fontSize:13,fontWeight:800,color:"#1E2D6E"}}>Avaliação de Sepse Neonatal</div>
          <div style={{fontSize:11,color:"#6B7280",marginTop:2}}>6 critérios hematológicos · Pontuação 0–6</div>
        </div>
      </div>

      {/* Inputs */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
        <div>
          <label style={lbS}>Leucócitos totais <span style={{color:"#9CA3AF",fontWeight:400}}>(células/mm³)</span></label>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"3px 16px"}}>
          {[["Leucócitos <5.000/mm³","Leucócitos >30.000/mm³"],["Relação I/T ≥0,2","PMN imaturos ≥1.500/mm³"],["Plaquetas <150.000/mm³","PCR >10 mg/L"]].map((pair,i)=>
            pair.map(c=><div key={c} style={{fontSize:10.5,color:"#6B7280",padding:"2px 0"}}>• {c}</div>)

          {/* Score badge */}
          <div style={{background:resultado.bgCor,borderRadius:14,padding:"14px 16px",marginBottom:14,border:`2px solid ${resultado.cor}30`,textAlign:"center"}}>

            <div style={{fontSize:36,fontWeight:900,color:resultado.cor,lineHeight:1}}>{resultado.pontos}<span style={{fontSize:18,fontWeight:600,color:resultado.cor+"99"}}>/6</span></div>

          {/* Critérios detalhados */}
          <div style={{marginBottom:14}}>
            <div style={{fontSize:11,fontWeight:700,color:"#9CA3AF",marginBottom:8}}>DETALHAMENTO DOS CRITÉRIOS</div>
            {resultado.criterios.map((c,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 10px",borderRadius:9,marginBottom:5,background:c.ok?"#DCFCE7":"#F9FAFB",border:`1px solid ${c.ok?"#86EFAC":"#E5E7EB"}`}}>
                <span style={{fontSize:16,flexShrink:0}}>{c.ok?"✅":"⭕"}</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:12,fontWeight:600,color:c.ok?"#15803D":"#374151"}}>{c.texto}</div>

                <span style={{fontSize:12,fontWeight:800,color:c.ok?"#16A34A":"#9CA3AF",background:c.ok?"#BBF7D0":"#F3F4F6",padding:"3px 8px",borderRadius:6}}>{c.pts}</span>
              </div>

          </div>
          {/* Conduta */}
          <div style={{background:"linear-gradient(135deg,#1E2D6E,#2D4299)",borderRadius:14,padding:"14px 16px",color:"white"}}>

            <div style={{fontSize:13,lineHeight:1.6,color:"rgba(255,255,255,0.9)"}}>{resultado.conduta}</div>
          </div>
          {/* Interpretação tabela */}
          <div style={{marginTop:14,background:"#F9FAFB",borderRadius:12,padding:"10px 14px",border:"1px solid #E5E7EB"}}>
            <div style={{fontSize:11,fontWeight:700,color:"#9CA3AF",marginBottom:8}}>TABELA DE INTERPRETAÇÃO</div>
            {[{pts:"0",interp:"Sepse muito improvável",cor:"#16A34A",bg:"#DCFCE7"},{pts:"1–2",interp:"Sepse possível",cor:"#D97706",bg:"#FEF9C3"},{pts:"3–4",interp:"Sepse provável",cor:"#DC2626",bg:"#FEE2E2"},{pts:"5–6",interp:"Sepse muito provável",cor:"#7F1D1D",bg:"#FEE2E2"}].map(row=>(
              <div key={row.pts} style={{display:"flex",alignItems:"center",gap:10,padding:"6px 8px",borderRadius:8,marginBottom:4,background:row.bg,border:`1px solid ${row.cor}20`}}>
                <span style={{width:32,height:24,borderRadius:6,background:row.cor,color:"white",fontWeight:800,fontSize:12,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{row.pts}</span>
                <span style={{fontSize:12,fontWeight:600,color:row.cor}}>{row.interp}</span>
              </div>
            ))}

        </div>
      ))}
    </Modal>
  );
}

// ── BILIRUBIN CALCULATOR ──────────────────────────────────────────────────────
// Limites baseados no nomograma de Bhutani / AAP 2004 (tabelas por IG e horas de vida)
// Limiares para RN ≥35 sem SEM fatores de risco (conservadores)
// Tabela: [horasMin, horasMax, observar_max, foto_simples_max, foto_intensiva_max]
// Acima do foto_intensiva_max → exsanguíneotransfusão
function getBilirubinThresholds(ig, horas) {
  // Ajuste por IG: quanto mais prematuro, limiares mais baixos
  // Base: IG 40sem. Redução: -1mg/dL por semana abaixo de 38sem (simplificado)
  const igAdj = Math.max(0, (38 - Math.min(ig, 38)));
  // Curva de Bhutani por horas de vida (zona de risco — valores aproximados em mg/dL)
  // [horas, observar, fotoSimples, fotoIntensiva] → acima de fotoIntensiva = EST
  const tabela = [
    [0,   12,  5,   8,   11],
    [12,  24,  7,   10,  13],
    [24,  36,  9,   12,  15],
    [36,  48,  11,  14,  17],
    [48,  60,  12,  15,  18],
    [60,  72,  13,  16,  19],
    [72,  84,  13,  16,  20],
    [84,  96,  13,  17,  20],
    [96,  108, 14,  17,  21],
    [108, 120, 14,  17,  21],
    [120, 144, 15,  18,  22],
    [144, 999, 15,  18,  22],
  ];
  const linha = tabela.find(r => horas >= r[0] && horas < r[1]) || tabela[tabela.length-1];
  return {
    observar:       Math.max(1, linha[2] - igAdj),
    fotoSimples:    Math.max(2, linha[3] - igAdj),
    fotoIntensiva:  Math.max(3, linha[4] - igAdj),
  };
}

function BilirubinCalc({onClose}){
  const [ig,setIg]=useState("");
  const [horas,setHoras]=useState("");
  const [bili,setBili]=useState("");
  const [risco,setRisco]=useState("baixo"); // baixo | alto
  const [resultado,setResultado]=useState(null);

  const calcular=()=>{
    const igN=parseFloat(ig), horasN=parseFloat(horas), biliN=parseFloat(bili);
    if(isNaN(igN)||isNaN(horasN)||isNaN(biliN)){setResultado({erro:"Preencha todos os campos."});return;}
    if(igN<23||igN>42){setResultado({erro:"IG deve estar entre 23 e 42 semanas."});return;}
    if(horasN<0||horasN>336){setResultado({erro:"Horas de vida deve ser entre 0 e 336h (14 dias)."});return;}
    if(biliN<0||biliN>50){setResultado({erro:"Bilirrubina deve ser entre 0 e 50 mg/dL."});return;}

    const th = getBilirubinThresholds(igN, horasN);
    // Se fatores de risco, limiares -2mg/dL
    const adj = risco==="alto" ? 2 : 0;
    const limObs      = th.observar - adj;
    const limFotoSimp = th.fotoSimples - adj;
    const limFotoInt  = th.fotoIntensiva - adj;

    let conduta, cor, bgCor, emoji, nivel, detalhe, urgencia;
    if(biliN < limObs){
      nivel="Zona Segura — Observar";
      conduta="Observação clínica e monitoramento. Estimular alimentação frequente (8-12x/dia). Repetir bilirrubina conforme evolução clínica.";
      detalhe="Nível abaixo do limiar de fototerapia. Não há indicação de tratamento no momento.";
      cor="#16A34A"; bgCor="#DCFCE7"; emoji="✅"; urgencia="OBSERVAR";
    } else if(biliN < limFotoSimp){
      nivel="Zona de Atenção — Risco Intermediário";
      conduta="Considerar fototerapia profilática. Monitoramento rigoroso a cada 4-6h. Avaliar fatores de risco adicionais.";
      detalhe="Nível na zona intermediária. Reavaliar em 4-6h com nova bilirrubina. Estimular aleitamento materno.";
      cor="#D97706"; bgCor="#FEF9C3"; emoji="⚠️"; urgencia="ATENÇÃO";
    } else if(biliN < limFotoInt){
      nivel="Indicação de Fototerapia Simples";
      conduta="INICIAR FOTOTERAPIA SIMPLES. Expor a maior área corporal possível. Proteger os olhos. Manter hidratação. Repetir bilirrubina em 4-6h após início.";
      detalhe="Nível acima do limiar de fototerapia simples. Iniciar imediatamente e monitorar resposta.";
      cor="#EA580C"; bgCor="#FFF7ED"; emoji="💡"; urgencia="FOTOTERAPIA SIMPLES";
    } else if(biliN < limFotoInt + 3){
      nivel="Indicação de Fototerapia Intensiva";
      conduta="INICIAR FOTOTERAPIA INTENSIVA (bercinho de fibra óptica + LED de alta potência). Cobrir máxima área corporal. Hidratação endovenosa se necessário. Controle em 2-4h. Preparar para exsanguíneotransfusão se não houver resposta.";
      detalhe="Nível elevado — risco de kernicterus. Resposta inadequada à fototerapia simples esperada.";
      cor="#DC2626"; bgCor="#FEE2E2"; emoji="🔴"; urgencia="FOTOTERAPIA INTENSIVA";
    } else {
      nivel="Indicação de Exsanguíneotransfusão (EST)";
      conduta="INDICAÇÃO DE EXSANGUÍNEOTRANSFUSÃO. Iniciar fototerapia intensiva IMEDIATAMENTE enquanto prepara EST. Acionar UTI Neonatal e banco de sangue URGENTE. Monitorar sinais de encefalopatia bilirrubínica (hipotonia, opistótono, choro agudo).";
      detalhe="Nível crítico — risco iminente de kernicterus/encefalopatia bilirrubínica aguda.";
      cor="#7F1D1D"; bgCor="#FEE2E2"; emoji="🚨"; urgencia="EXSANGUÍNEOTRANSFUSÃO";
    }

    // Porcentagem visual da barra
    const maxBili=30;
    const pctBili=Math.min(100,(biliN/maxBili)*100);
    const pctObs=Math.min(100,(limObs/maxBili)*100);
    const pctFotoS=Math.min(100,(limFotoSimp/maxBili)*100);
    const pctFotoI=Math.min(100,(limFotoInt/maxBili)*100);

    setResultado({nivel,conduta,detalhe,cor,bgCor,emoji,urgencia,
      limObs,limFotoSimp,limFotoInt,biliN,igN,horasN,
      pctBili,pctObs,pctFotoS,pctFotoI,adj});
  };

  const limpar=()=>{setIg("");setHoras("");setBili("");setRisco("baixo");setResultado(null);};
  const inpS={width:"100%",padding:"10px 12px",borderRadius:10,border:"1.5px solid #E5E7EB",fontSize:14,color:"#111827",outline:"none",background:"#FAFAFA",fontFamily:"inherit",boxSizing:"border-box",textAlign:"center",fontWeight:700};
  const lbS={fontSize:11,fontWeight:700,color:"#374151",display:"block",marginBottom:5,textAlign:"center"};

  return (
    <Modal title="👶 Calculadora de Hiperbilirrubinemia" onClose={onClose}>
      {/* Header */}
      <div style={{display:"flex",gap:12,alignItems:"center",marginBottom:16,padding:"10px 14px",background:"linear-gradient(135deg,#FFFBEB,#FEF9C3)",borderRadius:12,border:"1.5px solid #F59E0B30"}}>
        <div style={{width:46,height:46,borderRadius:13,background:"linear-gradient(135deg,#FCD34D,#F59E0B)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,flexShrink:0,boxShadow:"0 4px 12px rgba(245,158,11,0.3)"}}>👶</div>
        <div>
          <div style={{fontSize:13,fontWeight:800,color:"#92400E"}}>Nomograma de Bhutani — AAP 2004</div>
          <div style={{fontSize:11,color:"#B45309",marginTop:2}}>Limiares ajustados por IG e fatores de risco</div>
        </div>
      </div>

      {/* 3 main inputs */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:14}}>
        <div>
          <label style={lbS}>IG <span style={{color:"#9CA3AF",fontWeight:400}}>(semanas)</span></label>
          <input style={inpS} type="number" min="23" max="42" value={ig} onChange={e=>setIg(e.target.value)} placeholder="Ex: 38"/>
          <div style={{fontSize:9,color:"#9CA3AF",textAlign:"center",marginTop:3}}>23–42 semanas</div>
        </div>
        <div>
          <label style={lbS}>Horas de vida</label>
          <input style={inpS} type="number" min="0" max="336" value={horas} onChange={e=>setHoras(e.target.value)} placeholder="Ex: 48"/>
          <div style={{fontSize:9,color:"#9CA3AF",textAlign:"center",marginTop:3}}>0–336 horas</div>
        </div>
        <div>
          <label style={lbS}>Bilirrubina <span style={{color:"#9CA3AF",fontWeight:400}}>(mg/dL)</span></label>
          <input style={{...inpS,color:"#F59E0B",fontSize:16}} type="number" step="0.1" min="0" max="50" value={bili} onChange={e=>setBili(e.target.value)} placeholder="Ex: 12.5"/>
          <div style={{fontSize:9,color:"#9CA3AF",textAlign:"center",marginTop:3}}>mg/dL</div>
        </div>
      </div>

      {/* Fatores de risco */}
      <div style={{marginBottom:14}}>
        <label style={{fontSize:11,fontWeight:700,color:"#374151",display:"block",marginBottom:6}}>Fatores de Risco <span style={{color:"#9CA3AF",fontWeight:400}}>(altera os limiares)</span></label>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          {[
            ["baixo","🟢 Sem fatores de risco","RN ≥38 sem, saudável"],
            ["alto","🔴 Com fatores de risco","Aloimunização, G6PD, asfixia, instab. térmica, sepse, acidose, albumina <3g/dL"],
          ].map(([v,l,sub])=>(
            <button key={v} onClick={()=>setRisco(v)} style={{padding:"9px 10px",borderRadius:11,border:`2px solid ${risco===v?(v==="baixo"?"#22C55E":"#EF4444"):"#E5E7EB"}`,background:risco===v?(v==="baixo"?"#DCFCE7":"#FEE2E2"):"white",cursor:"pointer",textAlign:"left",transition:"all 0.15s"}}>
              <div style={{fontSize:12,fontWeight:700,color:risco===v?(v==="baixo"?"#16A34A":"#DC2626"):"#374151"}}>{l}</div>
              <div style={{fontSize:9.5,color:"#9CA3AF",marginTop:2,lineHeight:1.3}}>{sub}</div>
            </button>
          ))}
        </div>
      </div>

      <div style={{display:"flex",gap:8,marginBottom:16}}>
        <button onClick={limpar} style={{flex:1,padding:"10px",borderRadius:10,border:"1.5px solid #E5E7EB",background:"white",color:"#374151",fontWeight:700,fontSize:13}}>🔄 Limpar</button>
        <button onClick={calcular} style={{flex:2,padding:"11px",borderRadius:10,border:"none",background:"linear-gradient(90deg,#F59E0B,#FBBF24)",color:"white",fontWeight:800,fontSize:14,boxShadow:"0 4px 14px rgba(245,158,11,0.4)"}}>⚡ Calcular</button>
      </div>

      {/* Resultado */}
      {resultado&&(resultado.erro?(
        <div style={{background:"#FEE2E2",borderRadius:12,padding:14,color:"#DC2626",fontWeight:600,fontSize:13}}>⚠️ {resultado.erro}</div>
      ):(
        <div style={{animation:"fadeIn 0.3s ease"}}>
          {/* Urgency badge */}
          <div style={{background:resultado.bgCor,borderRadius:16,padding:"14px 16px",marginBottom:14,border:`2px solid ${resultado.cor}40`,textAlign:"center"}}>
            <div style={{fontSize:34,marginBottom:4}}>{resultado.emoji}</div>
            <div style={{display:"inline-block",padding:"5px 16px",borderRadius:20,background:resultado.cor,color:"white",fontWeight:900,fontSize:13,letterSpacing:0.5,marginBottom:8}}>{resultado.urgencia}</div>
            <div style={{fontSize:13,fontWeight:700,color:resultado.cor,lineHeight:1.4}}>{resultado.nivel}</div>
          </div>

          {/* Bilirubin value vs thresholds */}
          <div style={{background:"#F9FAFB",borderRadius:14,padding:"12px 14px",marginBottom:14,border:"1px solid #E5E7EB"}}>
            <div style={{fontSize:11,fontWeight:700,color:"#9CA3AF",marginBottom:10}}>📊 BILIRRUBINA vs LIMIARES (IG {resultado.igN}sem · {resultado.horasN}h de vida{resultado.adj>0?" · com fatores de risco":""})</div>
            {/* Bar chart */}
            <div style={{position:"relative",height:32,borderRadius:10,background:"linear-gradient(90deg,#DCFCE7 0%,#DCFCE7 var(--p1),#FEF9C3 var(--p1),#FEF9C3 var(--p2),#FFF7ED var(--p2),#FFF7ED var(--p3),#FEE2E2 var(--p3),#FEE2E2 100%)",overflow:"hidden",marginBottom:6}}
              style={{position:"relative",height:32,borderRadius:10,overflow:"hidden",marginBottom:6,background:"#F3F4F6"}}>
              {/* color zones */}
              <div style={{position:"absolute",top:0,left:0,width:`${resultado.pctObs}%`,height:"100%",background:"#DCFCE7"}}/>
              <div style={{position:"absolute",top:0,left:`${resultado.pctObs}%`,width:`${resultado.pctFotoS-resultado.pctObs}%`,height:"100%",background:"#FEF9C3"}}/>
              <div style={{position:"absolute",top:0,left:`${resultado.pctFotoS}%`,width:`${resultado.pctFotoI-resultado.pctFotoS}%`,height:"100%",background:"#FED7AA"}}/>
              <div style={{position:"absolute",top:0,left:`${resultado.pctFotoI}%`,width:`${100-resultado.pctFotoI}%`,height:"100%",background:"#FEE2E2"}}/>
              {/* Patient marker */}
              <div style={{position:"absolute",top:0,left:`${Math.min(98,resultado.pctBili)}%`,width:3,height:"100%",background:resultado.cor,transform:"translateX(-50%)"}}/>
              <div style={{position:"absolute",top:"50%",left:`${Math.min(96,resultado.pctBili)}%`,transform:"translate(-50%,-50%)",background:resultado.cor,color:"white",borderRadius:6,padding:"2px 6px",fontSize:11,fontWeight:900,whiteSpace:"nowrap"}}>{resultado.biliN} mg/dL</div>
            </div>
            {/* Legend */}
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
              {[["#DCFCE7","#16A34A","Seguro"],["#FEF9C3","#D97706","Atenção"],["#FED7AA","#EA580C","Foto Simples"],["#FEE2E2","#DC2626","Foto Intensiva/EST"]].map(([bg,c,l])=>(
                <div key={l} style={{display:"flex",alignItems:"center",gap:4}}>
                  <div style={{width:10,height:10,borderRadius:3,background:bg,border:`1px solid ${c}40`}}/>
                  <span style={{fontSize:10,color:"#6B7280"}}>{l}</span>
                </div>
              ))}
            </div>
            {/* Threshold values */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
              {[
                {label:"Limite Observar",val:resultado.limObs,cor:"#16A34A",bg:"#DCFCE7"},
                {label:"Foto Simples",val:resultado.limFotoSimp,cor:"#D97706",bg:"#FEF9C3"},
                {label:"Foto Intensiva",val:resultado.limFotoInt,cor:"#DC2626",bg:"#FEE2E2"},
              ].map(t=>(
                <div key={t.label} style={{background:t.bg,borderRadius:9,padding:"8px 8px",textAlign:"center",border:`1px solid ${t.cor}30`}}>
                  <div style={{fontSize:9,color:t.cor,fontWeight:700,marginBottom:2}}>{t.label}</div>
                  <div style={{fontSize:16,fontWeight:900,color:t.cor}}>{t.val.toFixed(1)}</div>
                  <div style={{fontSize:9,color:t.cor+"99"}}>mg/dL</div>
                </div>
              ))}
            </div>
          </div>

          {/* Conduta */}
          <div style={{background:"linear-gradient(135deg,#92400E,#B45309)",borderRadius:14,padding:"14px 16px",marginBottom:14,color:"white"}}>
            <div style={{fontSize:11,fontWeight:700,color:"rgba(255,255,255,0.65)",marginBottom:6}}>💊 CONDUTA RECOMENDADA</div>
            <div style={{fontSize:13,lineHeight:1.7,color:"rgba(255,255,255,0.95)"}}>{resultado.conduta}</div>
          </div>

          {/* Detalhe */}

// ── OXYGENATION INDEX CALCULATOR ─────────────────────────────────────────────
function OICalc({onClose}){
  const [map,setMap]=useState("");
  const [fio2,setFio2]=useState("");
  const [pao2,setPao2]=useState("");
  const [modo,setModo]=useState("frac"); // frac=0-1, pct=0-100
  const [resultado,setResultado]=useState(null);

  const calcular=()=>{
    const mapN=parseFloat(map);
    let fio2N=parseFloat(fio2);
    const pao2N=parseFloat(pao2);
    if(isNaN(mapN)||isNaN(fio2N)||isNaN(pao2N)){
      setResultado({erro:"Preencha todos os campos."});return;
    }
    if(mapN<=0||mapN>60){setResultado({erro:"MAP deve ser entre 1 e 60 cmH₂O."});return;}
    if(modo==="pct"){
      if(fio2N<21||fio2N>100){setResultado({erro:"FiO₂ em porcentagem deve ser entre 21 e 100%."});return;}
      fio2N=fio2N/100;
    } else {
      if(fio2N<0.21||fio2N>1){setResultado({erro:"FiO₂ em fração deve ser entre 0,21 e 1,0."});return;}
    }
    if(pao2N<=0||pao2N>600){setResultado({erro:"PaO₂ deve ser entre 1 e 600 mmHg."});return;}

    const oi=parseFloat(((mapN*fio2N*100)/pao2N).toFixed(1));

    // Relação PaO2/FiO2 (índice de Berlin)
    const pfRatio=parseFloat((pao2N/fio2N).toFixed(0));

    let nivel,cor,bgCor,emoji,gravidade,conduta,ecmo=false;
    if(oi<5){
      nivel="Oxigenação Normal";gravidade="Normal";
      cor="#16A34A";bgCor="#DCFCE7";emoji="✅";
      conduta="Parâmetros ventilatórios dentro da normalidade. Manter monitoramento contínuo de SpO₂. Otimizar parâmetros conforme evolução clínica. Considerar desmame ventilatório se clinicamente estável.";
    } else if(oi<10){
      nivel="Disfunção Respiratória Leve";gravidade="Leve";
      cor="#16A34A";bgCor="#DCFCE7";emoji="🟡";
      conduta="Monitoramento intensivo. Otimizar FiO₂ e PEEP. Verificar posicionamento do tubo. Avaliar necessidade de surfactante se RNPT com SDR. Gasometria seriada a cada 2-4h.";
    } else if(oi<15){
      nivel="Disfunção Respiratória Moderada";gravidade="Moderada";
      cor="#D97706";bgCor="#FEF9C3";emoji="⚠️";
      conduta="Considerar aumento de PEEP (5-8 cmH₂O). Avaliar estratégia de recrutamento alveolar. Considerar surfactante se RNPT. Ventilação protetora: volume corrente 4-6ml/kg, FR 40-60irpm. Gasometria 1-2h.";
    } else if(oi<20){
      nivel="Disfunção Respiratória Grave";gravidade="Grave";
      cor="#EA580C";bgCor="#FFF7ED";emoji="🔴";
      conduta="CONSIDERAR VAFO (Ventilação de Alta Frequência Oscilatória). Avaliar NO inalatório se HPPRN associada. Surfactante indicado em RNPT. Otimizar sedoanalgesia. Posição prona se aplicável. Acionar UTI Neonatal de referência.";
    } else if(oi<25){
      nivel="Insuficiência Respiratória Muito Grave";gravidade="Muito Grave";
      cor="#DC2626";bgCor="#FEE2E2";emoji="🚨";
      conduta="INDICAÇÃO DE VAFO. Iniciar NO inalatório (5-20ppm) se HPPRN. Avaliar surfactante de resgate. Descartar pneumotórax (Rx urgente). Considerar ECMO se OI persistir >25 por mais de 4-6h. Contato com centro de ECMO.";
    } else if(oi<40){
      nivel="Insuficiência Respiratória Crítica — Pré-ECMO";gravidade="Crítica";
      cor="#7F1D1D";bgCor="#FEE2E2";emoji="🆘";ecmo=true;
      conduta="CRITÉRIO PARA AVALIAÇÃO DE ECMO. Iniciar VAFO + NO inalatório imediatamente se não iniciado. Surfactante de resgate. Contato URGENTE com centro de ECMO. Estabilizar hemodinamicamente: dopamina/dobutamina se necessário. Verificar acesso venoso central.";
    } else {
      nivel="Indicação Formal de ECMO";gravidade="ECMO";
      cor="#1E1B4B";bgCor="#EDE9FE";emoji="🔴";ecmo=true;
      conduta="INDICAÇÃO FORMAL DE ECMO (OI>40). Acionar centro de ECMO IMEDIATAMENTE. Manter VAFO + NO inalatório durante transporte. Estabilização hemodinâmica urgente. Consentimento informado da família. Preparar para transferência se necessário.";
    }

    // Visual gauge %
    const oiMax=50;
    const pct=Math.min(99,Math.round((oi/oiMax)*100));

    // P/F ratio classification
    let pfClass,pfCor;
    if(pfRatio>=300){pfClass="Normal";pfCor="#16A34A";}
    else if(pfRatio>=200){pfClass="SARA Leve";pfCor="#D97706";}
    else if(pfRatio>=100){pfClass="SARA Moderada";pfCor="#EA580C";}
    else{pfClass="SARA Grave";pfCor="#DC2626";}

    setResultado({oi,nivel,cor,bgCor,emoji,gravidade,conduta,ecmo,pct,pfRatio,pfClass,pfCor,mapN,fio2N,pao2N});
  };

  const limpar=()=>{setMap("");setFio2("");setPao2("");setModo("frac");setResultado(null);};

  const inpS={width:"100%",padding:"11px 12px",borderRadius:10,border:"1.5px solid #E5E7EB",fontSize:15,color:"#111827",outline:"none",background:"#FAFAFA",fontFamily:"inherit",boxSizing:"border-box",textAlign:"center",fontWeight:700};
  const lbS={fontSize:11,fontWeight:700,color:"#374151",display:"block",marginBottom:5};

  return (
    <Modal title="🫁 Oxygenation Index (OI)" onClose={onClose}>
      {/* Header */}
      <div style={{display:"flex",gap:12,alignItems:"center",marginBottom:16,padding:"10px 14px",background:"linear-gradient(135deg,#F0F9FF,#E0F2FE)",borderRadius:12,border:"1.5px solid #0EA5E920"}}>
        <div style={{width:46,height:46,borderRadius:13,background:"linear-gradient(135deg,#38BDF8,#0EA5E9)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,flexShrink:0,boxShadow:"0 4px 12px rgba(14,165,233,0.35)"}}>🫁</div>
        <div>
          <div style={{fontSize:13,fontWeight:800,color:"#0C4A6E"}}>Índice de Oxigenação Neonatal</div>
          <div style={{fontSize:11,color:"#0369A1",marginTop:2}}>Fórmula: OI = (MAP × FiO₂ × 100) / PaO₂</div>
        </div>
      </div>

      {/* FiO2 mode toggle */}
      <div style={{marginBottom:12}}>
        <label style={lbS}>Formato da FiO₂</label>
        <div style={{display:"flex",gap:8}}>
          {[["frac","Fração (0,21–1,0)"],["pct","Porcentagem (21–100%)"]].map(([v,l])=>(
            <button key={v} onClick={()=>setModo(v)} style={{flex:1,padding:"8px 10px",borderRadius:10,border:`1.5px solid ${modo===v?"#0EA5E9":"#E5E7EB"}`,background:modo===v?"#F0F9FF":"white",color:modo===v?"#0369A1":"#6B7280",fontWeight:modo===v?700:500,fontSize:12,transition:"all 0.15s"}}>{l}</button>
          ))}
        </div>
      </div>

      {/* 3 inputs */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:14}}>
        <div>
          <label style={{...lbS,textAlign:"center"}}>MAP <span style={{color:"#9CA3AF",fontWeight:400}}>(cmH₂O)</span></label>
          <input style={inpS} type="number" step="0.5" min="1" max="60" value={map} onChange={e=>setMap(e.target.value)} placeholder="Ex: 12"/>
          <div style={{fontSize:9,color:"#9CA3AF",textAlign:"center",marginTop:3}}>Pressão média via aérea</div>
        </div>
        <div>
          <label style={{...lbS,textAlign:"center"}}>FiO₂ <span style={{color:"#9CA3AF",fontWeight:400}}>{modo==="frac"?"(0,21–1,0)":"(21–100%)"}</span></label>
          <input style={{...inpS,color:"#0EA5E9"}} type="number" step={modo==="frac"?"0.01":"1"} value={fio2} onChange={e=>setFio2(e.target.value)} placeholder={modo==="frac"?"Ex: 0,60":"Ex: 60"}/>
          <div style={{fontSize:9,color:"#9CA3AF",textAlign:"center",marginTop:3}}>Fração O₂ inspirado</div>
        </div>
        <div>
          <label style={{...lbS,textAlign:"center"}}>PaO₂ <span style={{color:"#9CA3AF",fontWeight:400}}>(mmHg)</span></label>
          <input style={{...inpS,color:"#7C3AED"}} type="number" step="1" min="1" max="600" value={pao2} onChange={e=>setPao2(e.target.value)} placeholder="Ex: 55"/>
          <div style={{fontSize:9,color:"#9CA3AF",textAlign:"center",marginTop:3}}>PaO₂ gasometria arterial</div>
        </div>
      </div>

      {/* Formula preview */}
      <div style={{background:"#F8FAFC",borderRadius:10,padding:"9px 14px",marginBottom:14,border:"1px solid #E5E7EB",textAlign:"center"}}>
        <span style={{fontSize:12,color:"#6B7280"}}>OI = </span>
        <span style={{fontSize:13,fontWeight:700,color:"#0369A1"}}>{map||"MAP"}</span>
        <span style={{fontSize:12,color:"#6B7280"}}> × </span>
        <span style={{fontSize:13,fontWeight:700,color:"#0EA5E9"}}>{fio2?(modo==="frac"?fio2:(parseFloat(fio2)/100).toFixed(2)):"FiO₂"}</span>
        <span style={{fontSize:12,color:"#6B7280"}}> × 100 ÷ </span>
        <span style={{fontSize:13,fontWeight:700,color:"#7C3AED"}}>{pao2||"PaO₂"}</span>
        {map&&fio2&&pao2&&!isNaN(parseFloat(map))&&!isNaN(parseFloat(fio2))&&!isNaN(parseFloat(pao2))&&(
          <span style={{fontSize:14,fontWeight:900,color:"#0C4A6E"}}> = {((parseFloat(map)*(modo==="frac"?parseFloat(fio2):parseFloat(fio2)/100)*100)/parseFloat(pao2)).toFixed(1)}</span>
        )}
      </div>

      <div style={{display:"flex",gap:8,marginBottom:16}}>
        <button onClick={limpar} style={{flex:1,padding:"10px",borderRadius:10,border:"1.5px solid #E5E7EB",background:"white",color:"#374151",fontWeight:700,fontSize:13}}>🔄 Limpar</button>
        <button onClick={calcular} style={{flex:2,padding:"11px",borderRadius:10,border:"none",background:"linear-gradient(90deg,#0EA5E9,#38BDF8)",color:"white",fontWeight:800,fontSize:14,boxShadow:"0 4px 14px rgba(14,165,233,0.4)"}}>⚡ Calcular OI</button>
      </div>

      {resultado&&(resultado.erro?(
        <div style={{background:"#FEE2E2",borderRadius:12,padding:14,color:"#DC2626",fontWeight:600,fontSize:13}}>⚠️ {resultado.erro}</div>
      ):(
        <div style={{animation:"fadeIn 0.3s ease"}}>

          {/* OI result badge */}
          <div style={{background:resultado.bgCor,borderRadius:16,padding:"16px",marginBottom:14,border:`2px solid ${resultado.cor}40`,textAlign:"center"}}>

          </div>

          {/* OI gauge bar */}
          <div style={{background:"#F9FAFB",borderRadius:14,padding:"12px 14px",marginBottom:14,border:"1px solid #E5E7EB"}}>
            <div style={{fontSize:11,fontWeight:700,color:"#9CA3AF",marginBottom:10}}>📊 ESCALA DE GRAVIDADE — OI</div>

              <div style={{position:"absolute",top:0,left:"10%",width:"10%",height:"100%",background:"#D1FAE5"}}/>

              <div style={{position:"absolute",top:0,left:"30%",width:"10%",height:"100%",background:"#FED7AA"}}/>
              <div style={{position:"absolute",top:0,left:"40%",width:"10%",height:"100%",background:"#FECACA"}}/>
              <div style={{position:"absolute",top:0,left:"50%",width:"30%",height:"100%",background:"#FEE2E2"}}/>
              <div style={{position:"absolute",top:0,left:"80%",width:"20%",height:"100%",background:"#EDE9FE"}}/>
              {/* marker */}
              <div style={{position:"absolute",top:0,left:`${Math.min(97,resultado.pct)}%`,width:3,height:"100%",background:resultado.cor,transform:"translateX(-50%)",zIndex:2}}/>
              <div style={{position:"absolute",top:"50%",left:`${Math.min(94,resultado.pct)}%`,transform:"translate(-50%,-50%)",background:resultado.cor,color:"white",borderRadius:6,padding:"2px 7px",fontSize:11,fontWeight:900,whiteSpace:"nowrap",zIndex:3}}>{resultado.oi}</div>
            </div>
            {/* Scale labels */}
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:12,paddingLeft:2}}>
              {["0","5","10","15","20","25","40","50+"].map(v=><span key={v} style={{fontSize:9,color:"#9CA3AF"}}>{v}</span>)}
            </div>
            {/* OI reference grid */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
              {[
                {range:"< 5",desc:"Normal",cor:"#16A34A",bg:"#DCFCE7"},
                {range:"5 – 10",desc:"Leve",cor:"#16A34A",bg:"#D1FAE5"},
                {range:"10 – 15",desc:"Moderado",cor:"#D97706",bg:"#FEF9C3"},
                {range:"15 – 20",desc:"Grave",cor:"#EA580C",bg:"#FFF7ED"},

                {range:"> 40",desc:"ECMO Formal",cor:"#1E1B4B",bg:"#EDE9FE"},

            </div>
          </div>

          {/* Conduta */}
          <div style={{background:"linear-gradient(135deg,#0C4A6E,#0369A1)",borderRadius:14,padding:"14px 16px",marginBottom:14,color:"white"}}>
            <div style={{fontSize:11,fontWeight:700,color:"rgba(255,255,255,0.6)",marginBottom:6}}>💊 CONDUTA RECOMENDADA</div>
